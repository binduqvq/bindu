                    if (newLight > minLightThreshold && newLight > lightMap[y][x]) {
                        lightMap[y][x] = newLight;
                        visited[vy][vx] = true;
                    }
                }
                
                // 向左扩展
                let leftX = xLeft - 1;
                while (leftX >= viewStartX) {
                    const vx = leftX - viewStartX;
                    const vy = y - viewStartY;
                    
                    if (vx < 0 || vx >= visitedWidth || vy < 0 || vy >= visitedHeight) break;
                    if (visited[vy][vx]) break;
                    
                    const block = getBlock(leftX, y);
                    if (!block) break;
                    
                    // 使用相邻像素的光照强度
                    const adjacentLight = lightMap[y][leftX + 1];
                    let newLight = adjacentLight - straightDecay;
                    const blockType = BLOCK_TYPES[block.id];
                    if (blockType && blockType.blocksLight) {
                        newLight = adjacentLight * solidBlockMultiplier;
                    } else if (block.id === 'water') {
                        // 水方块特殊处理：衰减减半
                        newLight = adjacentLight - (straightDecay * 0.5);
                    }
                    
                    if (newLight <= minLightThreshold) break;
                    if (newLight <= lightMap[y][leftX]) break;
                    
                    lightMap[y][leftX] = newLight;
                    visited[vy][vx] = true;
                    leftX--;
                }
                leftX++; // 回到最后一个有效位置
                
                // 向右扩展
                let rightX = xRight + 1;
                while (rightX <= viewEndX) {
                    const vx = rightX - viewStartX;
                    const vy = y - viewStartY;
                    
                    if (vx < 0 || vx >= visitedWidth || vy < 0 || vy >= visitedHeight) break;
                    if (visited[vy][vx]) break;
                    
                    const block = getBlock(rightX, y);
                    if (!block) break;
                    
                    // 使用相邻像素的光照强度
                    const adjacentLight = lightMap[y][rightX - 1];
                    let newLight = adjacentLight - straightDecay;
                    const blockType = BLOCK_TYPES[block.id];
                    if (blockType && blockType.blocksLight) {
                        newLight = adjacentLight * solidBlockMultiplier;
                    } else if (block.id === 'water') {
                        // 水方块特殊处理：衰减减半
                        newLight = adjacentLight - (straightDecay * 0.5);
                    }
                    
                    if (newLight <= minLightThreshold) break;
                    if (newLight <= lightMap[y][rightX]) break;
                    
                    lightMap[y][rightX] = newLight;
                    visited[vy][vx] = true;
                    rightX++;
                }
                rightX--; // 回到最后一个有效位置
                
                // 扫描上下两行，寻找新的扫描线
                for (let direction = -1; direction <= 1; direction += 2) {
                    const nextY = y + direction;
                    if (nextY < viewStartY || nextY > viewEndY) continue;
                    
                    let scanStart = -1;
                    
                    for (let scanX = leftX; scanX <= rightX; scanX++) {
                        const vx = scanX - viewStartX;
                        const vy = nextY - viewStartY;
                        
                        if (vx < 0 || vx >= visitedWidth || vy < 0 || vy >= visitedHeight) continue;
                        
                        const block = getBlock(scanX, nextY);
                        if (!block) continue;
                        
                        const currentLight = lightMap[y][scanX];
                        let newLight = currentLight - straightDecay;
                        
                        const blockType = BLOCK_TYPES[block.id];
                        if (blockType && blockType.blocksLight) {
                            newLight = currentLight * solidBlockMultiplier;
                        } else if (block.id === 'water') {
                            // 水方块特殊处理：衰减减半
                            newLight = currentLight - (straightDecay * 0.5);
                        }
                        
                        const canFill = !visited[vy][vx] && 
                                       newLight > minLightThreshold && 
                                       newLight > lightMap[nextY][scanX];
                        
                        if (canFill) {
                            if (scanStart === -1) {
                                scanStart = scanX;
                            }
                        } else {
                            if (scanStart !== -1) {
                                // 添加新的扫描线
                                if (scanlineTail < queueSize) {
                                    scanlineQueue[scanlineTail++] = {
                                        y: nextY,
                                        xLeft: scanStart,
                                        xRight: scanX - 1,
                                        dy: direction,
                                        parentLight: lightMap[y][scanStart]
                                    };
                                }
                                scanStart = -1;
                            }
                        }
                    }
                    
                    // 处理行尾的扫描线
                    if (scanStart !== -1) {
                        if (scanlineTail < queueSize) {
                            scanlineQueue[scanlineTail++] = {
                                y: nextY,
                                xLeft: scanStart,
                                xRight: rightX,
                                dy: direction,
                                parentLight: lightMap[y][scanStart]
                            };
                        }
                    }
                }
                
                // 处理对角线方向（可选，用于更平滑的光照）
                // 左上和左下
                if (leftX > viewStartX) {
                    for (let direction = -1; direction <= 1; direction += 2) {
                        const diagY = y + direction;
                        const diagX = leftX - 1;
                        
                        if (diagY < viewStartY || diagY > viewEndY) continue;
                        
                        const vx = diagX - viewStartX;
                        const vy = diagY - viewStartY;
                        
                        if (vx < 0 || vx >= visitedWidth || vy < 0 || vy >= visitedHeight) continue;
                        if (visited[vy][vx]) continue;
                        
                        const block = getBlock(diagX, diagY);
                        if (!block) continue;
                        
                        const currentLight = lightMap[y][leftX];
                        let newLight = currentLight - diagonalDecay;
                        
                        const blockType = BLOCK_TYPES[block.id];
                        if (blockType && blockType.blocksLight) {
                            newLight = currentLight * solidBlockMultiplier;
                        } else if (block.id === 'water') {
                            // 水方块特殊处理：对角线衰减也减半
                            newLight = currentLight - (diagonalDecay * 0.5);
                        }
                        
                        if (newLight > minLightThreshold && newLight > lightMap[diagY][diagX]) {
                            lightMap[diagY][diagX] = newLight;
                            visited[vy][vx] = true;
                            
                            if (scanlineTail < queueSize) {
                                scanlineQueue[scanlineTail++] = {
                                    y: diagY,
                                    xLeft: diagX,
                                    xRight: diagX,
                                    dy: direction,
                                    parentLight: newLight
                                };
                            }
                        }
                    }
                }
                
                // 右上和右下
                if (rightX < viewEndX) {
                    for (let direction = -1; direction <= 1; direction += 2) {
                        const diagY = y + direction;
                        const diagX = rightX + 1;
                        
                        if (diagY < viewStartY || diagY > viewEndY) continue;
                        
                        const vx = diagX - viewStartX;
                        const vy = diagY - viewStartY;
                        
                        if (vx < 0 || vx >= visitedWidth || vy < 0 || vy >= visitedHeight) continue;
                        if (visited[vy][vx]) continue;
                        
                        const block = getBlock(diagX, diagY);
                        if (!block) continue;
                        
                        const currentLight = lightMap[y][rightX];
                        let newLight = currentLight - diagonalDecay;
                        
                        const blockType = BLOCK_TYPES[block.id];
                        if (blockType && blockType.blocksLight) {
                            newLight = currentLight * solidBlockMultiplier;
                        } else if (block.id === 'water') {
                            // 水方块特殊处理：对角线衰减也减半
                            newLight = currentLight - (diagonalDecay * 0.5);
                        }
                        
                        if (newLight > minLightThreshold && newLight > lightMap[diagY][diagX]) {
                            lightMap[diagY][diagX] = newLight;
                            visited[vy][vx] = true;
                            
                            if (scanlineTail < queueSize) {
                                scanlineQueue[scanlineTail++] = {
                                    y: diagY,
                                    xLeft: diagX,
                                    xRight: diagX,
                                    dy: direction,
                                    parentLight: newLight
                                };
                            }
                        }
                    }
                }
            }
            
            // 缓存光照图
            gameState.lightMapCache = lightMap;
            gameState.lightMapDirty = false;
            
            return lightMap;
        }
        
        // 渲染深度光影（增强版）- 使用洪水算法
        // 性能优化：降采样、缓存、性能模式
        function renderDepthLighting() {
            const blockSize = WORLD_CONFIG.blockSize;
            const baseTerrainY = WORLD_CONFIG.terrainBaseY * blockSize;
            
            // 获取当前环境光照强度（白天1.0，夜晚0.3）
            const ambientLight = getAmbientLight();
            const isDaytime = ambientLight > 0.7; // 白天判定
            
            // 创建离屏 Canvas 用于绘制光照遮罩
            const lightCanvas = document.createElement('canvas');
            lightCanvas.width = canvas.width;
            lightCanvas.height = canvas.height;
            const lightCtx = lightCanvas.getContext('2d');
            
            // 创建彩色光照层
            const colorLightCanvas = document.createElement('canvas');
            colorLightCanvas.width = canvas.width;
            colorLightCanvas.height = canvas.height;
            const colorLightCtx = colorLightCanvas.getContext('2d');
            
            // 使用洪水算法计算光照图（带缓存）
            const lightMap = calculateFloodLighting();
            
            // 优化1：只计算可见区域的方块列
            const startGridX = Math.max(0, Math.floor(gameState.camera.x / blockSize));
            const endGridX = Math.min(WORLD_CONFIG.width - 1, Math.ceil((gameState.camera.x + canvas.width) / blockSize));
            
            // 收集所有光源（玩家、火把、手持物品等）- 用于夜晚遮罩
            const lightSources = [];
            
            // 玩家光源（仅在手持火把或神器镐时）
            if (gameState.player) {
                const playerWorldX = gameState.player.x + gameState.player.width / 2;
                const playerWorldY = gameState.player.y + gameState.player.height / 2;
                
                // 检查玩家是否手持火把或神器镐
                const selectedSlot = gameState.inventory.slots[gameState.inventory.selectedSlot];
                if (selectedSlot && selectedSlot.item === 'torch') {
                    // 只有手持火把时才有光源
                    let lightRadius = 260; // 手持火把的光源半径
                    
                    lightSources.push({
                        x: playerWorldX,
                        y: playerWorldY,
                        radius: lightRadius,
                        color: { r: 255, g: 200, b: 100 }, // 橙黄色火把光
                        intensity: 1.0,
                        isTemporary: true // 标记为临时光源，不更新探索地图
                    });
                } else if (selectedSlot && selectedSlot.item === 'godPickaxe') {
                    // 手持神器镐时有更强的金色光源
                    let lightRadius = 320; // 神器镐的光源半径（比火把更大）
                    
                    lightSources.push({
                        x: playerWorldX,
                        y: playerWorldY,
                        radius: lightRadius,
                        color: { r: 255, g: 215, b: 0 }, // 金色光芒
                        intensity: 1.2, // 更强的光照强度
                        isTemporary: true // 标记为临时光源，不更新探索地图
                    });
                }
                // 不手持火把或神器镐时，玩家没有光源
            }
            
            // 收集世界中的火把光源（优化：只收集可见区域）
            const startGridY = Math.max(0, Math.floor(gameState.camera.y / blockSize));
            const endGridY = Math.min(WORLD_CONFIG.height - 1, Math.ceil((gameState.camera.y + canvas.height) / blockSize));
            
            for (let gridY = startGridY; gridY <= endGridY; gridY++) {
                for (let gridX = startGridX; gridX <= endGridX; gridX++) {
                    const block = getBlock(gridX, gridY);
                    if (block && block.id !== 'air') {
                        const blockType = BLOCK_TYPES[block.id];
                        if (blockType && blockType.lightSource) {
                            const worldX = (gridX + 0.5) * blockSize;
                            const worldY = (gridY + 0.5) * blockSize;
                            
                            lightSources.push({
                                x: worldX,
                                y: worldY,
                                radius: blockType.lightRadius || 150,
                                color: blockType.lightColor || { r: 255, g: 200, b: 100 },
                                intensity: 1.0,
                                isTemporary: true // 放置的火把也是临时光源，移除后亮度消失
                            });
                        }
                    }
                }
            }
            
            // 步骤1：更新探索地图（已禁用 - 探索地图现在只在挖掘方块时更新）
            // 所有光源（包括手持火把和放置的火把）都是临时的，移除后亮度消失
            // 探索地图只记录被挖掘过的区域，不记录被光照过的区域
            
            // 步骤2：使用洪水算法计算的光照图绘制遮罩
            // 优化：只在实心方块和背景墙上绘制阴影，空气保持透明
            
            // 性能优化：提高降采样率，减少计算量
            const sampleRate = gameState.performanceMode ? 8 : 6; // 正常模式从4改为6，性能模式保持8
            
            // 创建低分辨率的光照图
            const lowResWidth = Math.ceil(canvas.width / sampleRate);
            const lowResHeight = Math.ceil(canvas.height / sampleRate);
            
            const smoothLightCanvas = document.createElement('canvas');
            smoothLightCanvas.width = lowResWidth;
            smoothLightCanvas.height = lowResHeight;
            const smoothLightCtx = smoothLightCanvas.getContext('2d');
            smoothLightCtx.imageSmoothingEnabled = false;
            
            const imageData = smoothLightCtx.createImageData(lowResWidth, lowResHeight);
            const data = imageData.data;
            
            // 遍历低分辨率像素（优化：只处理可见区域）
            for (let y = 0; y < lowResHeight; y++) {
                for (let x = 0; x < lowResWidth; x++) {
                    const screenX = x * sampleRate;
                    const screenY = y * sampleRate;
                    const worldX = screenX + gameState.camera.x;
                    const worldY = screenY + gameState.camera.y;
                    
                    // 检查该像素位置是否是非空气方块（包括树木）或有背景墙的空气方块
                    const gridX = Math.floor(worldX / blockSize);
                    const gridY = Math.floor(worldY / blockSize);
                    
                    // 边界检查：确保gridX和gridY在有效范围内
                    if (gridX < 0 || gridX >= WORLD_CONFIG.width || 
                        gridY < 0 || gridY >= WORLD_CONFIG.height) {
                        // 超出边界的区域设置为完全透明（无阴影）
                        const pixelIndex = (y * lowResWidth + x) * 4;
                        data[pixelIndex] = 0;
                        data[pixelIndex + 1] = 0;
                        data[pixelIndex + 2] = 0;
                        data[pixelIndex + 3] = 0; // 完全透明
                        continue;
                    }
                    
                    const block = getBlock(gridX, gridY);
                    const hasWall = gameState.wallMap && gameState.wallMap[gridY] && gameState.wallMap[gridY][gridX];
                    
                    // 在所有非空气方块上绘制阴影（包括实心方块和树木），以及有背景墙的空气方块
                    // 水方块也需要绘制阴影，但只覆盖水的实际高度部分
                    let darkness = 0;
                    let shouldDrawShadow = false;
                    let waterHeightRatio = 1.0; // 水位比例（默认满格）
                    
                    if (block && block.id === 'water' && block.waterLevel) {
                        // 水方块：根据是否有背景墙决定阴影填充方式
                        waterHeightRatio = block.waterLevel / 8; // 水位比例（0.125 到 1.0）
                        
                        // 检查是否有背景墙
                        if (hasWall) {
                            // 有背景墙（地下水）：填充整个方块
                            shouldDrawShadow = true;
                        } else {
                            // 无背景墙（地表水）：只填充水位部分
                            // 计算当前像素在方块内的相对位置（0到1）
                            const pixelYInBlock = (worldY % blockSize) / blockSize;
                            
                            // 只有当像素在水位以下时才绘制阴影
                            if (pixelYInBlock >= (1 - waterHeightRatio)) {
                                shouldDrawShadow = true;
                            }
                        }
                    } else if ((block && block.id !== 'air') || hasWall) {
                        // 普通方块或有背景墙的空气方块
                        shouldDrawShadow = true;
                    }
                    
                    if (shouldDrawShadow) {
                        // 计算光照强度（用于阴影）
                        const gridXFloat = worldX / blockSize;
                        const gridYFloat = worldY / blockSize;
                        
                        const x0 = Math.floor(gridXFloat);
                        const y0 = Math.floor(gridYFloat);
                        const x1 = x0 + 1;
                        const y1 = y0 + 1;
                        
                        const tx = gridXFloat - x0;
                        const ty = gridYFloat - y0;
                        
                        const getLight = (gx, gy) => {
                            if (gx < 0 || gx >= WORLD_CONFIG.width || gy < 0 || gy >= WORLD_CONFIG.height) {
                                // 边界外的区域：地面以上返回1.0（最亮），地面以下返回0（黑暗）
                                const baseTerrainGridY = WORLD_CONFIG.terrainBaseY;
                                return gy < baseTerrainGridY ? 1.0 : 0;
                            }
                            // 如果lightMap中没有值，也使用相同的逻辑
                            if (!lightMap[gy] || lightMap[gy][gx] === undefined) {
                                const baseTerrainGridY = WORLD_CONFIG.terrainBaseY;
                                return gy < baseTerrainGridY ? 1.0 : 0;
                            }
                            return lightMap[gy][gx];
                        };
                        
                        const light00 = getLight(x0, y0);
                        const light10 = getLight(x1, y0);
                        const light01 = getLight(x0, y1);
                        const light11 = getLight(x1, y1);
                        
                        // 双线性插值
                        const light0 = light00 * (1 - tx) + light10 * tx;
                        const light1 = light01 * (1 - tx) + light11 * tx;
                        const lightLevel = light0 * (1 - ty) + light1 * ty;
                        
                        // 计算阴影强度（光照越低，阴影越深）
                        darkness = 1.0 - Math.pow(lightLevel, 0.75);
                    }
                    
                    // 设置像素值（黑色阴影）
                    const pixelIndex = (y * lowResWidth + x) * 4;
                    data[pixelIndex] = 0;     // R
                    data[pixelIndex + 1] = 0; // G
                    data[pixelIndex + 2] = 0; // B
                    data[pixelIndex + 3] = Math.floor(darkness * 255 * 0.95); // A (0.95为最大暗度)
                }
            }
            
            // 将ImageData绘制到低分辨率canvas
            smoothLightCtx.putImageData(imageData, 0, 0);
            
            // 启用图像平滑，放大时自动插值
            lightCtx.imageSmoothingEnabled = true;
            lightCtx.imageSmoothingQuality = 'low'; // 使用低质量插值以提升性能
            
            // 将低分辨率图像放大到全屏
            lightCtx.drawImage(smoothLightCanvas, 0, 0, canvas.width, canvas.height);
            
            // 恢复正常混合模式
            lightCtx.globalCompositeOperation = 'source-over';
            
            // 步骤3：探索地图已经整合到上面的阴影计算中了（只在实心方块上）
            // 不需要单独处理
            
            // 步骤4：绘制所有光源（挖出光照区域）
            // 创建临时canvas用于合并光源（避免叠加过亮）
            const tempLightCanvas = document.createElement('canvas');
            tempLightCanvas.width = canvas.width;
            tempLightCanvas.height = canvas.height;
            const tempLightCtx = tempLightCanvas.getContext('2d');
            
            // 使用 lighten 模式绘制所有光源到临时canvas，确保不会叠加超过单个光源最大亮度
            tempLightCtx.globalCompositeOperation = 'lighten';
            
            for (const light of lightSources) {
                const screenX = light.x - gameState.camera.x;
                const screenY = light.y - gameState.camera.y;
                
                // 根据深度和时间调整光源强度
                // 白天地表：火把光效减弱（但只对地下光源生效）
                let lightIntensity = light.intensity;
                if (isDaytime && light.depth > 0 && light.depth < 3) {
                    // 白天且在地表以下3格内，光效减弱到30%
                    lightIntensity *= 0.3;
                }
                
                // 创建径向渐变（白色表示光照强度）
                const radialGradient = tempLightCtx.createRadialGradient(
                    screenX, screenY, 0,
                    screenX, screenY, light.radius
                );
                
                // 白色=最亮，黑色=最暗，lighten模式会保留较亮的值
                radialGradient.addColorStop(0, `rgba(255, 255, 255, ${lightIntensity})`);
                radialGradient.addColorStop(0.3, `rgba(255, 255, 255, ${lightIntensity * 0.9})`);
                radialGradient.addColorStop(0.6, `rgba(255, 255, 255, ${lightIntensity * 0.5})`);
                radialGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                
                tempLightCtx.fillStyle = radialGradient;
                tempLightCtx.fillRect(
                    screenX - light.radius, 
                    screenY - light.radius, 
                    light.radius * 2, 
                    light.radius * 2
                );
            }
            
            // 将合并后的光源用 destination-out 模式擦除黑暗
            lightCtx.globalCompositeOperation = 'destination-out';
            lightCtx.drawImage(tempLightCanvas, 0, 0);
            
            // 绘制彩色光晕（使用 lighten 模式避免叠加过亮）
            colorLightCtx.globalCompositeOperation = 'lighten';
            
            for (const light of lightSources) {
                const screenX = light.x - gameState.camera.x;
                const screenY = light.y - gameState.camera.y;
                
                // 大幅减弱彩色光晕强度，避免刺眼
                let colorIntensity = light.intensity * 0.15; // 基础强度降低到15%
                if (isDaytime && light.depth > 0 && light.depth < 3) {
                    colorIntensity *= 0.3; // 白天地表以下进一步减弱
                }
                
                const colorGradient = colorLightCtx.createRadialGradient(
                    screenX, screenY, 0,
                    screenX, screenY, light.radius
                );
                
                const { r, g, b } = light.color;
                // 进一步降低透明度：0.3 -> 0.12, 0.15 -> 0.06
                colorGradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${0.12 * colorIntensity})`);
                colorGradient.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${0.06 * colorIntensity})`);
                colorGradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
                
                colorLightCtx.fillStyle = colorGradient;
                colorLightCtx.fillRect(
                    screenX - light.radius, 
                    screenY - light.radius, 
                    light.radius * 2, 
                    light.radius * 2
                );
            }
            
            // 步骤5：创建缓存canvas（用于下次直接使用）
            if (!gameState.cachedLightingCanvas) {
                gameState.cachedLightingCanvas = document.createElement('canvas');
                gameState.cachedLightingCanvas.width = canvas.width;
                gameState.cachedLightingCanvas.height = canvas.height;
            }
            
            // 确保缓存canvas尺寸正确
            if (gameState.cachedLightingCanvas.width !== canvas.width || 
                gameState.cachedLightingCanvas.height !== canvas.height) {
                gameState.cachedLightingCanvas.width = canvas.width;
                gameState.cachedLightingCanvas.height = canvas.height;
            }
            
            const cacheCtx = gameState.cachedLightingCanvas.getContext('2d');
            cacheCtx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 将光照遮罩绘制到缓存canvas
            cacheCtx.drawImage(lightCanvas, 0, 0);
            
            // 叠加彩色光照到缓存canvas
            cacheCtx.globalCompositeOperation = 'screen';
            cacheCtx.drawImage(colorLightCanvas, 0, 0);
            cacheCtx.globalCompositeOperation = 'source-over';
            
            // 步骤6：将缓存的光照效果绘制到主画布
            ctx.drawImage(gameState.cachedLightingCanvas, 0, 0);
            
            // 步骤7：保存光源信息供夜晚遮罩使用
            gameState.activeLightSources = lightSources;
        }
        
        // 渲染函数
        function render() {
            // 性能优化：使用clearRect代替fillRect清屏（更快）
            // 但由于我们需要绘制天空渐变，所以保持fillRect
            
            // 第一步：绘制动态天空背景（根据时间段）
            const skyColor = getSkyColor();
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, skyColor.top);
            gradient.addColorStop(1, skyColor.bottom);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 第二步：绘制星星（在天空之后，背景之前）
            drawStars(ctx, canvas.width, canvas.height);
            
            // 第三步：绘制太阳（在星星之后，背景之前）
            const sunPos = getSunPosition(canvas.width, canvas.height);
            if (sunPos) {
                drawSun(ctx, sunPos.x, sunPos.y);
            }
            
            // 第四步：绘制月亮（在星星之后，背景之前）
            const moonPos = getMoonPosition(canvas.width, canvas.height);
            if (moonPos) {
                drawMoon(ctx, moonPos.x, moonPos.y);
            }
            
            // 第五步：绘制草原-树林背景（会遮挡日月，只在屏幕下部分）
            if (textures.background) {
                const bgWidth = textures.background.width;
                const bgHeight = textures.background.height;
                
                // 计算地表的世界坐标（像素）
                const terrainBaseWorldY = WORLD_CONFIG.terrainBaseY * WORLD_CONFIG.blockSize; // 256 * 32 = 8192像素
                
                // 计算背景偏移（视差效果：背景移动速度为摄像机的20%）
                const bgOffsetX = (gameState.camera.x * 0.2) % bgWidth;
                // 背景Y偏移应该相对于地表位置，而不是世界顶部
                // 使用Math.max确保偏移不会是负数（防止在地表上方时背景循环）
                const relativeY = Math.max(0, gameState.camera.y - terrainBaseWorldY);
                const bgOffsetY = (relativeY * 0.1) % bgHeight;
                
                // 背景从屏幕36%高度开始绘制
                const skyHeight = canvas.height * 0.36; // 上36%留给天空
                const backgroundStartY = skyHeight; // 从屏幕36%处开始绘制
                
                // 计算需要绘制的背景块数量
                const tilesX = Math.ceil(canvas.width / bgWidth) + 2;
                const tilesY = Math.ceil((canvas.height - skyHeight) / bgHeight) + 2;
                
                // 计算起始位置
                const startX = -bgOffsetX - bgWidth;
                const startY = backgroundStartY - bgOffsetY - bgHeight;
                
                // 设置裁剪区域，只绘制下2/3部分
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, backgroundStartY, canvas.width, canvas.height - backgroundStartY);
                ctx.clip();
                
                // 平铺绘制背景
                for (let ty = 0; ty < tilesY; ty++) {
                    for (let tx = 0; tx < tilesX; tx++) {
                        ctx.drawImage(textures.background, 
                            startX + tx * bgWidth, 
                            startY + ty * bgHeight);
                    }
                }
                
                ctx.restore(); // 恢复裁剪区域
            }
            
            // 第六步：绘制飘动的云朵（在背景之上，方块之下）
            renderClouds();
            
            // 计算可视范围内的方块索引
            const blockSize = WORLD_CONFIG.blockSize;
            const startX = Math.floor(gameState.camera.x / blockSize);
            const startY = Math.floor(gameState.camera.y / blockSize);
            const endX = Math.ceil((gameState.camera.x + canvas.width) / blockSize);
            const endY = Math.ceil((gameState.camera.y + canvas.height) / blockSize);
            
            // 边界处理：确保范围不会超出地图边界（优化：预先计算，避免在循环中重复计算）
            const clampedStartX = Math.max(0, startX);
            const clampedStartY = Math.max(0, startY);
            const clampedEndX = Math.min(WORLD_CONFIG.width, endX);
            const clampedEndY = Math.min(WORLD_CONFIG.height, endY);
            
            // 第一步：绘制背景墙（替换天空背景）
            let renderedWalls = 0;
            if (textures.caveWall && gameState.wallMap) {
                // 直接绘制背景墙到主canvas（避免创建临时canvas）
                for (let y = clampedStartY; y < clampedEndY; y++) {
                    for (let x = clampedStartX; x < clampedEndX; x++) {
                        // 检查是否有背景墙
                        if (gameState.wallMap[y][x]) {
                            const screenX = x * blockSize - gameState.camera.x;
                            const screenY = y * blockSize - gameState.camera.y;
                            
                            // 绘制背景墙纹理
                            ctx.drawImage(textures.caveWall, screenX, screenY, blockSize, blockSize);
                            renderedWalls++;
                        }
                    }
                }
            }
            
            // 第二步：渲染方块（在背景墙之上）- 使用批处理优化
            // 批处理优化：按纹理类型分组收集方块，减少纹理切换和提高缓存局部性
            const blockBatches = new Map(); // 存储每种纹理类型的方块列表
            const crackBatches = new Map(); // 存储需要绘制裂纹的方块列表
            
            // 第一阶段：收集方块数据，按纹理类型分组
            for (let y = clampedStartY; y < clampedEndY; y++) {
                for (let x = clampedStartX; x < clampedEndX; x++) {
                    const block = gameState.worldMap[y][x];
                    
                    // 跳过空气方块
                    if (!block || block.id === 'air') continue;
                    
                    // 获取对应的纹理
                    const blockType = BLOCK_TYPES[block.id];
                    if (!blockType || !blockType.texture) continue;
                    
                    const texture = textures[blockType.texture];
                    if (!texture) continue;
                    
                    // 计算屏幕坐标（使用整数坐标，避免模糊）
                    const screenX = x * blockSize - gameState.camera.x;
                    const screenY = y * blockSize - gameState.camera.y;
                    
                    // 根据纹理类型分组
                    const textureKey = blockType.texture;
                    if (!blockBatches.has(textureKey)) {
                        blockBatches.set(textureKey, []);
                    }
                    
                    // 存储方块绘制信息
                    const drawInfo = {
                        screenX,
                        screenY,
                        block,
                        blockType
                    };
                    
                    // 特殊处理水方块（需要额外的水位信息）
                    if (block.id === 'water' && block.waterLevel) {
                        drawInfo.waterLevel = block.waterLevel;
                    }
                    
                    blockBatches.get(textureKey).push(drawInfo);
                    
                    // 收集需要绘制裂纹的方块
                    if (block.id !== 'tombstone' && block.hp < blockType.hp && textures.cracks) {
                        const damagePercent = 1 - (block.hp / blockType.hp);
                        const crackLevel = Math.min(9, Math.floor(damagePercent * 10));
                        
                        if (!crackBatches.has(crackLevel)) {
                            crackBatches.set(crackLevel, []);
                        }
                        
                        crackBatches.get(crackLevel).push({
                            screenX,
                            screenY
                        });
                    }
                }
            }
            
            // 第二阶段：批量绘制方块（按纹理类型集中绘制）
            let renderedBlocks = 0;
            for (const [textureKey, blocks] of blockBatches) {
                const texture = textures[textureKey];
                
                // 批量绘制同一纹理的所有方块
                for (const drawInfo of blocks) {
                    const { screenX, screenY, block, waterLevel } = drawInfo;
                    
                    // 如果是水方块且有水位属性，根据水位调整渲染高度
                    if (waterLevel) {
                        const waterHeightRatio = waterLevel / 8; // 水位比例（0.125 到 1.0）
                        const waterHeight = blockSize * waterHeightRatio; // 实际渲染高度
                        const waterOffsetY = blockSize * (1 - waterHeightRatio); // 从底部开始绘制
                        
                        // 使用 drawImage 的裁剪功能，从纹理底部截取对应高度
                        ctx.drawImage(
                            texture,
                            0, texture.height * (1 - waterHeightRatio), // 源图像裁剪起点
                            texture.width, texture.height * waterHeightRatio, // 源图像裁剪尺寸
                            screenX, screenY + waterOffsetY, // 目标位置（从底部对齐）
                            blockSize, waterHeight // 目标尺寸
                        );
                    } else {
                        // 普通方块，正常绘制
                        ctx.drawImage(texture, screenX, screenY, blockSize, blockSize);
                    }
                    
                    renderedBlocks++;
                }
            }
            
            // 第三阶段：批量绘制裂纹效果（按裂纹等级集中绘制）
            for (const [crackLevel, cracks] of crackBatches) {
                const crackTexture = textures.cracks[crackLevel];
                
                if (crackTexture) {
                    // 批量绘制同一裂纹等级的所有方块
                    for (const crack of cracks) {
                        ctx.drawImage(crackTexture, crack.screenX, crack.screenY, blockSize, blockSize);
                    }
                }
            }
            
            // 绘制玩家
            if (gameState.player) {
                ctx.save();
                // 使用整数坐标进行translate，避免亚像素渲染
                ctx.translate(-Math.floor(gameState.camera.x), -Math.floor(gameState.camera.y));
                gameState.player.render(ctx);
                ctx.restore();
            }
            
            // 绘制玩家手持物品（在玩家之后，确保在玩家上方）
            renderHeldItem();
            
            // 定义可见区域和边距（用于优化渲染）
            const cameraLeft = gameState.camera.x;
            const cameraRight = gameState.camera.x + canvas.width;
            const cameraTop = gameState.camera.y;
            const cameraBottom = gameState.camera.y + canvas.height;
            const margin = 50; // 额外边距，确保边缘物体不会突然消失
            
            // 绘制史莱姆（仅渲染可见区域内的）
            for (let i = 0; i < gameState.slimes.length; i++) {
                const slime = gameState.slimes[i];
                // 只渲染在可见区域内的史莱姆
                if (slime.x + margin >= cameraLeft && slime.x - margin <= cameraRight &&
                    slime.y + margin >= cameraTop && slime.y - margin <= cameraBottom) {
                    slime.render(ctx, gameState.camera.x, gameState.camera.y);
                }
            }
            
            // 绘制鼠标高亮方块
            if (gameState.mouse.inRange && 
                gameState.mouse.gridX >= 0 && 
                gameState.mouse.gridX < WORLD_CONFIG.width &&
                gameState.mouse.gridY >= 0 && 
                gameState.mouse.gridY < WORLD_CONFIG.height) {
                
                const block = getBlock(gameState.mouse.gridX, gameState.mouse.gridY);
                
                // 水方块不显示任何高亮效果
                if (block && block.id !== 'air' && block.id !== 'water') {
                    // 高亮实心方块（可挖掘）
                    const screenX = gameState.mouse.gridX * blockSize - gameState.camera.x;
                    const screenY = gameState.mouse.gridY * blockSize - gameState.camera.y;
                    
                    // 绘制半透明白色方框
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX, screenY, blockSize, blockSize);
                    
                    // 绘制半透明白色填充
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.fillRect(screenX, screenY, blockSize, blockSize);
                } else if (block && block.id === 'air') {
                    // 高亮空气方块（可放置）- 只在手持方块类型物品或水桶时显示
                    const selectedItem = getSelectedItem();
                    const isHoldingBlock = selectedItem && selectedItem.type === 'block';
                    const isHoldingWaterBucket = selectedItem && selectedItem.special === 'waterBucket';
                    
                    if (isHoldingBlock) {
                        const blockType = selectedItem.blockType;
                        const isNonSolid = !blockType.solid; // 判断是否为非固体方块
                        
                        // 非固体方块不检查玩家碰撞
                        const canPlace = hasAdjacentBlock(gameState.mouse.gridX, gameState.mouse.gridY) && 
                                        (isNonSolid || !isBlockCollidingWithPlayer(gameState.mouse.gridX, gameState.mouse.gridY));
                        
                        if (canPlace) {
                            const screenX = gameState.mouse.gridX * blockSize - gameState.camera.x;
                            const screenY = gameState.mouse.gridY * blockSize - gameState.camera.y;
                            
                            if (isNonSolid) {
                                // 非固体方块：使用蓝绿色提示（与水桶相同）
                                ctx.strokeStyle = 'rgba(0, 255, 200, 0.6)';
                                ctx.lineWidth = 2;
                                ctx.strokeRect(screenX, screenY, blockSize, blockSize);
                                
                                ctx.fillStyle = 'rgba(0, 255, 200, 0.15)';
                                ctx.fillRect(screenX, screenY, blockSize, blockSize);
                            } else {
                                // 固体方块：使用绿色提示
                                ctx.strokeStyle = 'rgba(0, 255, 0, 0.6)';
                                ctx.lineWidth = 2;
                                ctx.strokeRect(screenX, screenY, blockSize, blockSize);
                                
                                ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
                                ctx.fillRect(screenX, screenY, blockSize, blockSize);
                            }
                        }
                    } else if (isHoldingWaterBucket) {
                        // 水桶：显示可以放置水的提示（需要相邻方块）
                        const canPlace = hasAdjacentBlock(gameState.mouse.gridX, gameState.mouse.gridY);
                        
                        if (canPlace) {
                            const screenX = gameState.mouse.gridX * blockSize - gameState.camera.x;
                            const screenY = gameState.mouse.gridY * blockSize - gameState.camera.y;
                            
                            // 绘制半透明蓝绿色方框（可放置水）
                            ctx.strokeStyle = 'rgba(0, 255, 200, 0.6)';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(screenX, screenY, blockSize, blockSize);
                            
                            // 绘制半透明蓝绿色填充
                            ctx.fillStyle = 'rgba(0, 255, 200, 0.15)';
                            ctx.fillRect(screenX, screenY, blockSize, blockSize);
                        }
                    }
                } else if (block && block.id === 'water') {
                    // 高亮水方块 - 只在手持空桶时显示
                    const selectedItem = getSelectedItem();
                    const isHoldingEmptyBucket = selectedItem && selectedItem.special === 'emptyBucket';
                    
                    if (isHoldingEmptyBucket) {
                        const screenX = gameState.mouse.gridX * blockSize - gameState.camera.x;
                        const screenY = gameState.mouse.gridY * blockSize - gameState.camera.y;
                        
                        // 绘制半透明黄色方框（可收集水）
                        ctx.strokeStyle = 'rgba(255, 200, 0, 0.6)';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(screenX, screenY, blockSize, blockSize);
                        
                        // 绘制半透明黄色填充
                        ctx.fillStyle = 'rgba(255, 200, 0, 0.15)';
                        ctx.fillRect(screenX, screenY, blockSize, blockSize);
                    }
                }
            }
            
            // 绘制掉落物（仅渲染可见区域内的）
            for (let i = 0; i < gameState.drops.length; i++) {
                const drop = gameState.drops[i];
                // 只渲染在可见区域内的掉落物
                if (drop.x + margin >= cameraLeft && drop.x - margin <= cameraRight &&
                    drop.y + margin >= cameraTop && drop.y - margin <= cameraBottom) {
                    drop.render(ctx, gameState.camera.x, gameState.camera.y);
                }
            }
            
            // 绘制粒子（仅渲染可见区域内的）
            for (let i = 0; i < gameState.particles.length; i++) {
                const particle = gameState.particles[i];
                // 只渲染在可见区域内的粒子
                if (particle.x + margin >= cameraLeft && particle.x - margin <= cameraRight &&
                    particle.y + margin >= cameraTop && particle.y - margin <= cameraBottom) {
                    particle.render(ctx, gameState.camera.x, gameState.camera.y);
                }
            }
            
            // ========== 光影效果层 ==========
            // 优化：每3帧计算一次光照，减少CPU占用
            if (!gameState.lightingFrameCounter) {
                gameState.lightingFrameCounter = 0;
            }
            gameState.lightingFrameCounter++;
            
            // 性能自适应：如果帧率低于30fps，跳过光照计算
            const shouldSkipLighting = (gameState.currentFPS || 60) < 30;
            
            // 每3帧计算一次光照，或者光照图被标记为脏时立即计算（但帧率过低时跳过）
            if (!shouldSkipLighting && (gameState.lightingFrameCounter >= 3 || gameState.lightMapDirty)) {
                gameState.lightingFrameCounter = 0;
                // 绘制深度光影遮罩（泰拉瑞亚风格）
                renderDepthLighting();
            }
            // 如果不需要重新计算，使用缓存的光照效果
            else if (gameState.cachedLightingCanvas) {
                ctx.drawImage(gameState.cachedLightingCanvas, 0, 0);
            }
            
            // 绘制昼夜光照效果（在所有游戏内容之上）
            if (!gameState.isDead) {
                const ambientLight = getAmbientLight();
                // 光照强度：1.0 = 完全亮（无遮罩），0.3 = 夜晚（70%暗度）
                const darknessAlpha = 1.0 - ambientLight;
                if (darknessAlpha > 0) {
                    // 使用离屏canvas创建带火把镂空的遮罩
                    const maskCanvas = document.createElement('canvas');
                    maskCanvas.width = canvas.width;
                    maskCanvas.height = canvas.height;
                    const maskCtx = maskCanvas.getContext('2d');
                    
                    // 1. 先绘制整个黑色遮罩
                    maskCtx.fillStyle = `rgba(0, 0, 0, ${darknessAlpha})`;
                    maskCtx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 2. 使用 destination-out 擦除火把区域
                    maskCtx.globalCompositeOperation = 'destination-out';
                    
                    // 2.1 擦除火把和神器镐光源区域（只在夜晚）
                    if (gameState.activeLightSources && darknessAlpha > 0.3) {
                        for (const light of gameState.activeLightSources) {
                            const screenX = light.x - gameState.camera.x;
                            const screenY = light.y - gameState.camera.y;
                            
                            // 处理火把光源（橙黄色光）
                            const isTorchLight = light.color.r === 255 && light.color.g === 200 && light.color.b === 100;
                            // 处理神器镐光源（金色光）
                            const isGodPickaxeLight = light.color.r === 255 && light.color.g === 215 && light.color.b === 0;
                            
                            if (isTorchLight || isGodPickaxeLight) {
                                // 创建光圈的擦除渐变
                                const eraseGradient = maskCtx.createRadialGradient(
                                    screenX, screenY, 0,
                                    screenX, screenY, light.radius * 0.8 // 稍微缩小范围
                                );
                                
                                // 根据夜晚暗度调整擦除强度
                                const eraseStrength = Math.min(1, darknessAlpha * 1.2);
                                eraseGradient.addColorStop(0, `rgba(0, 0, 0, ${eraseStrength})`);
                                eraseGradient.addColorStop(0.4, `rgba(0, 0, 0, ${eraseStrength * 0.8})`);
                                eraseGradient.addColorStop(0.7, `rgba(0, 0, 0, ${eraseStrength * 0.4})`);
                                eraseGradient.addColorStop(1, `rgba(0, 0, 0, 0)`);
                                
                                maskCtx.fillStyle = eraseGradient;
                                maskCtx.fillRect(
                                    screenX - light.radius,
                                    screenY - light.radius,
                                    light.radius * 2,
                                    light.radius * 2
                                );
                            }
                        }
                    }
                    
                    // 3. 将处理好的遮罩绘制到主canvas
                    ctx.drawImage(maskCanvas, 0, 0);
                }
            }
            
            // 在黑暗覆盖层之后重新绘制月亮（不被夜晚变暗，但会被物块遮挡）
            const moonPosAfterDarkness = getMoonPosition(canvas.width, canvas.height);
            if (moonPosAfterDarkness) {
                // 检查月亮位置是否被物块遮挡
                const moonBlockX = Math.floor((moonPosAfterDarkness.x + gameState.camera.x) / WORLD_CONFIG.blockSize);
                const moonBlockY = Math.floor((moonPosAfterDarkness.y + gameState.camera.y) / WORLD_CONFIG.blockSize);
                
                // 检查月亮中心位置是否有实心方块
                let isBlocked = false;
                if (moonBlockX >= 0 && moonBlockX < WORLD_CONFIG.width && 
                    moonBlockY >= 0 && moonBlockY < WORLD_CONFIG.height) {
                    const block = getBlock(moonBlockX, moonBlockY);
                    if (block && block.id !== 'air') {
                        const blockType = BLOCK_TYPES[block.id];
                        if (blockType && blockType.solid) {
                            isBlocked = true;
                        }
                    }
                }
                
                // 只有在没有被遮挡时才绘制月亮
                if (!isBlocked) {
                    drawMoon(ctx, moonPosAfterDarkness.x, moonPosAfterDarkness.y);
                }
            }
            
            // 绘制饥饿暗度效果（饱食度低于30时）
            if (gameState.hunger < 30 && !gameState.isDead) {
                // 计算暗度：饱食度从30到0，暗度从0到0.7（与死亡暗度相同）
                const darknessAlpha = (30 - gameState.hunger) / 30 * 0.7;
                ctx.fillStyle = `rgba(0, 0, 0, ${darknessAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // 绘制死亡屏幕
            if (gameState.isDead) {
                // 半透明黑色遮罩
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // ========== UI层（最顶层，不受任何光影影响）==========
            // 绘制热键栏UI
            renderHotbar();
            
            // 绘制血量和饱食度UI
            renderHealthAndHunger();
            
            // 绘制物品栏提示
            renderHotbarTooltips();
            
            // 更新小地图探索区域（基于玩家位置）- 优化：降低更新频率
            if (!gameState.minimapUpdateTimer) gameState.minimapUpdateTimer = 0;
            gameState.minimapUpdateTimer += 16.67; // 假设每帧约16.67ms
            
            // 每5帧更新一次小地图（约12fps）
            if (gameState.minimapUpdateTimer >= 83.33) {
                gameState.minimapUpdateTimer = 0;
                updateMinimapExploration();
            }
            
            // 绘制小地图（在右上角），返回小地图底部Y坐标
            const minimapBottomY = renderMinimap();
            
            // 绘制游戏时间（在小地图下方）
            const { hours, minutes } = getGameTime();
            const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            const period = getTimePeriod();
            const periodNames = {
                'sunrise': '日出',
                'day': '白天',
                'dusk': '傍晚',
                'night': '夜晚'
            };
            const periodText = periodNames[period] || '';
            
            ctx.font = 'bold 20px monospace';
            ctx.textAlign = 'right';
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            
            const timeX = canvas.width - 20;
            const timeY = minimapBottomY + 30; // 小地图下方30像素
            
            ctx.strokeText(timeString, timeX, timeY);
            ctx.fillText(timeString, timeX, timeY);
            
            // 绘制时间段文字（稍小一点）
            ctx.font = 'bold 14px monospace';
            ctx.strokeText(periodText, timeX, timeY + 20);
            ctx.fillText(periodText, timeX, timeY + 20);
            
            ctx.textAlign = 'left'; // 恢复默认对齐
            
            // 绘制背包界面（如果打开）
            if (gameState.inventoryOpen) {
                renderInventoryScreen();
            }
            
            // 简洁的FPS显示（右上角，始终显示）
            if (!gameState.debugMode) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(canvas.width - 80, 5, 70, 25);
                
                ctx.fillStyle = '#0F0';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'right';
                const fps = gameState.currentFPS || 60;
                ctx.strokeText(`FPS: ${fps}`, canvas.width - 15, 22);
                ctx.fillText(`FPS: ${fps}`, canvas.width - 15, 22);
                ctx.textAlign = 'left';
            }
            
            // 调试信息（按F3显示/隐藏）
            if (gameState.debugMode) {
                // 绘制半透明黑色背景
                const debugBgHeight = 180;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(5, 5, 950, debugBgHeight);
                
                // 设置文字样式
                ctx.fillStyle = '#00FF00'; // 亮绿色
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1; // 减小描边宽度
                ctx.font = 'bold 14px monospace';
                
                const gridX = Math.floor(gameState.player.x / blockSize);
                const gridY = Math.floor(gameState.player.y / blockSize);
                
                // 获取光标所在方块的信息
                let blockInfo = '';
                if (gameState.mouse.gridX >= 0 && gameState.mouse.gridX < WORLD_CONFIG.width &&
                    gameState.mouse.gridY >= 0 && gameState.mouse.gridY < WORLD_CONFIG.height) {
                    const block = getBlock(gameState.mouse.gridX, gameState.mouse.gridY);
                    if (block && block.id !== 'air') {
                        const blockType = BLOCK_TYPES[block.id];
                        if (blockType) {
                            blockInfo = `光标方块: ${blockType.id} | HP: ${block.hp}/${blockType.hp} (${Math.round((block.hp / blockType.hp) * 100)}%)`;
                        }
                    }
                }
                
                const info = [
                    `FPS: ${gameState.currentFPS || 60}`,
                    `世界: ${WORLD_CONFIG.width}x${WORLD_CONFIG.height} | 渲染: ${renderedBlocks} 方块 + ${renderedWalls} 墙 | 粒子: ${gameState.particles.length} | 掉落物: ${gameState.drops.length}`,
                    `玩家: (${gridX}, ${gridY}) 精确: (${Math.round(gameState.player.x)}, ${Math.round(gameState.player.y)})`,
                    `速度: vx=${gameState.player?.vx.toFixed(1)}, vy=${gameState.player?.vy.toFixed(1)} | 地面: ${gameState.player?.onGround ? '是' : '否'}`,
                    `鼠标: 网格(${gameState.mouse.gridX}, ${gameState.mouse.gridY}) ${gameState.mouse.inRange ? '可挖掘' : '超出范围'} ${gameState.mouse.isDown ? '[挖掘中]' : ''}`,
                    blockInfo,
                    `控制: A/D 移动, W/↑/空格 跳跃, 鼠标左键 挖掘, 鼠标右键 放置`,
                    `物品栏: 1-0 数字键选择, 鼠标滚轮切换 | F3 调试信息`
                ];
                
                // 使用 for 循环代替 forEach（性能更好）
                for (let i = 0; i < info.length; i++) {
                    const text = info[i];
                    if (!text) continue;
                    
                    const y = 20 + i * 20;
                    // 先绘制描边（细）
                    ctx.strokeText(text, 15, y);
                    // 再绘制填充文字
                    ctx.fillText(text, 15, y);
                }
            }
            
            // 绘制死亡屏幕文字（在最顶层）
            if (gameState.isDead) {
                // 死亡文字
                ctx.fillStyle = '#FF0000';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.font = 'bold 48px monospace';
                ctx.textAlign = 'center';
                
                const deathText = '你死了';
                ctx.strokeText(deathText, canvas.width / 2, canvas.height / 2 - 40);
                ctx.fillText(deathText, canvas.width / 2, canvas.height / 2 - 40);
                
                // 复活倒计时
                const respawnSeconds = Math.ceil(gameState.respawnTimer / 1000);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 32px monospace';
                const timerText = `${respawnSeconds}秒后复活...`;
                ctx.strokeText(timerText, canvas.width / 2, canvas.height / 2 + 20);
                ctx.fillText(timerText, canvas.width / 2, canvas.height / 2 + 20);
                
                // 提示文字
                ctx.font = '20px monospace';
                const hintText = '你的物品已保存在墓碑中';
                ctx.strokeText(hintText, canvas.width / 2, canvas.height / 2 + 60);
                ctx.fillText(hintText, canvas.width / 2, canvas.height / 2 + 60);
                
                // 重置文字对齐
                ctx.textAlign = 'left';
            }
            
            // 绘制时间加速特效（在最顶层）
            if (gameState.gameTime.accelerationEffectTimer > 0) {
                // 计算透明度（2秒内从0.5淡出到0）
                const progress = gameState.gameTime.accelerationEffectTimer / 2000; // 0到1
                const alpha = 0.5 * progress; // 从0.5淡出到0
                
                // 绘制半透明黑色遮罩（总是显示）
                ctx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 只在开启加速时绘制"Made in Heaven!"文字
                if (gameState.gameTime.showAccelerationText) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${progress})`;
                    ctx.strokeStyle = `rgba(0, 0, 0, ${progress})`;
                    ctx.lineWidth = 6;
                    ctx.font = 'bold 72px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    const text = 'Made in Heaven!';
                    ctx.strokeText(text, canvas.width / 2, canvas.height / 2);
                    ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                    
                    // 重置文字样式
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';
                }
            }
        }
        
        // ========== 时间系统函数 ==========
        
        // 更新游戏时间
        function updateGameTime(deltaTime) {
            // deltaTime 是毫秒，转换为秒
            const deltaSeconds = deltaTime / 1000;
            // 计算游戏时间增加的分钟数
            const timeMultiplier = gameState.gameTime.timeAcceleration ? 50 : 1;
            const gameMinutesElapsed = (deltaSeconds / gameState.gameTime.realSecondsPerGameMinute) * timeMultiplier;
            gameState.gameTime.totalMinutes += gameMinutesElapsed;
            
            // 一天24小时 = 1440分钟，循环
            if (gameState.gameTime.totalMinutes >= 1440) {
                gameState.gameTime.totalMinutes -= 1440;
            }
        }
        
        // 获取游戏时间（小时和分钟）
        function getGameTime() {
            const totalMinutes = Math.floor(gameState.gameTime.totalMinutes);
            const hours = Math.floor(totalMinutes / 60) % 24;
            const minutes = totalMinutes % 60;
            return { hours, minutes };
        }
        
        // 获取时间段
        function getTimePeriod() {
            const { hours, minutes } = getGameTime();
            const totalMinutes = hours * 60 + minutes;
            
            // 凌晨4:30 = 270分钟
            // 晚上7:30 = 1170分钟 (19*60 + 30)
            const dawnStart = 4 * 60 + 30; // 270
            const duskEnd = 19 * 60 + 30; // 1170
            
            if (totalMinutes >= dawnStart && totalMinutes < duskEnd) {
                // 白天时段 4:30 - 19:30
                // 细分为：日出、白天、傍晚
                if (totalMinutes < 6 * 60) { // 4:30 - 6:00
                    return 'sunrise'; // 日出
                } else if (totalMinutes < 18 * 60) { // 6:00 - 18:00
                    return 'day'; // 白天
                } else { // 18:00 - 19:30
                    return 'dusk'; // 傍晚
                }
            } else {
                return 'night'; // 夜晚
            }
        }
        
        // 获取环境光照强度（0-1）
        function getAmbientLight() {
            const { hours, minutes } = getGameTime();
            const totalMinutes = hours * 60 + minutes;
            
            // 定义关键时间点
            const dawn = 4 * 60 + 30; // 4:30 - 开始变亮
            const sunrise = 6 * 60; // 6:00 - 完全亮
            const dusk = 18 * 60; // 18:00 - 开始变暗
            const night = 19 * 60 + 30; // 19:30 - 完全暗
            
            if (totalMinutes >= sunrise && totalMinutes < dusk) {
                // 白天：完全亮
                return 1.0;
            } else if (totalMinutes >= dawn && totalMinutes < sunrise) {
                // 日出：从0.3渐变到1.0
                const progress = (totalMinutes - dawn) / (sunrise - dawn);
                return 0.3 + progress * 0.7;
            } else if (totalMinutes >= dusk && totalMinutes < night) {
                // 傍晚：从1.0渐变到0.3
                const progress = (totalMinutes - dusk) / (night - dusk);
                return 1.0 - progress * 0.7;
            } else {
                // 夜晚：暗
                return 0.3;
            }
        }
        
        // 获取天空颜色
        function getSkyColor() {
            const period = getTimePeriod();
            const { hours, minutes } = getGameTime();
            const totalMinutes = hours * 60 + minutes;
            
            switch (period) {
                case 'sunrise': {
                    // 日出：从深蓝渐变到橙红再到天蓝
                    const dawn = 4 * 60 + 30;
                    const sunrise = 6 * 60;
                    const progress = (totalMinutes - dawn) / (sunrise - dawn);
                    
                    if (progress < 0.5) {
                        // 前半段：深蓝 -> 橙红
                        const t = progress * 2;
                        return {
                            top: lerpColor('#1a1a2e', '#ff6b35', t),
                            bottom: lerpColor('#16213e', '#ffa500', t)
                        };
                    } else {
                        // 后半段：橙红 -> 天蓝
                        const t = (progress - 0.5) * 2;
                        return {
                            top: lerpColor('#ff6b35', '#87CEEB', t),
                            bottom: lerpColor('#ffa500', '#B0E0E6', t)
                        };
                    }
                }
                case 'day':
                    // 白天：天蓝色
                    return { top: '#87CEEB', bottom: '#B0E0E6' };
                case 'dusk': {
                    // 傍晚：从天蓝渐变到橙红再到深蓝
                    const dusk = 18 * 60;
                    const night = 19 * 60 + 30;
                    const progress = (totalMinutes - dusk) / (night - dusk);
                    
                    if (progress < 0.5) {
                        // 前半段：天蓝 -> 橙红
                        const t = progress * 2;
                        return {
                            top: lerpColor('#87CEEB', '#ff6b35', t),
                            bottom: lerpColor('#B0E0E6', '#ffa500', t)
                        };
                    } else {
                        // 后半段：橙红 -> 深蓝
                        const t = (progress - 0.5) * 2;
                        return {
                            top: lerpColor('#ff6b35', '#1a1a2e', t),
                            bottom: lerpColor('#ffa500', '#16213e', t)
                        };
                    }
                }
                case 'night':
                    // 夜晚：深蓝色
                    return { top: '#1a1a2e', bottom: '#16213e' };
                default:
                    return { top: '#87CEEB', bottom: '#B0E0E6' };
            }
        }
        
        // 颜色插值函数
        function lerpColor(color1, color2, t) {
            const r1 = parseInt(color1.slice(1, 3), 16);
            const g1 = parseInt(color1.slice(3, 5), 16);
            const b1 = parseInt(color1.slice(5, 7), 16);
            
            const r2 = parseInt(color2.slice(1, 3), 16);
            const g2 = parseInt(color2.slice(3, 5), 16);
            const b2 = parseInt(color2.slice(5, 7), 16);
            
            const r = Math.round(r1 + (r2 - r1) * t);
            const g = Math.round(g1 + (g2 - g1) * t);
            const b = Math.round(b1 + (b2 - b1) * t);
            
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }
        
        // 获取太阳位置（弧形轨迹）
        function getSunPosition(canvasWidth, canvasHeight) {
            const { hours, minutes } = getGameTime();
            const totalMinutes = hours * 60 + minutes;
            
            // 太阳从5:00升起，19:00落下（14小时）
            const sunriseTime = 5 * 60; // 5:00
            const sunsetTime = 19 * 60; // 19:00
            
            if (totalMinutes < sunriseTime || totalMinutes > sunsetTime) {
                return null; // 太阳不可见
            }
            
            // 计算太阳在天空中的进度（0-1）
            const progress = (totalMinutes - sunriseTime) / (sunsetTime - sunriseTime);
            
            // 水平位置：从左到右
            const x = canvasWidth * 0.1 + canvasWidth * 0.8 * progress;
            
            // 垂直位置：弧形轨迹（抛物线）
            // 在中午12:00达到最高点
            const arcHeight = canvasHeight * 0.25; // 弧形高度
            const baseY = canvasHeight * 0.4; // 基准高度
            const y = baseY - Math.sin(progress * Math.PI) * arcHeight;
            
            return { x, y, progress };
        }
        
        // 获取月亮位置（弧形轨迹）
        function getMoonPosition(canvasWidth, canvasHeight) {
            const { hours, minutes } = getGameTime();
            const totalMinutes = hours * 60 + minutes;
            
            // 月亮从19:00升起，次日5:00落下
            const moonriseTime = 19 * 60; // 19:00
            const moonsetTime = 5 * 60 + 1440; // 次日5:00（加1440分钟）
            
            let adjustedMinutes = totalMinutes;
            if (totalMinutes < moonriseTime) {
                adjustedMinutes += 1440; // 如果是凌晨，加一天
            }
            
            if (adjustedMinutes < moonriseTime || adjustedMinutes > moonsetTime) {
                return null; // 月亮不可见
            }
            
            // 计算月亮在天空中的进度（0-1）
            const progress = (adjustedMinutes - moonriseTime) / (moonsetTime - moonriseTime);
            
            // 水平位置：从左到右
            const x = canvasWidth * 0.1 + canvasWidth * 0.8 * progress;
            
            // 垂直位置：弧形轨迹
            const arcHeight = canvasHeight * 0.25;
            const baseY = canvasHeight * 0.4;
            const y = baseY - Math.sin(progress * Math.PI) * arcHeight;
            
            return { x, y, progress };
        }
        
        // 绘制太阳
        function drawSun(ctx, x, y) {
            const sunRadius = 30;
            
            // 太阳外层大光晕（最外层，更亮）
            const outerGlowGradient = ctx.createRadialGradient(x, y, sunRadius, x, y, sunRadius * 4);
            outerGlowGradient.addColorStop(0, 'rgba(255, 245, 180, 0.6)');
            outerGlowGradient.addColorStop(0.3, 'rgba(255, 235, 150, 0.35)');
            outerGlowGradient.addColorStop(0.6, 'rgba(255, 225, 120, 0.18)');
            outerGlowGradient.addColorStop(1, 'rgba(255, 215, 100, 0)');
            ctx.fillStyle = outerGlowGradient;
            ctx.beginPath();
            ctx.arc(x, y, sunRadius * 4, 0, Math.PI * 2);
            ctx.fill();
            
            // 太阳中层光晕（更亮）
            const midGlowGradient = ctx.createRadialGradient(x, y, sunRadius * 0.5, x, y, sunRadius * 2.5);
            midGlowGradient.addColorStop(0, 'rgba(255, 252, 220, 0.7)');
            midGlowGradient.addColorStop(0.4, 'rgba(255, 245, 180, 0.5)');
            midGlowGradient.addColorStop(0.7, 'rgba(255, 235, 150, 0.25)');
            midGlowGradient.addColorStop(1, 'rgba(255, 225, 120, 0)');
            ctx.fillStyle = midGlowGradient;
            ctx.beginPath();
            ctx.arc(x, y, sunRadius * 2.5, 0, Math.PI * 2);
            ctx.fill();
            
            // 太阳内层光晕（强光，更亮）
            const innerGlowGradient = ctx.createRadialGradient(x, y, 0, x, y, sunRadius * 1.5);
            innerGlowGradient.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            innerGlowGradient.addColorStop(0.3, 'rgba(255, 252, 220, 0.8)');
            innerGlowGradient.addColorStop(0.6, 'rgba(255, 245, 180, 0.5)');
            innerGlowGradient.addColorStop(1, 'rgba(255, 235, 150, 0)');
            ctx.fillStyle = innerGlowGradient;
            ctx.beginPath();
            ctx.arc(x, y, sunRadius * 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // 太阳主体（渐变，更亮）
            const sunGradient = ctx.createRadialGradient(x - sunRadius * 0.2, y - sunRadius * 0.2, 0, x, y, sunRadius);
            sunGradient.addColorStop(0, '#FFFFFF');
            sunGradient.addColorStop(0.3, '#FFFEF5');
            sunGradient.addColorStop(0.6, '#FFF4A0');
            sunGradient.addColorStop(1, '#FFE44D');
            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(x, y, sunRadius, 0, Math.PI * 2);
            ctx.fill();
            
            // 太阳光芒（更多更亮）
            ctx.save();
            ctx.shadowColor = 'rgba(255, 245, 180, 0.8)';
            ctx.shadowBlur = 20;
            
            // 主光芒（12条，更亮）
            ctx.strokeStyle = 'rgba(255, 245, 180, 0.85)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const startX = x + Math.cos(angle) * (sunRadius + 5);
                const startY = y + Math.sin(angle) * (sunRadius + 5);
                const endX = x + Math.cos(angle) * (sunRadius + 20);
                const endY = y + Math.sin(angle) * (sunRadius + 20);
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
            
            // 次级光芒（12条，偏移角度，更亮）
            ctx.strokeStyle = 'rgba(255, 250, 220, 0.7)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2 + Math.PI / 12;
                const startX = x + Math.cos(angle) * (sunRadius + 8);
                const startY = y + Math.sin(angle) * (sunRadius + 8);
                const endX = x + Math.cos(angle) * (sunRadius + 15);
                const endY = y + Math.sin(angle) * (sunRadius + 15);
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        // 绘制月亮
        function drawMoon(ctx, x, y) {
            const moonRadius = 25;
            
            // 月亮外层光晕（较弱但更亮）
            const outerGlowGradient = ctx.createRadialGradient(x, y, moonRadius, x, y, moonRadius * 3);
            outerGlowGradient.addColorStop(0, 'rgba(210, 230, 255, 0.4)');
            outerGlowGradient.addColorStop(0.3, 'rgba(200, 220, 250, 0.25)');
            outerGlowGradient.addColorStop(0.6, 'rgba(190, 210, 245, 0.12)');
            outerGlowGradient.addColorStop(1, 'rgba(180, 200, 240, 0)');
            ctx.fillStyle = outerGlowGradient;
            ctx.beginPath();
            ctx.arc(x, y, moonRadius * 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 月亮中层光晕（更亮）
            const midGlowGradient = ctx.createRadialGradient(x, y, moonRadius * 0.5, x, y, moonRadius * 2);
            midGlowGradient.addColorStop(0, 'rgba(230, 240, 255, 0.5)');
            midGlowGradient.addColorStop(0.4, 'rgba(220, 235, 255, 0.35)');
            midGlowGradient.addColorStop(0.7, 'rgba(210, 225, 250, 0.18)');
            midGlowGradient.addColorStop(1, 'rgba(200, 215, 245, 0)');
            ctx.fillStyle = midGlowGradient;
            ctx.beginPath();
            ctx.arc(x, y, moonRadius * 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 月亮内层光晕（柔和但更亮）
            const innerGlowGradient = ctx.createRadialGradient(x, y, 0, x, y, moonRadius * 1.4);
            innerGlowGradient.addColorStop(0, 'rgba(250, 252, 255, 0.7)');
            innerGlowGradient.addColorStop(0.4, 'rgba(240, 245, 255, 0.5)');
            innerGlowGradient.addColorStop(0.7, 'rgba(230, 240, 255, 0.3)');
            innerGlowGradient.addColorStop(1, 'rgba(220, 230, 250, 0)');
            ctx.fillStyle = innerGlowGradient;
            ctx.beginPath();
            ctx.arc(x, y, moonRadius * 1.4, 0, Math.PI * 2);
            ctx.fill();
            
            // 月亮主体（渐变，带阴影效果，更亮）
            ctx.save();
            ctx.shadowColor = 'rgba(220, 235, 255, 0.6)';
            ctx.shadowBlur = 15;
            
            const moonGradient = ctx.createRadialGradient(x - moonRadius * 0.3, y - moonRadius * 0.3, 0, x, y, moonRadius);
            moonGradient.addColorStop(0, '#FFFFFF');
            moonGradient.addColorStop(0.4, '#FAFAFA');
            moonGradient.addColorStop(0.7, '#F0F0F0');
            moonGradient.addColorStop(1, '#D8D8D8');
            ctx.fillStyle = moonGradient;
            ctx.beginPath();
            ctx.arc(x, y, moonRadius, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // 月球表面陨石坑（更多细节）
            ctx.fillStyle = 'rgba(160, 160, 160, 0.25)';
            ctx.beginPath();
            ctx.arc(x - 8, y - 5, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 6, y + 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 2, y - 8, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x - 5, y + 7, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 10, y - 3, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 陨石坑阴影
            ctx.fillStyle = 'rgba(100, 100, 100, 0.15)';
            ctx.beginPath();
            ctx.arc(x - 7, y - 4, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 7, y + 4, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            // 月亮光芒（微弱的，只有几条，更亮）
            ctx.save();
            ctx.strokeStyle = 'rgba(230, 240, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(220, 235, 255, 0.5)';
            ctx.shadowBlur = 12;
            
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const startX = x + Math.cos(angle) * (moonRadius + 3);
                const startY = y + Math.sin(angle) * (moonRadius + 3);
                const endX = x + Math.cos(angle) * (moonRadius + 10);
                const endY = y + Math.sin(angle) * (moonRadius + 10);
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
            
            ctx.restore();
        }
        
        // 绘制星星
        function drawStars(ctx, canvasWidth, canvasHeight) {
            const { hours, minutes } = getGameTime();
            const totalMinutes = hours * 60 + minutes;
            
            // 星星在夜晚可见（18:00 - 6:00）
            const starStartTime = 18 * 60; // 18:00
            const starEndTime = 6 * 60; // 6:00
            
            let starAlpha = 0;
            
            if (totalMinutes >= starStartTime || totalMinutes < starEndTime) {
                // 计算星星透明度
                if (totalMinutes >= starStartTime) {
                    // 傍晚：18:00-20:00 渐现
                    if (totalMinutes < 20 * 60) {
                        starAlpha = (totalMinutes - starStartTime) / (2 * 60);
                    } else {
                        starAlpha = 1.0;
                    }
                } else {
                    // 凌晨：4:00-6:00 渐隐
                    if (totalMinutes > 4 * 60) {
                        starAlpha = 1.0 - (totalMinutes - 4 * 60) / (2 * 60);
                    } else {
                        starAlpha = 1.0;
                    }
                }
                
                // 绘制星星（固定位置，使用随机种子）
                ctx.save();
                for (let i = 0; i < 80; i++) {
                    // 使用固定种子生成星星位置
                    const seed = i * 12345;
                    const x = ((seed * 9301 + 49297) % 233280) / 233280 * canvasWidth;
                    const y = ((seed * 1103 + 377) % 233280) / 233280 * (canvasHeight * 0.5); // 只在上半部分
                    const size = 1 + ((seed * 7) % 3);
                    const twinkle = Math.sin(gameState.time * 0.003 + i) * 0.3 + 0.7;
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${starAlpha * twinkle})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 星星闪烁效果（十字光芒）
                    if (size > 1 && twinkle > 0.8) {
                        ctx.strokeStyle = `rgba(255, 255, 255, ${starAlpha * 0.5})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x - size * 2, y);
                        ctx.lineTo(x + size * 2, y);
                        ctx.moveTo(x, y - size * 2);
                        ctx.lineTo(x, y + size * 2);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }
        
        // ========== 更新函数 ==========
        
        // 更新函数
        function update(deltaTime) {
            gameState.time += deltaTime;
            
            // 更新工具挥舞计时器（始终更新，不受暂停影响）
            if (gameState.toolSwing.active) {
                gameState.toolSwing.timer -= deltaTime;
                if (gameState.toolSwing.timer <= 0) {
                    gameState.toolSwing.active = false;
                    gameState.toolSwing.timer = 0;
                }
            }
            
            // 更新时间加速特效计时器（始终更新，不受暂停影响）
            if (gameState.gameTime.accelerationEffectTimer > 0) {
                gameState.gameTime.accelerationEffectTimer -= deltaTime;
                if (gameState.gameTime.accelerationEffectTimer < 0) {
                    gameState.gameTime.accelerationEffectTimer = 0;
                }
            }
            
            // 更新提示计时器（无论背包是否打开都要更新）
            if (gameState.tooltipTimer > 0) {
                gameState.tooltipTimer -= deltaTime;
                if (gameState.tooltipTimer < 0) {
                    gameState.tooltipTimer = 0;
                }
            }
            
            // 背包打开时暂停游戏（包括时间系统）
            if (gameState.inventoryOpen) {
                // 更新右键长按状态
                updateRightClickHold();
                // 更新合成按钮长按状态
                handleCraftButtonHold();
                return; // 不更新游戏逻辑和时间
            }
            
            // 全屏小地图打开时暂停游戏（包括时间系统）
            if (gameState.minimapExpanded) {
                return; // 不更新游戏逻辑和时间
            }
            
            // 更新游戏时间（只在背包关闭时更新）
            updateGameTime(deltaTime);
            
            // 处理死亡和复活
            if (gameState.isDead) {
                gameState.respawnTimer -= deltaTime;
                if (gameState.respawnTimer <= 0) {
                    respawnPlayer();
                }
                return; // 死亡时不更新其他内容
            }
            
            // 检查玩家是否死亡
            if (gameState.health <= 0) {
                handlePlayerDeath();
                return;
