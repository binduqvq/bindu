            // 所有检查通过，收集水
            // 移除水方块，变回空气
            setBlock(gridX, gridY, BLOCK_TYPES.air);
            
            // 【第10步】抽干唤醒：将该坐标以及它的上下左右相邻坐标，全部强制推入 activeWaterSet
            // 这样失去源头的水潭才会开始连环干涸！
            wakeUpWaterBlock(gridX, gridY, activeWaterSet);
            
            // 将空桶替换为水桶
            const slot = gameState.inventory.slots[gameState.inventory.selectedSlot];
            slot.item = 'waterBucket';
            slot.count = 1;
            
            // 触发挥舞动画
            gameState.toolSwing.active = true;
            gameState.toolSwing.timer = gameState.toolSwing.duration;
            
            // 创建水花特效
            const blockSize = WORLD_CONFIG.blockSize;
            const centerX = (gridX + 0.5) * blockSize;
            const centerY = (gridY + 0.5) * blockSize;
            createParticleExplosion(centerX, centerY, '#4A90E2', 8);
            
            console.log('收集真水源方块，空桶变为水桶');
            
            return true;
        }
        
        // ==================== 水流更新系统 ====================
        
        /**
         * 水流更新函数（每200ms执行一次）
         * 这是水流系统的核心函数，所有水流逻辑都在这里实现
         * 
         * 使用活跃水方块追踪系统 + 更新队列模式：
         * - 活跃追踪：只遍历 activeWaterSet 中的水方块（而不是全图）
         * - 读取阶段：只读取 currentMap，不做任何修改
         * - 记录阶段：将所有修改操作记录到 pendingUpdates 队列
         * - 唤醒机制：修改方块时，唤醒其上下左右四个邻居
         * - 休眠机制：静止的水自动从队列中移除，零性能开销
         * - 应用阶段：遍历队列，一次性应用所有修改
         * 
         * 优势：
         * - 极致性能（只处理活跃的水方块）
         * - 零 GC 压力（不创建大对象）
         * - 自动休眠（静止的水不消耗性能）
         * - 内存友好（队列远小于整个地图）
         */
        function updateWaterTick() {
            const { width, height } = WORLD_CONFIG;
            const currentMap = gameState.worldMap;
            
            // ==================== 更新队列模式 ====================
            // 补丁队列：记录所有需要修改的方块
            // 格式：{ x, y, blockData }
            let pendingUpdates = [];
            
            // 下一轮的活跃水方块集合
            let nextActiveWaterSet = new Set();
            // ====================================================
            
            // ==================== 精准遍历（只遍历活跃水方块）====================
            // 不再使用双层 for 循环遍历全图
            // 而是只遍历 activeWaterSet 中的活跃水方块
            for (let index of activeWaterSet) {
                // 【性能优化】坐标解码：从整数索引还原 (x, y) 坐标
                let x = index % MAP_W;
                let y = Math.floor(index / MAP_W);
                
                // 边界检查
                if (x < 0 || x >= width || y < 0 || y >= height) continue;
                
                // 【只读】从 currentMap 读取当前方块
                const block = currentMap[y][x];
                
                // 跳过空方块（null/undefined）
                if (!block) continue;
                
                // 获取方块类型信息
                const blockType = BLOCK_TYPES[block.id];
                if (!blockType) continue;
                
                // 跳过所有固体方块（泥土、石头、矿石等）
                // 固体方块不参与水流计算
                if (blockType.solid) continue;
                
                // 获取当前格子的水位和水源属性
                // waterLevel: 1-8 表示水方块，0 或 undefined 表示空气
                // isSource: true 表示真水源（玩家放置或无限水生成），false 表示假水源（流动产生）
                let currentLevel = block.waterLevel || 0;
                let isSource = block.isSource || false;
                
                // ==================== 补丁4：无限水生成（重写）====================
                // 【重要】：这个检查必须在跳过空气之前执行！
                // 因为空气格子也可能被两个真水源夹击，升级为真水源
                
                // 条件1：检查支撑
                // 正下方必须是固体方块，或者是满格水（waterLevel === 8）
                let hasSupport = false;
                if (y + 1 < height) {
                    const below = currentMap[y + 1][x];
                    if (below) {
                        const belowBlockType = BLOCK_TYPES[below.id];
                        // 支撑条件：下方是固体方块，或者是满格水
                        if (belowBlockType && belowBlockType.solid) {
                            hasSupport = true;
                        } else if (below.id === 'water' && below.waterLevel === 8) {
                            hasSupport = true;
                        }
                    }
                } else {
                    // 如果已经在最底部，认为有支撑
                    hasSupport = true;
                }
                
                // 条件2：检查双真水源夹击
                // 左右两侧都必须是真水源（isSource === true）
                let leftIsSource = false;
                let rightIsSource = false;
                
                // 检查左侧
                if (x - 1 >= 0) {
                    const left = currentMap[y][x - 1];
                    if (left && left.id === 'water' && left.isSource === true) {
                        leftIsSource = true;
                    }
                }
                
                // 检查右侧
                if (x + 1 < width) {
                    const right = currentMap[y][x + 1];
                    if (right && right.id === 'water' && right.isSource === true) {
                        rightIsSource = true;
                    }
                }
                
                // 如果所有条件都满足，升级为真水源
                if (hasSupport && leftIsSource && rightIsSource) {
                    // 当前格子可能是空气或假水源，都升级为真水源
                    pendingUpdates.push({
                        x: x,
                        y: y,
                        blockData: { id: 'water', hp: 0, waterLevel: 8, isSource: true }
                    });
                    
                    // 【必须唤醒】：发生升级后，将当前坐标及上下左右四个邻居全部加入 nextActiveWaterSet
                    // 这样才能触发更大范围的湖泊生成！
                    nextActiveWaterSet.add(y * MAP_W + x);
                    if (x - 1 >= 0) nextActiveWaterSet.add(y * MAP_W + (x - 1));
                    if (x + 1 < width) nextActiveWaterSet.add(y * MAP_W + (x + 1));
                    if (y - 1 >= 0) nextActiveWaterSet.add((y - 1) * MAP_W + x);
                    if (y + 1 < height) nextActiveWaterSet.add((y + 1) * MAP_W + x);
                    
                    // 【关键】：升级后立即跳过后续逻辑
                    // 新生成的真水源不需要在本回合执行流动或干涸
                    continue;
                }
                // ====================================================
                
                // 如果 currentLevel = 0，说明当前是空气方块
                // 空气方块不需要处理（水会流入空气，而不是空气流动）
                // 【注意】：这个检查必须在无限水生成之后！
                if (currentLevel === 0) continue;
                
                // 如果执行到这里，说明当前方块是水方块（currentLevel >= 1）
                // 接下来实现水流逻辑
                
                // ==================== 补丁3：干涸与衰减（重写）====================
                // 【核心改变】：真水源绝对豁免，假水源才会干涸
                
                // 真水源绝对豁免：如果 isSource === true，它绝对不干涸，直接跳过衰减判定！
                if (!isSource) {
                    // 这是假水源（流动产生的水），需要检查是否失去支撑
                    
                    // 目标水位：这个方块应该有的水位
                    let targetLevel = 0;
                    
                    // 1. 检查正上方是否有水
                    if (y - 1 >= 0) {
                        const above = currentMap[y - 1][x];
                        const aboveLevel = (above && above.waterLevel) || 0;
                        
                        if (aboveLevel > 0) {
                            // 上方有水，目标水位为 8（满水位）
                            // 因为上方的水会持续流下来
                            targetLevel = 8;
                        }
                    }
                    
                    // 2. 如果上方没有水，检查左右两侧
                    if (targetLevel === 0) {
                        let leftLevel = 0;
                        let rightLevel = 0;
                        
                        // 检查左侧
                        if (x - 1 >= 0) {
                            const left = currentMap[y][x - 1];
                            leftLevel = (left && left.waterLevel) || 0;
                        }
                        
                        // 检查右侧
                        if (x + 1 < width) {
                            const right = currentMap[y][x + 1];
                            rightLevel = (right && right.waterLevel) || 0;
                        }
                        
                        // 目标水位 = 左右两侧最大水位 - 1
                        const maxSideLevel = Math.max(leftLevel, rightLevel);
                        targetLevel = maxSideLevel - 1;
                    }
                    
                    // 3. 如果当前水位 > 目标水位，说明失去了源头，需要衰减
                    if (currentLevel > targetLevel) {
                        if (targetLevel <= 0) {
                            // 水位降到 0 或以下，变为空气
                            pendingUpdates.push({
                                x: x,
                                y: y,
                                blockData: { id: 'air', hp: 0 }
                            });
                        } else {
                            // 水位降低到目标水位，保持 isSource = false
                            pendingUpdates.push({
                                x: x,
                                y: y,
                                blockData: { id: 'water', hp: 0, waterLevel: targetLevel, isSource: false }
                            });
                        }
                        
                        // 【核心铁律】：水位发生任何改变，必须唤醒自己和所有邻居！
                        // 将当前坐标和上下左右四个相邻坐标全部推入下一轮的 activeWaterSet
                        nextActiveWaterSet.add(y * MAP_W + x);
                        if (x - 1 >= 0) nextActiveWaterSet.add(y * MAP_W + (x - 1));
                        if (x + 1 < width) nextActiveWaterSet.add(y * MAP_W + (x + 1));
                        if (y - 1 >= 0) nextActiveWaterSet.add((y - 1) * MAP_W + x);
                        if (y + 1 < height) nextActiveWaterSet.add((y + 1) * MAP_W + x);
                        
                        // 【关键】：立刻跳出当前格子的逻辑！
                        // 正在干涸（衰减）的水格子不能在同一回合继续执行下落和扩散！
                        continue;
                    }
                }
                // ====================================================
                
                // ==================== 【修复2】重力下落（完全重写）====================
                // 【核心改变】：向下流动产生的水是满格（waterLevel = 8）但是假水源（isSource = false）
                // 【关键修复】：确保下落接力逻辑正确，水能持续下落
                
                let flowedDown = false; // 标记：是否成功向下流动
                
                // 检查正下方
                if (y + 1 < height) {
                    const below = currentMap[y + 1][x];
                    
                    // 获取下方的水位
                    const belowLevel = (below && below.waterLevel) || 0;
                    
                    // 判断是否可以向下流动
                    // 条件1：下方是空气（belowLevel = 0）
                    // 条件2：下方是水但未满（belowLevel < 8）
                    if (below && (below.id === 'air' || (below.id === 'water' && belowLevel < 8))) {
                        // 【修复】确保生成的水方块有正确的属性
                        // 向下写入水，水位强制设为 8（满水位），但 isSource = false（假水源）
                        pendingUpdates.push({
                            x: x,
                            y: y + 1,
                            blockData: { 
                                id: 'water',  // 【修复】确保 id 是 'water'
                                hp: 0, 
                                waterLevel: 8,  // 满格水
                                isSource: false  // 假水源
                            }
                        });
                        
                        // 【调试日志】
                        console.log('Water falling from', y, 'to', y + 1);
                        
                        // 【修复3】完善下落接力逻辑
                        // 必须将新坐标加入 nextActiveWaterSet
                        nextActiveWaterSet.add((y + 1) * MAP_W + x);
                        
                        // 唤醒下方方块的邻居（因为下方水位发生了变化）
                        if (x - 1 >= 0) nextActiveWaterSet.add((y + 1) * MAP_W + (x - 1));
                        if (x + 1 < width) nextActiveWaterSet.add((y + 1) * MAP_W + (x + 1));
                        if (y + 2 < height) nextActiveWaterSet.add((y + 2) * MAP_W + x);
                        
                        // 【关键修复】必须将当前坐标也再次加入 nextActiveWaterSet
                        // 直到它下方不再是空气，才会停止下落
                        nextActiveWaterSet.add(y * MAP_W + x);
                        
                        // 设置标记：成功向下流动
                        flowedDown = true;
                    }
                }
                // ====================================================
                
                // ==================== 阶梯式横向扩散 ====================
                // 只有在没有向下流动时，才进行水平扩散
                // 这确保了重力优先于水平扩散
                // 【注意】：扩散产生的水也是假水源（isSource = false）
                
                // 【补丁：重写横向扩散的前提条件】
                // 在决定是否向左或向右扩散之前，必须先检查当前格子正下方的状态
                // 只有在有固体支撑或真水源支撑时，才允许横向扩散
                
                if (!flowedDown && currentLevel > 1) {
                    // ========== 支撑物验证 ==========
                    // 检查正下方 [y+1][x] 的状态
                    let hasValidSupport = false;
                    
                    if (y + 1 < height) {
                        const below = currentMap[y + 1][x];
                        if (below) {
                            const belowBlockType = BLOCK_TYPES[below.id];
                            
                            // 情况1：正下方是固体方块（泥土、石头等）
                            if (belowBlockType && belowBlockType.solid) {
                                hasValidSupport = true;
                            }
                            // 情况2：正下方是真水源（isSource === true）
                            else if (below.id === 'water' && below.isSource === true) {
                                hasValidSupport = true;
                            }
                            // 绝对禁止的情况：
                            // - 正下方是空气（below.id === 'air'）
                            // - 正下方是假水源/瀑布/流动水（below.id === 'water' && below.isSource === false）
                            // 这些情况下，hasValidSupport 保持为 false
                        }
                    } else {
                        // 如果已经在最底部，认为有支撑
                        hasValidSupport = true;
                    }
                    
                    // 【关键】：只有在有有效支撑时，才允许横向扩散
                    // 如果没有支撑，直接跳过横向扩散逻辑
                    if (!hasValidSupport) {
                        // 半空中的水不能横向扩散，只能继续向下流动
                        // 这样就不会在空中造阶梯了！
                        // 直接跳过后续的扩散逻辑
                    } else {
                        // 有有效支撑，可以进行横向扩散
                        
                        // 计算要蔓延的水位：当前水位 - 1
                        let nextLevel = currentLevel - 1;
                        
                        // 标记：是否发生了扩散
                        let didSpread = false;
                        
                        // ========== 向左扩散 ==========
                        if (x - 1 >= 0) {
                            const left = currentMap[y][x - 1];
                            
                            if (left) {
                                const leftLevel = (left.waterLevel) || 0;
                                
                                // 判断是否可以向左扩散
                                // 条件1：左边是空气（leftLevel = 0）
                                // 条件2：左边是水但水位更低（leftLevel < nextLevel）
                                if (left.id === 'air' || (left.id === 'water' && leftLevel < nextLevel)) {
                                    // 向左写入水，水位为 nextLevel，isSource = false（假水源）
                                    pendingUpdates.push({
                                        x: x - 1,
                                        y: y,
                                        blockData: { id: 'water', hp: 0, waterLevel: nextLevel, isSource: false }
                                    });
                                    
                                    // 唤醒左侧方块及其邻居（因为左侧水位发生了变化）
                                    nextActiveWaterSet.add(y * MAP_W + (x - 1));
                                    if (x - 2 >= 0) nextActiveWaterSet.add(y * MAP_W + (x - 2));
                                    if (y - 1 >= 0) nextActiveWaterSet.add((y - 1) * MAP_W + (x - 1));
                                    if (y + 1 < height) nextActiveWaterSet.add((y + 1) * MAP_W + (x - 1));
                                    
                                    didSpread = true;
                                }
                            }
                        }
                        
                        // ========== 向右扩散 ==========
                        if (x + 1 < width) {
                            const right = currentMap[y][x + 1];
                            
                            if (right) {
                                const rightLevel = (right.waterLevel) || 0;
                                
                                // 判断是否可以向右扩散
                                // 条件1：右边是空气（rightLevel = 0）
                                // 条件2：右边是水但水位更低（rightLevel < nextLevel）
                                if (right.id === 'air' || (right.id === 'water' && rightLevel < nextLevel)) {
                                    // 向右写入水，水位为 nextLevel，isSource = false（假水源）
                                    pendingUpdates.push({
                                        x: x + 1,
                                        y: y,
                                        blockData: { id: 'water', hp: 0, waterLevel: nextLevel, isSource: false }
                                    });
                                    
                                    // 唤醒右侧方块及其邻居（因为右侧水位发生了变化）
                                    nextActiveWaterSet.add(y * MAP_W + (x + 1));
                                    if (x + 2 < width) nextActiveWaterSet.add(y * MAP_W + (x + 2));
                                    if (y - 1 >= 0) nextActiveWaterSet.add((y - 1) * MAP_W + (x + 1));
                                    if (y + 1 < height) nextActiveWaterSet.add((y + 1) * MAP_W + (x + 1));
                                    
                                    didSpread = true;
                                }
                            }
                        }
                        
                        // 如果发生了扩散，也要唤醒当前方块（因为它正在流动，需要持续检查）
                        if (didSpread) {
                            nextActiveWaterSet.add(y * MAP_W + x);
                        }
                    }
                }
                // ====================================================
            }
            // ====================================================
            
            // ==================== 【环境唤醒3】持续重力检查（永不休眠规则）====================
            // 在更替活跃队列之前，检查所有水方块是否下方有空气
            // 如果下方是空气，必须保持在活跃集合中，直到成功下落
            for (let index of activeWaterSet) {
                let x = index % MAP_W;
                let y = Math.floor(index / MAP_W);
                
                // 边界检查
                if (x < 0 || x >= width || y < 0 || y >= height) continue;
                
                const block = currentMap[y][x];
                
                // 只检查水方块
                if (!block || block.id !== 'water') continue;
                
                // 检查正下方是否是空气
                if (y + 1 < height) {
                    const below = currentMap[y + 1][x];
                    
                    // 如果下方是空气，这个水方块永远不能休眠
                    if (below && below.id === 'air') {
                        nextActiveWaterSet.add(y * MAP_W + x);
                        // 同时唤醒下方坐标，确保接力
                        nextActiveWaterSet.add((y + 1) * MAP_W + x);
                    }
                }
            }
            // ====================================================
            
            // ==================== 第9步：状态收尾与活跃队列更替 ====================
            
            // ========== 1. 应用地图更新 ==========
            // 遍历补丁队列（pendingUpdates），一次性应用所有修改到真实游戏地图
            // 这是双缓冲的核心：先收集所有修改，最后统一应用，避免同一帧内的互相影响
            for (let update of pendingUpdates) {
                currentMap[update.y][update.x] = update.blockData;
            }
            
            // ========== 2. 触发光照重新计算 ==========
            // 如果有任何方块发生变化，标记光照图为脏（需要重新计算）
            if (pendingUpdates.length > 0) {
                gameState.lightMapDirty = true;
            }
            
            // ========== 3. 更替活跃队列（休眠机制）==========
            // 清空旧的 activeWaterSet，把本回合收集到的 nextActiveWaterSet 赋值给 activeWaterSet
            // 如果一摊水完全静止了（没有产生任何 update），
            // 它就会自动从队列中消失，进入零性能开销的休眠状态！
            activeWaterSet = nextActiveWaterSet;
            
            // 注意：不需要清空 nextActiveWaterSet，因为下一回合会创建新的 Set
            // （在函数开头：let nextActiveWaterSet = new Set();）
            
            // ========== 4. 触发重绘（可选）==========
            // 注意：本游戏使用独立的 requestAnimationFrame 循环进行渲染
            // 因此不需要在这里手动调用渲染函数
            // 渲染循环会自动检测 gameState.lightMapDirty 并重新绘制
            
            // 如果需要调试，可以输出活跃水方块数量
            // console.log('本回合活跃水方块数量:', activeWaterSet.size, '修改数量:', pendingUpdates.length);
            
            // ====================================================
        }
        
        /**
         * 唤醒水方块及其邻居
         * 将指定坐标及其上下左右四个邻居加入活跃集合
         * 
         * @param {number} x - 方块 X 坐标
         * @param {number} y - 方块 Y 坐标
         * @param {Set} targetSet - 目标活跃集合
         */
        function wakeUpWaterBlock(x, y, targetSet) {
            const { width, height } = WORLD_CONFIG;
            
            // 唤醒自己（使用整数索引）
            if (x >= 0 && x < width && y >= 0 && y < height) {
                targetSet.add(y * MAP_W + x);
            }
            
            // 唤醒上方
            if (y - 1 >= 0) {
                targetSet.add((y - 1) * MAP_W + x);
            }
            
            // 唤醒下方
            if (y + 1 < height) {
                targetSet.add((y + 1) * MAP_W + x);
            }
            
            // 唤醒左侧
            if (x - 1 >= 0) {
                targetSet.add(y * MAP_W + (x - 1));
            }
            
            // 唤醒右侧
            if (x + 1 < width) {
                targetSet.add(y * MAP_W + (x + 1));
            }
        }
        
        /**
         * 启动水流更新定时器
         */
        function startWaterTick() {
            // 如果已经启动，先停止
            if (waterTickInterval !== null) {
                stopWaterTick();
            }
            
            // 每200ms执行一次水流更新
            waterTickInterval = setInterval(updateWaterTick, 200);
            console.log('水流更新系统已启动（200ms/次）');
        }
        
        /**
         * 停止水流更新定时器
         */
        function stopWaterTick() {
            if (waterTickInterval !== null) {
                clearInterval(waterTickInterval);
                waterTickInterval = null;
                console.log('水流更新系统已停止');
            }
        }
        
        /**
         * 水流稳定阶段（世界生成后执行）
         * 让所有水流稳定下来，避免玩家进入世界时看到水流突然变化
         */
        async function stabilizeWater(progressCallback) {
            console.log('开始水流稳定阶段...');
            console.log('初始活跃水方块数量:', activeWaterSet.size);
            
            // 最大迭代次数（防止无限循环）
            const maxIterations = 100;
            let iteration = 0;
            
            // 持续更新水流，直到所有水都稳定（activeWaterSet 为空）
            while (activeWaterSet.size > 0 && iteration < maxIterations) {
                iteration++;
                
                // 执行一次水流更新
                updateWaterTick();
                
                // 更新进度条
                if (progressCallback) {
                    // 根据活跃水方块数量计算进度
                    // 假设初始有很多活跃水方块，随着稳定逐渐减少
                    const progress = Math.min(19, Math.floor((iteration / maxIterations) * 19));
                    await progressCallback(2, progress, `稳定水流系统... 第${iteration}次迭代 (活跃: ${activeWaterSet.size})`);
                }
                
                // 每10次迭代暂停一下，让浏览器有时间更新UI
                if (iteration % 10 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
                
                // 如果活跃水方块数量不再变化，说明已经稳定
                if (activeWaterSet.size === 0) {
                    break;
                }
            }
            
            console.log(`水流稳定完成！总共迭代 ${iteration} 次`);
            console.log('最终活跃水方块数量:', activeWaterSet.size);
            
            if (progressCallback) {
                await progressCallback(2, 19, '水流系统已稳定');
            }
        }
        
        // ==================== 水流更新系统结束 ====================
        
        // 检查指定位置的草地是否需要退化
        function checkGrassDegradation(x, y) {
            const block = getBlock(x, y);
            if (!block || block.id !== 'grassDirt') return;
            
            const aboveBlock = getBlock(x, y - 1);
            if (aboveBlock && aboveBlock.id !== 'air') {
                const aboveBlockType = BLOCK_TYPES[aboveBlock.id];
                if (aboveBlockType && aboveBlockType.solid) {
                    // 草地退化为泥土
                    gameState.worldMap[y][x] = {
                        id: 'dirt',
                        hp: block.hp
                    };
                }
            }
        }
        
        // 生成玩家精灵图函数（火柴人）
        function generatePlayerSprite() {
            const spriteWidth = 32;  // 1格宽
            const spriteHeight = 58; // 1.8格高 (32 * 1.8 = 57.6 ≈ 58)
            
            // 创建精灵图 Canvas（包含所有帧）
            // Idle: 4帧, Run: 6帧, Jump: 1帧 = 总共11帧
            const totalFrames = 11;
            const spriteCanvas = document.createElement('canvas');
            spriteCanvas.width = spriteWidth * totalFrames;
            spriteCanvas.height = spriteHeight;
            const spriteCtx = spriteCanvas.getContext('2d');
            
            // 辅助函数：绘制火柴人单个帧（带关节）
            function drawFrame(frameIndex, animationType, subFrame) {
                const offsetX = frameIndex * spriteWidth;
                const centerX = offsetX + spriteWidth / 2;
                
                // 清空当前帧区域
                spriteCtx.clearRect(offsetX, 0, spriteWidth, spriteHeight);
                
                // 根据动画类型调整参数
                let headBob = 0;
                let armSwingLeft = 0;
                let armSwingRight = 0;
                let legSwingLeft = 0;
                let legSwingRight = 0;
                
                if (animationType === 'idle') {
                    const t = subFrame / 3;
                    headBob = Math.sin(t * Math.PI * 2) * 0.8;
                    armSwingLeft = Math.sin(t * Math.PI * 2) * 5;
                    armSwingRight = Math.sin(t * Math.PI * 2) * 5;
                } else if (animationType === 'run') {
                    const t = subFrame / 5;
                    headBob = Math.abs(Math.sin(t * Math.PI * 2)) * 1.5;
                    armSwingLeft = Math.sin(t * Math.PI * 2) * 45;  // 增加甩臂幅度
                    armSwingRight = Math.sin(t * Math.PI * 2 + Math.PI) * 45;
                    legSwingLeft = Math.sin(t * Math.PI * 2) * 35;
                    legSwingRight = Math.sin(t * Math.PI * 2 + Math.PI) * 35;
                } else if (animationType === 'jump') {
                    headBob = -1;
                    // 上升和下降保持相同姿势，避免切换时的中间状态
                    armSwingLeft = -35;
                    armSwingRight = -35;
                    // 跳跃时腿部姿态：一条腿向后，一条腿弓型向前
                    // 左腿向后（大腿和小腿都向后）
                    legSwingLeft = -20;  // 向后（背离跳跃方向）
                    // 右腿弓型向前（大腿向前，小腿向后弯曲）
                    legSwingRight = 15;  // 大腿向前
                }
                
                const baseY = 2;
                const lineWidth = 2.5; // 稍微加粗线条
                
                // 火柴人颜色
                const stickColor = '#000000';
                
                spriteCtx.lineWidth = lineWidth;
                spriteCtx.lineCap = 'round';
                spriteCtx.lineJoin = 'round';
                
                // === 绘制头部（中空圆形，无五官） ===
                const headRadius = 7;
                const headY = baseY + 7 + headBob;
                
                // 头部轮廓（中空）
                spriteCtx.strokeStyle = stickColor;
                spriteCtx.lineWidth = lineWidth;
                spriteCtx.beginPath();
                spriteCtx.arc(centerX, headY, headRadius, 0, Math.PI * 2);
                spriteCtx.stroke();
                
                // === 绘制身体（直线） ===
                const bodyTop = baseY + 14 + headBob;
                const bodyBottom = baseY + 32 + headBob;
                
                spriteCtx.strokeStyle = stickColor;
                spriteCtx.beginPath();
                spriteCtx.moveTo(centerX, bodyTop);
                spriteCtx.lineTo(centerX, bodyBottom);
                spriteCtx.stroke();
                
                // === 手臂和腿的参数 ===
                const shoulderY = baseY + 17 + headBob;
                const hipY = bodyBottom;
                const upperArmLength = 8;
                const lowerArmLength = 8;
                const upperLegLength = 10;
                const lowerLegLength = 10;
                
                // === 绘制右臂（后面，半透明） ===
                const rightShoulderAngle = armSwingRight;
                const rightElbowX = centerX + Math.sin((rightShoulderAngle * Math.PI) / 180) * upperArmLength;
                const rightElbowY = shoulderY + Math.cos((rightShoulderAngle * Math.PI) / 180) * upperArmLength;
                
                // 右臂肘关节角度
                let rightElbowAngle;
                if (animationType === 'run') {
                    // 跑步时：手臂摆动时添加自然弯曲
                    // 当大臂向后摆动时（负角度），小臂向前弯曲
                    // 当大臂向前摆动时（正角度），小臂继续向前，轻微弯曲
                    if (rightShoulderAngle < 0) {
                        rightElbowAngle = rightShoulderAngle + 50; // 大臂向后时，小臂向前弯曲
                    } else {
                        rightElbowAngle = rightShoulderAngle + 15; // 大臂向前时，小臂继续向前，轻微弯曲
                    }
                } else {
                    // 其他动画保持原有逻辑
                    rightElbowAngle = rightShoulderAngle + (rightShoulderAngle > 0 ? 20 : -20);
                }
                const rightHandX = rightElbowX + Math.sin((rightElbowAngle * Math.PI) / 180) * lowerArmLength;
                const rightHandY = rightElbowY + Math.cos((rightElbowAngle * Math.PI) / 180) * lowerArmLength;
                
                spriteCtx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
                // 上臂
                spriteCtx.beginPath();
                spriteCtx.moveTo(centerX, shoulderY);
                spriteCtx.lineTo(rightElbowX, rightElbowY);
                spriteCtx.stroke();
                // 下臂
                spriteCtx.beginPath();
                spriteCtx.moveTo(rightElbowX, rightElbowY);
                spriteCtx.lineTo(rightHandX, rightHandY);
                spriteCtx.stroke();
                // 肘关节
                spriteCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                spriteCtx.beginPath();
                spriteCtx.arc(rightElbowX, rightElbowY, 1.5, 0, Math.PI * 2);
                spriteCtx.fill();
                
                // === 绘制右腿（后面，半透明） ===
                const rightHipAngle = legSwingRight;
                const rightKneeX = centerX + 2 + Math.sin((rightHipAngle * Math.PI) / 180) * upperLegLength;
                const rightKneeY = hipY + Math.cos((rightHipAngle * Math.PI) / 180) * upperLegLength;
                
                // 右腿膝关节角度
                let rightKneeAngle;
                if (animationType === 'jump' && rightHipAngle > 0) {
                    // 跳跃时：大腿向前，小腿向后弯曲形成弓型
                    rightKneeAngle = rightHipAngle - 50;
                } else if (animationType === 'run') {
                    // 跑步时：添加弓形运动
                    // 当腿向前摆动时（正角度），小腿向后弯曲
                    // 当腿向后摆动时（负角度），小腿继续向后，保持伸直
                    if (rightHipAngle > 0) {
                        rightKneeAngle = rightHipAngle - 40; // 向前摆动时小腿向后弯曲
                    } else {
                        rightKneeAngle = rightHipAngle - 10; // 向后摆动时小腿继续向后，轻微弯曲
                    }
                } else {
                    rightKneeAngle = rightHipAngle + (rightHipAngle > 0 ? 15 : -15);
                }
                const rightFootX = rightKneeX + Math.sin((rightKneeAngle * Math.PI) / 180) * lowerLegLength;
                const rightFootY = rightKneeY + Math.cos((rightKneeAngle * Math.PI) / 180) * lowerLegLength;
                
                spriteCtx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
                // 大腿
                spriteCtx.beginPath();
                spriteCtx.moveTo(centerX, hipY);
                spriteCtx.lineTo(rightKneeX, rightKneeY);
                spriteCtx.stroke();
                // 小腿
                spriteCtx.beginPath();
                spriteCtx.moveTo(rightKneeX, rightKneeY);
                spriteCtx.lineTo(rightFootX, rightFootY);
                spriteCtx.stroke();
                // 膝关节
                spriteCtx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                spriteCtx.beginPath();
                spriteCtx.arc(rightKneeX, rightKneeY, 1.5, 0, Math.PI * 2);
                spriteCtx.fill();
                
                // === 绘制左臂（前面） ===
                const leftShoulderAngle = armSwingLeft;
                const leftElbowX = centerX + Math.sin((leftShoulderAngle * Math.PI) / 180) * upperArmLength;
                const leftElbowY = shoulderY + Math.cos((leftShoulderAngle * Math.PI) / 180) * upperArmLength;
                
                // 左臂肘关节角度
                let leftElbowAngle;
                if (animationType === 'run') {
                    // 跑步时：手臂摆动时添加自然弯曲
                    // 当大臂向后摆动时（负角度），小臂向前弯曲
                    // 当大臂向前摆动时（正角度），小臂继续向前，轻微弯曲
                    if (leftShoulderAngle < 0) {
                        leftElbowAngle = leftShoulderAngle + 50; // 大臂向后时，小臂向前弯曲
                    } else {
                        leftElbowAngle = leftShoulderAngle + 15; // 大臂向前时，小臂继续向前，轻微弯曲
                    }
                } else {
                    // 其他动画保持原有逻辑
                    leftElbowAngle = leftShoulderAngle + (leftShoulderAngle > 0 ? 20 : -20);
                }
                const leftHandX = leftElbowX + Math.sin((leftElbowAngle * Math.PI) / 180) * lowerArmLength;
                const leftHandY = leftElbowY + Math.cos((leftElbowAngle * Math.PI) / 180) * lowerArmLength;
                
                spriteCtx.strokeStyle = stickColor;
                // 上臂
                spriteCtx.beginPath();
                spriteCtx.moveTo(centerX, shoulderY);
                spriteCtx.lineTo(leftElbowX, leftElbowY);
                spriteCtx.stroke();
                // 下臂
                spriteCtx.beginPath();
                spriteCtx.moveTo(leftElbowX, leftElbowY);
                spriteCtx.lineTo(leftHandX, leftHandY);
                spriteCtx.stroke();
                // 肘关节
                spriteCtx.fillStyle = stickColor;
                spriteCtx.beginPath();
                spriteCtx.arc(leftElbowX, leftElbowY, 1.5, 0, Math.PI * 2);
                spriteCtx.fill();
                
                // === 绘制左腿（前面） ===
                const leftHipAngle = legSwingLeft;
                const leftKneeX = centerX - 2 + Math.sin((leftHipAngle * Math.PI) / 180) * upperLegLength;
                const leftKneeY = hipY + Math.cos((leftHipAngle * Math.PI) / 180) * upperLegLength;
                
                // 左腿膝关节角度
                let leftKneeAngle;
                if (animationType === 'jump' && leftHipAngle < 0) {
                    // 跳跃时：大腿向后，小腿也向后（保持伸直或轻微弯曲）
                    leftKneeAngle = leftHipAngle - 10;
                } else if (animationType === 'run') {
                    // 跑步时：添加弓形运动
                    // 当腿向前摆动时（正角度），小腿向后弯曲
                    // 当腿向后摆动时（负角度），小腿继续向后，保持伸直
                    if (leftHipAngle > 0) {
                        leftKneeAngle = leftHipAngle - 40; // 向前摆动时小腿向后弯曲
                    } else {
                        leftKneeAngle = leftHipAngle - 10; // 向后摆动时小腿继续向后，轻微弯曲
                    }
                } else {
                    leftKneeAngle = leftHipAngle + (leftHipAngle > 0 ? 15 : -15);
                }
                const leftFootX = leftKneeX + Math.sin((leftKneeAngle * Math.PI) / 180) * lowerLegLength;
                const leftFootY = leftKneeY + Math.cos((leftKneeAngle * Math.PI) / 180) * lowerLegLength;
                
                spriteCtx.strokeStyle = stickColor;
                // 大腿
                spriteCtx.beginPath();
                spriteCtx.moveTo(centerX, hipY);
                spriteCtx.lineTo(leftKneeX, leftKneeY);
                spriteCtx.stroke();
                // 小腿
                spriteCtx.beginPath();
                spriteCtx.moveTo(leftKneeX, leftKneeY);
                spriteCtx.lineTo(leftFootX, leftFootY);
                spriteCtx.stroke();
                // 膝关节
                spriteCtx.fillStyle = stickColor;
                spriteCtx.beginPath();
                spriteCtx.arc(leftKneeX, leftKneeY, 1.5, 0, Math.PI * 2);
                spriteCtx.fill();
            }
            
            // 绘制所有帧
            let frameIndex = 0;
            
            // Idle 动画 (4帧) - 平滑呼吸动画
            for (let i = 0; i < 4; i++) {
                drawFrame(frameIndex++, 'idle', i);
            }
            
            // Run 动画 (6帧) - 流畅跑步动画
            for (let i = 0; i < 6; i++) {
                drawFrame(frameIndex++, 'run', i);
            }
            
            // Jump 动画 (1帧) - 跳跃姿势
            drawFrame(frameIndex++, 'jump', 0); // 跳跃
            
            // 保存精灵图信息
            playerSprite = {
                canvas: spriteCanvas,
                width: spriteWidth,
                height: spriteHeight,
                animations: {
                    idle: { startFrame: 0, frameCount: 4, fps: 6 },
                    run: { startFrame: 4, frameCount: 6, fps: 12 },
                    jump: { startFrame: 10, frameCount: 1, fps: 8 }
                }
            };
        }
        
        // ========== 通用物理实体基类 ==========
        class PhysicsEntity {
            constructor(x, y, config) {
                // 位置（浮点数，亚像素精度）
                this.x = x;
                this.y = y;
                
                // 插值渲染：记录上一帧位置
                this.prevX = x;
                this.prevY = y;
                
                // 速度（像素/秒）
                this.vx = 0;
                this.vy = 0;
                
                // 实体类型（用于区分不同实体）
                this.entityType = config.entityType || 'unknown';
                
                // 物理参数（从config读取）
                this.width = config.width;
                this.height = config.height;
                this.onGround = false;
                
                // 运动参数
                this.gravity = config.gravity || 980;
                this.terminalVelocity = config.terminalVelocity || 600;
                this.groundFriction = config.groundFriction || 0.7; // 地面摩擦系数（0-1）
                this.velocityThreshold = config.velocityThreshold || 3; // 速度归零阈值
                
                // 水中物理参数
                this.waterDragHorizontal = config.waterDragHorizontal || 0.8875;
                this.waterDragVertical = config.waterDragVertical || 0.775;
                this.waterFriction = config.waterFriction || 450;
                
                // 击退系统参数
                this.knockbackPower = config.knockbackPower || 100; // 击退能力（造成的击退力度）
                this.knockbackResistance = config.knockbackResistance || 0; // 击退抗性（0-1，0=无抗性，1=完全免疫）
            }
            
            // 保存上一帧位置（用于插值渲染）
            savePosition() {
                this.prevX = this.x;
                this.prevY = this.y;
            }
            
            // 检查是否在水中
            checkInWater() {
                const blockSize = WORLD_CONFIG.blockSize;
                const left = Math.floor(this.x / blockSize);
                const right = Math.floor((this.x + this.width - 1) / blockSize);
                const top = Math.floor(this.y / blockSize);
                const bottom = Math.floor((this.y + this.height - 1) / blockSize);
                
                // 检查实体占据的所有方块位置
                for (let y = top; y <= bottom; y++) {
                    for (let x = left; x <= right; x++) {
                        const block = getBlock(x, y);
                        if (block && block.id === 'water') {
                            return true; // 只要有一个方块是水，就认为在水中
                        }
                    }
                }
                return false;
            }
            
            // 应用重力和水中阻力
            applyGravity(dt, inWater = false) {
                if (!this.onGround) {
                    this.vy += this.gravity * dt;
                    
                    // 在水中时应用竖直阻力（只对下落应用阻力，不影响向上跳跃）
                    if (inWater && this.vy > 0) {
                        this.vy *= this.waterDragVertical;
                    }
                    
                    // 限制终端速度
                    if (this.vy > this.terminalVelocity) {
                        this.vy = this.terminalVelocity;
                    }
                } else {
                    // 在地面上时，确保垂直速度为0
                    this.vy = 0;
                }
            }
            
            // 应用地面摩擦力和水中摩擦力
            applyGroundFriction(inWater = false) {
                if (this.onGround && Math.abs(this.vx) > 0.1) {
                    // 使用摩擦系数
                    this.vx *= this.groundFriction;
                    
                    // 在水中时额外减速
                    if (inWater) {
                        this.vx *= this.waterDragHorizontal;
                    }
                    
                    // 如果速度很小，直接归零
                    if (Math.abs(this.vx) < this.velocityThreshold) {
                        this.vx = 0;
                    }
                }
            }
            
            // 应用水平阻力（在空中或水中时）
            applyHorizontalDrag(inWater = false) {
                if (inWater && Math.abs(this.vx) > 0.1) {
                    this.vx *= this.waterDragHorizontal;
                }
            }
            
            // 水平碰撞检测（优化：只检查移动方向的边缘）
            handleHorizontalCollisions() {
                const blockSize = WORLD_CONFIG.blockSize;
                const left = Math.floor(this.x / blockSize);
                const right = Math.floor((this.x + this.width - 1) / blockSize);
                const top = Math.floor(this.y / blockSize);
                const bottom = Math.floor((this.y + this.height - 1) / blockSize);
                
                // 优化：只检查移动方向的边缘
                if (this.vx > 0) {
                    // 向右移动，只检查右边缘
                    for (let y = top; y <= bottom; y++) {
                        const block = getBlock(right, y);
                        if (block && block.id !== 'air') {
                            const blockType = BLOCK_TYPES[block.id];
                            if (blockType && blockType.solid) {
                                this.x = right * blockSize - this.width;
                                this.vx = 0;
                                return;
                            }
                        }
                    }
                } else if (this.vx < 0) {
                    // 向左移动，只检查左边缘
                    for (let y = top; y <= bottom; y++) {
                        const block = getBlock(left, y);
                        if (block && block.id !== 'air') {
                            const blockType = BLOCK_TYPES[block.id];
                            if (blockType && blockType.solid) {
                                this.x = (left + 1) * blockSize;
                                this.vx = 0;
                                return;
                            }
                        }
                    }
                }
            }
            
            // 垂直碰撞检测（优化：只检查移动方向的边缘）
            handleVerticalCollisions() {
                const blockSize = WORLD_CONFIG.blockSize;
                const left = Math.floor(this.x / blockSize);
                const right = Math.floor((this.x + this.width - 1) / blockSize);
                const top = Math.floor(this.y / blockSize);
                const bottom = Math.floor((this.y + this.height - 1) / blockSize);
                
                this.onGround = false;
                
                // 优化：只检查移动方向的边缘
                if (this.vy > 0) {
                    // 向下移动，只检查底部边缘
                    for (let x = left; x <= right; x++) {
                        const block = getBlock(x, bottom);
                        if (block && block.id !== 'air') {
                            const blockType = BLOCK_TYPES[block.id];
                            if (blockType && blockType.solid) {
                                this.y = bottom * blockSize - this.height;
                                this.vy = 0;
                                this.onGround = true;
                                return;
                            }
                        }
                    }
                } else if (this.vy < 0) {
                    // 向上移动，只检查顶部边缘
                    for (let x = left; x <= right; x++) {
                        const block = getBlock(x, top);
                        if (block && block.id !== 'air') {
                            const blockType = BLOCK_TYPES[block.id];
                            if (blockType && blockType.solid) {
                                this.y = (top + 1) * blockSize;
                                this.vy = 0;
                                return;
                            }
                        }
                    }
                } else {
                    // 速度为0时，检查是否在地面上
                    for (let x = left; x <= right; x++) {
                        const block = getBlock(x, bottom);
                        if (block && block.id !== 'air') {
                            const blockType = BLOCK_TYPES[block.id];
                            if (blockType && blockType.solid) {
                                const blockTop = bottom * blockSize;
                                const entityBottom = this.y + this.height;
                                if (Math.abs(entityBottom - blockTop) < 2) {
                                    this.onGround = true;
                                    return;
                                }
                            }
                        }
                    }
                }
            }
            
            // 检查地面状态
            checkGroundStatus() {
                const blockSize = WORLD_CONFIG.blockSize;
                const left = Math.floor(this.x / blockSize);
                const right = Math.floor((this.x + this.width - 1) / blockSize);
                const bottom = Math.floor((this.y + this.height - 1) / blockSize);
                
                // 检查脚下是否有实心方块
                this.onGround = false;
                for (let x = left; x <= right; x++) {
                    const blockBelow = getBlock(x, bottom + 1);
                    if (blockBelow && blockBelow.id !== 'air') {
                        const blockType = BLOCK_TYPES[blockBelow.id];
                        // 只检查实心方块
                        if (blockType && blockType.solid) {
                            // 检查实体是否真的站在方块上（允许1像素的误差）
                            const blockTop = (bottom + 1) * blockSize;
                            const entityBottom = this.y + this.height;
                            if (Math.abs(entityBottom - blockTop) < 2) {
                                this.onGround = true;
                                break;
                            }
                        }
                    }
                }
            }
            
            // 位置对齐（防止颤抖）
            alignToGround() {
                if (this.onGround) {
                    const blockSize = WORLD_CONFIG.blockSize;
                    const bottom = Math.floor((this.y + this.height - 1) / blockSize);
                    const expectedY = bottom * blockSize - this.height;
                    // 如果偏差小于0.5像素，直接对齐
                    if (Math.abs(this.y - expectedY) < 0.5) {
                        this.y = expectedY;
                    }
                }
            }
            
            // 应用击退（考虑击退抗性）
            applyKnockback(vx, vy) {
                // 计算实际击退力度（考虑抗性）
                const resistance = 1 - this.knockbackResistance; // 0=完全免疫，1=无抗性
                this.vx = vx * resistance;
                this.vy = vy * resistance;
            }
            
            // 对目标施加击退（根据攻击者的击退能力）
            knockbackTarget(target, dx, dy) {
                // 计算击退方向
                const knockbackAngle = Math.atan2(dy, dx);
                
                // 使用攻击者的击退能力
                const knockbackForce = this.knockbackPower;
                
                // 判断目标是否在水平线以下（dy > 0表示在下方）
                if (dy > 0) {
                    // 在水平线以下：只进行水平推开，向上击退
                    const knockbackVx = Math.cos(knockbackAngle) * knockbackForce;
                    const knockbackVy = -knockbackForce; // 固定向上击退
                    target.applyKnockback(knockbackVx, knockbackVy);
                } else {

                    slimeBottom > playerTop && slimeTop < playerBottom) {
                    
                    // 碰撞到玩家，造成伤害
                    if (gameState.lastDamageTime === undefined || 
                        gameState.time - gameState.lastDamageTime > 1000) {
                        gameState.health = Math.max(0, gameState.health - 20); // 翻倍伤害：10 -> 20
                        gameState.lastDamageTime = gameState.time;
                        
                        // 使用基类的击退系统
                        const dx = player.x + player.width / 2 - (this.x + this.width / 2);
                        const dy = player.y - this.y;
                        this.knockbackTarget(player, dx, dy);
                    }
                }
            }

                this.health -= damage;
                if (this.health <= 0) {
                    this.isDead = true;
                    
                    // 死亡时掉落凝胶（概率分布）
                    // 20%几率1个，40%几率2个，30%几率3个，8%几率4个，2%几率5个
                    const rand = Math.random() * 100; // 0-100
                    let dropCount;
                    
                    if (rand < 20) {
                        dropCount = 1; // 20% 几率
                    } else if (rand < 60) {
                        dropCount = 2; // 40% 几率 (20% + 40% = 60%)
                    } else if (rand < 90) {
                        dropCount = 3; // 30% 几率 (60% + 30% = 90%)
                    } else if (rand < 98) {
                        dropCount = 4; // 8% 几率 (90% + 8% = 98%)
                    } else {
                        dropCount = 5; // 2% 几率 (98% + 2% = 100%)
                    }
                    
                    const centerX = this.x + this.width / 2;
                    const centerY = this.y + this.height / 2;
                    
                    for (let i = 0; i < dropCount; i++) {
                        // 随机散开掉落物
                        const offsetX = (Math.random() - 0.5) * 20; // -10到10像素
                        const offsetY = (Math.random() - 0.5) * 20;
                        const drop = new Drop(centerX + offsetX, centerY + offsetY, { id: 'gel', color: '#4CAF50' });

                }

                const screenY = renderY - cameraY;

                const centerY = screenY + this.height / 2;

        // 查找指定 x 坐标的地表 y 坐标
        function findSurfaceY(x) {
            for (let y = 0; y < WORLD_CONFIG.height; y++) {
                const block = getBlock(x, y);
                if (block && block.id !== 'air') {
                    return y;
                }
            }
            return WORLD_CONFIG.height - 1;
        }
        
        // 初始化云朵
        function initClouds() {
            const cloudCount = 10; // 减少云朵数量（原来是16）
            for (let i = 0; i < cloudCount; i++) {
                // 随机决定移动方向：50%概率向左，50%概率向右
                const direction = Math.random() < 0.5 ? -1 : 1;
                gameState.clouds.push({
                    screenX: Math.random() * canvas.width, // 使用屏幕坐标，随机分布在屏幕宽度内
                    y: 50 + Math.random() * 200, // 在天空区域
                    speed: (0.02 + Math.random() * 0.03) * direction, // 飘动速度（像素/毫秒），带方向
                    textureIndex: Math.floor(Math.random() * 3), // 随机选择云朵纹理
                    opacity: 0.6 + Math.random() * 0.3 // 随机透明度
                });
            }
        }
        
        // 更新云朵位置
        function updateClouds(deltaTime) {
            // 时间加速时，云朵移动速度也加速
            const timeMultiplier = gameState.gameTime.timeAcceleration ? 50 : 1;
            
            for (let cloud of gameState.clouds) {
                // 根据速度方向飘动（正数向右，负数向左），应用时间倍率
                cloud.screenX += cloud.speed * deltaTime * timeMultiplier;
                
                // 如果云朵飘出屏幕右侧，重置到屏幕左侧
                if (cloud.screenX > canvas.width + 200) {
                    cloud.screenX = -200;
                    cloud.y = 50 + Math.random() * 200;
                    cloud.textureIndex = Math.floor(Math.random() * 3);
                }
                
                // 如果云朵飘出屏幕左侧，重置到屏幕右侧
                if (cloud.screenX < -200) {
                    cloud.screenX = canvas.width + 200;
                    cloud.y = 50 + Math.random() * 200;
                    cloud.textureIndex = Math.floor(Math.random() * 3);
                }
            }
        }
        
        // 渲染云朵
        function renderClouds() {
            if (!textures.clouds) {
                console.log('云朵纹理未加载');
                return;
            }
            
            ctx.save();
            let renderedCount = 0;
            for (let cloud of gameState.clouds) {
                // 云朵使用屏幕坐标系，不受摄像机影响
                // 只有云朵自己的移动会改变位置
                const screenX = cloud.screenX;
                const screenY = cloud.y;
                
                // 只渲染在屏幕范围内的云朵
                if (screenX > -300 && screenX < canvas.width + 300 &&
                    screenY > -100 && screenY < 400) {
                    ctx.globalAlpha = cloud.opacity;
                    ctx.drawImage(textures.clouds[cloud.textureIndex], screenX, screenY);
                    renderedCount++;
                }
            }
            ctx.globalAlpha = 1.0;
            ctx.restore();
            
            // 调试信息
            if (gameState.debugMode && gameState.clouds.length > 0) {
                ctx.fillStyle = '#FFFF00';
                ctx.font = '12px monospace';
                ctx.fillText(`云朵: ${renderedCount}/${gameState.clouds.length} 可见`, 10, canvas.height - 10);
            }
        }
        
        // 生成史莱姆
        function spawnSlime() {
            const blockSize = WORLD_CONFIG.blockSize;
            const player = gameState.player;
            
            // 在屏幕边界外生成史莱姆
            // 计算屏幕宽度的一半（从玩家到屏幕边缘的距离）
            const screenHalfWidth = canvas.width / 2;
            
            // 生成距离：屏幕边缘附近（屏幕宽度的0.8到1.2倍）
            const minDistance = screenHalfWidth * 0.8; // 靠近屏幕边缘
            const maxDistance = screenHalfWidth * 1.2; // 稍微超出屏幕边缘
            
            // 随机选择左侧或右侧
            const side = Math.random() > 0.5 ? 1 : -1;
            const distance = minDistance + Math.random() * (maxDistance - minDistance);
            
            const spawnWorldX = player.x + side * distance;
            const spawnGridX = Math.floor(spawnWorldX / blockSize);
            
            // 确保在世界范围内
            if (spawnGridX < 10 || spawnGridX >= WORLD_CONFIG.width - 10) {
                return; // 太靠近边缘，不生成
            }
            
            // 找到地表位置
            const spawnGridY = findSurfaceY(spawnGridX);
            
            // 检查是否是有效的生成位置（地面上方有空间）
            const aboveBlock = getBlock(spawnGridX, spawnGridY - 1);
            if (aboveBlock && aboveBlock.id !== 'air') {
                return; // 上方有方块，不生成
            }
            
            // 创建史莱姆
            const slime = new Slime(
                spawnGridX * blockSize,
                (spawnGridY - 1) * blockSize
            );
            
            gameState.slimes.push(slime);
        }
        
        // 玩家死亡处理
        function handlePlayerDeath() {
            if (gameState.isDead) return;
            
            gameState.isDead = true;
            const blockSize = WORLD_CONFIG.blockSize;
            
            // 计算玩家当前位置的方块坐标
            const playerGridX = Math.floor((gameState.player.x + gameState.player.width / 2) / blockSize);
            const playerGridY = Math.floor((gameState.player.y + gameState.player.height) / blockSize);
            
            // 寻找墓碑放置位置（玩家正下方或附近最近的实心方块上方）
            let tombstoneX = playerGridX;
            let tombstoneY = playerGridY;
            let found = false;
            
            // 首先尝试玩家正下方
            for (let y = playerGridY; y < WORLD_CONFIG.height; y++) {
                const block = getBlock(playerGridX, y);
                if (block && block.id !== 'air') {
                    const blockType = BLOCK_TYPES[block.id];
                    if (blockType && blockType.solid) {
                        tombstoneX = playerGridX;
                        tombstoneY = y - 1; // 方块上方
                        found = true;
                        break;
                    }
                }
            }
            
            // 如果正下方没找到，搜索周围
            if (!found) {
                let minDistance = Infinity;
                for (let radius = 1; radius <= 10; radius++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        for (let dy = -radius; dy <= radius; dy++) {
                            const checkX = playerGridX + dx;
                            const checkY = playerGridY + dy;
                            
                            if (checkX < 0 || checkX >= WORLD_CONFIG.width || 
                                checkY < 0 || checkY >= WORLD_CONFIG.height) continue;
                            
                            const block = getBlock(checkX, checkY);
                            if (block && block.id !== 'air') {
                                const blockType = BLOCK_TYPES[block.id];
                                if (blockType && blockType.solid) {
                                    // 检查上方是否有空间
                                    const aboveBlock = getBlock(checkX, checkY - 1);
                                    if (aboveBlock && aboveBlock.id === 'air') {
                                        const distance = Math.abs(dx) + Math.abs(dy);
                                        if (distance < minDistance) {
                                            minDistance = distance;
                                            tombstoneX = checkX;
                                            tombstoneY = checkY - 1;
                                            found = true;
                                        }
                                    }
                                }
                            }
                        }
                    }
                    if (found) break;
                }
            }
            
            // 如果还是没找到，就放在玩家当前位置
            if (!found) {
                tombstoneX = playerGridX;
                tombstoneY = playerGridY;
            }
            
            // 保存玩家物品栏到墓碑
            const tombstoneInventory = gameState.inventory.slots.map(slot => ({
                item: slot.item,
                count: slot.count
            }));
            
            // 放置墓碑方块
            setBlock(tombstoneX, tombstoneY, { id: 'tombstone', hp: 2 });
            
            // 添加墓碑数据
            gameState.tombstones.push({
                x: tombstoneX,
                y: tombstoneY,
                inventory: tombstoneInventory
            });
            
            // 清空玩家物品栏
            gameState.inventory.slots = Array(10).fill(null).map(() => ({ item: null, count: 0 }));
            
            // 设置复活计时器（5秒）
            gameState.respawnTimer = 5000;
        }

        // 更新鼠标世界坐标
        function updateMouseWorldPosition(screenX, screenY) {
            const blockSize = WORLD_CONFIG.blockSize;
            
            // 保存屏幕坐标
            gameState.mouse.screenX = screenX;
            gameState.mouse.screenY = screenY;
            
            // 转换为世界坐标
            gameState.mouse.worldX = screenX + gameState.camera.x;
            gameState.mouse.worldY = screenY + gameState.camera.y;
            
            // 转换为网格坐标
            gameState.mouse.gridX = Math.floor(gameState.mouse.worldX / blockSize);
            gameState.mouse.gridY = Math.floor(gameState.mouse.worldY / blockSize);
            
            // 计算与玩家的距离
            if (gameState.player) {
                // 计算方块中心坐标
                const blockCenterX = (gameState.mouse.gridX + 0.5) * blockSize;
                const blockCenterY = (gameState.mouse.gridY + 0.5) * blockSize;
                
                // 计算玩家中心坐标
                const playerCenterX = gameState.player.x + gameState.player.width / 2;
                const playerCenterY = gameState.player.y + gameState.player.height / 2;
                
                // 计算像素距离
                const pixelDistance = Math.hypot(
                    blockCenterX - playerCenterX,
                    blockCenterY - playerCenterY
                );
                
                // 判断是否在挖掘范围内
                const maxDistance = GAME_CONFIG.miningRange * blockSize;
                gameState.mouse.inRange = pixelDistance <= maxDistance;
            } else {
                gameState.mouse.inRange = false;
            }
        }
        
        // 更新摄像机位置（跟随玩家）
        function updateCamera() {
            if (!gameState.player) return;
            
            // 保存旧的摄像机位置
            const oldCameraX = gameState.camera.x;
            const oldCameraY = gameState.camera.y;
            
            const targetX = gameState.player.x + gameState.player.width / 2 - canvas.width / 2;
            const targetY = gameState.player.y + gameState.player.height / 2 - canvas.height / 2;
            
            // 计算与目标的距离
            const deltaX = targetX - gameState.camera.x;
            const deltaY = targetY - gameState.camera.y;
            
            // 关键优化：添加死区，小范围移动不更新摄像机
            const deadZone = 0.5; // 0.5像素的死区
            
            let newCameraX = gameState.camera.x;
            let newCameraY = gameState.camera.y;
            
            // 只有超过死区才移动摄像机
            if (Math.abs(deltaX) > deadZone) {
                // 使用线性插值，但对小移动使用更强的阻尼
                const lerpFactor = Math.abs(deltaX) > 5 ? 0.2 : 0.1;
                newCameraX = gameState.camera.x + deltaX * lerpFactor;
            }
            
            if (Math.abs(deltaY) > deadZone) {
                const lerpFactor = Math.abs(deltaY) > 5 ? 0.2 : 0.1;
                newCameraY = gameState.camera.y + deltaY * lerpFactor;
            }
            
            // 限制摄像机范围
            const maxX = WORLD_CONFIG.width * WORLD_CONFIG.blockSize - canvas.width;
            const maxY = WORLD_CONFIG.height * WORLD_CONFIG.blockSize - canvas.height;
            
            newCameraX = Math.max(0, Math.min(newCameraX, maxX));
            newCameraY = Math.max(0, Math.min(newCameraY, maxY));
            
            // 关键优化：如果移动距离小于0.3像素，直接对齐到目标
            const finalDeltaX = targetX - newCameraX;
            const finalDeltaY = targetY - newCameraY;
            
            if (Math.abs(finalDeltaX) < 0.3) {
                newCameraX = targetX;
            }
            if (Math.abs(finalDeltaY) < 0.3) {
                newCameraY = targetY;
            }
            
            // 使用floor取整，确保像素对齐
            gameState.camera.x = Math.floor(newCameraX);
            gameState.camera.y = Math.floor(newCameraY);
            
            // ========== 关键修复：检测摄像机移动，标记光照需要更新 ==========
            const blockSize = WORLD_CONFIG.blockSize;
            const oldGridX = Math.floor(oldCameraX / blockSize);
            const oldGridY = Math.floor(oldCameraY / blockSize);
            const newGridX = Math.floor(gameState.camera.x / blockSize);
            const newGridY = Math.floor(gameState.camera.y / blockSize);
            
            // 如果摄像机移动超过一定距离（以格子为单位），标记光照为脏
            const gridMoveThreshold = 10; // 增加阈值：移动10格以上才更新光照（从5改为10）
            if (Math.abs(newGridX - oldGridX) >= gridMoveThreshold || 
                Math.abs(newGridY - oldGridY) >= gridMoveThreshold) {
                gameState.lightMapDirty = true;
            }
            
            // 重新计算鼠标世界坐标
            if (gameState.mouse.screenX !== undefined && gameState.mouse.screenY !== undefined) {
                updateMouseWorldPosition(gameState.mouse.screenX, gameState.mouse.screenY);
            }
        }
