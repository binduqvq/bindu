            }
            
            // 处理键盘输入
            if (gameState.player) {
                // 设置移动状态（不直接修改速度）
                gameState.player.setMoveLeft(keys.left);
                gameState.player.setMoveRight(keys.right);
                
                // 处理跳跃
                if (keys.up) {
                    gameState.player.jump();
                    keys.up = false; // 防止连续跳跃
                }
                
                // 更新玩家
                gameState.player.update(deltaTime);
            }
            
            // 处理持续挖掘
            if (gameState.mouse.isDown) {
                handleContinuousMining();
                // 更新挖掘动画计时器
                gameState.mining.animationTimer += deltaTime;
            } else {
                // 不在挖掘时重置动画计时器
                gameState.mining.animationTimer = 0;
            }
            
            // 更新粒子（性能优化：限制最大数量）
            const maxParticles = 150; // 降低最大粒子数量 200->150
            if (gameState.particles.length > maxParticles) {
                // 移除最老的粒子
                gameState.particles = gameState.particles.slice(-maxParticles);
            }
            
            // 批量更新粒子（使用for循环代替filter，性能更好）
            let particleIndex = 0;
            for (let i = 0; i < gameState.particles.length; i++) {
                if (gameState.particles[i].update(deltaTime)) {
                    gameState.particles[particleIndex++] = gameState.particles[i];
                }
            }
            gameState.particles.length = particleIndex;
            
            // 更新掉落物（性能优化：限制最大数量）
            const maxDrops = 80; // 降低最大掉落物数量 100->80
            if (gameState.drops.length > maxDrops) {
                // 移除最老的掉落物
                gameState.drops = gameState.drops.slice(-maxDrops);
            }
            
            // 批量更新掉落物（使用for循环代替filter）
            let dropIndex = 0;
            for (let i = 0; i < gameState.drops.length; i++) {
                if (gameState.drops[i].update(deltaTime)) {
                    gameState.drops[dropIndex++] = gameState.drops[i];
                }
            }
            gameState.drops.length = dropIndex;
            
            // 更新史莱姆（性能优化：适度降低更新频率）
            if (!gameState.slimeUpdateTimer) gameState.slimeUpdateTimer = 0;
            gameState.slimeUpdateTimer += deltaTime;
            
            // 每帧都更新史莱姆（恢复流畅度）
            // 使用 for 循环代替 forEach（性能更好）
            for (let i = 0; i < gameState.slimes.length; i++) {
                gameState.slimes[i].update(deltaTime, gameState.player);
            }
            
            // 移除死亡的史莱姆和超出范围的史莱姆（优化：使用平方距离）
            // 使用传统for循环代替filter，性能更好
            let slimeIndex = 0;
            for (let i = 0; i < gameState.slimes.length; i++) {
                const slime = gameState.slimes[i];
                let shouldKeep = true;
                
                if (slime.isDead) {
                    shouldKeep = false;
                } else if (gameState.player) {
                    // 检查是否超出消失范围（100格 = 3200像素）- 使用平方距离避免开方
                    const dx = slime.x - gameState.player.x;
                    const dy = slime.y - gameState.player.y;
                    const distanceSquared = dx * dx + dy * dy;
                    const despawnRangeSquared = slime.despawnRange * slime.despawnRange;
                    
                    // 超出消失范围，移除史莱姆
                    if (distanceSquared > despawnRangeSquared) {
                        shouldKeep = false;
                    }
                }
                
                if (shouldKeep) {
                    gameState.slimes[slimeIndex++] = slime;
                }
            }
            gameState.slimes.length = slimeIndex;
            
            // 更新云朵（性能优化：降低更新频率）
            if (!gameState.cloudUpdateTimer) gameState.cloudUpdateTimer = 0;
            gameState.cloudUpdateTimer += deltaTime;
            
            // 每3帧更新一次云朵（约20fps）
            if (gameState.cloudUpdateTimer >= 50) {
                gameState.cloudUpdateTimer = 0;
                updateClouds(deltaTime * 3); // 补偿跳过的帧
            }
            
            // 饱食度消耗逻辑（每分钟减10点）
            gameState.hungerTimer += deltaTime;
            const hungerInterval = 60000; // 60秒 = 1分钟
            if (gameState.hungerTimer >= hungerInterval) {
                gameState.hungerTimer = 0;
                gameState.hunger = Math.max(0, gameState.hunger - 10);
            }
            
            // 生命值自然恢复逻辑（饱食度 >= 70时，每秒回复2点）
            if (gameState.hunger >= 70 && gameState.health < gameState.maxHealth) {
                gameState.healthRegenTimer += deltaTime;
                const regenInterval = 1000; // 1秒
                if (gameState.healthRegenTimer >= regenInterval) {
                    gameState.healthRegenTimer = 0;
                    gameState.health = Math.min(gameState.maxHealth, gameState.health + 2);
                }
            } else {
                // 饱食度不足时重置恢复计时器
                gameState.healthRegenTimer = 0;
            }
            
            // 饥饿伤害逻辑
            if (gameState.hunger === 0) {
                // 饱食度为0，玩家直接死亡
                if (gameState.health > 0) {
                    gameState.health = 0;
                }
            } else if (gameState.hunger < 30) {
                // 饱食度低于30（不包括30），开始掉血
                gameState.starvationTimer += deltaTime;
                const starvationInterval = 1000; // 1秒
                
                if (gameState.starvationTimer >= starvationInterval) {
                    gameState.starvationTimer = 0;
                    
                    // 根据饱食度决定掉血速度
                    let damage = 0;
                    if (gameState.hunger < 20) {
                        damage = 2; // 低于20：2hp/s
                    } else {
                        damage = 1; // 低于30但不低于20：1hp/s
                    }
                    
                    gameState.health = Math.max(0, gameState.health - damage);
                }
            } else {
                // 饱食度 >= 30，重置饥饿伤害计时器
                gameState.starvationTimer = 0;
            }
            
            // 史莱姆生成逻辑
            gameState.slimeSpawnTimer += deltaTime;
            const spawnInterval = 10000; // 每10秒尝试生成一次（从7秒改为10秒）
            const maxSlimes = 3; // 最多同时存在3个史莱姆（从5降到3）
            
            if (gameState.slimeSpawnTimer >= spawnInterval) {
                gameState.slimeSpawnTimer = 0;
                
                // 只有当史莱姆数量少于最大值时才生成
                if (gameState.slimes.length < maxSlimes) {
                    // 80%的概率生成
                    if (Math.random() < 0.8) {
                        spawnSlime();
                    }
                }
            }
            
            // 草地扩散和退化逻辑（分帧优化版）
            // 每帧检查10个方块，避免阻塞主线程
            updateGrassSpreadPerFrame();
        }
        
        // 草地扩散和退化逻辑（分帧优化版 - 每帧只检查5个方块）
        function updateGrassSpreadPerFrame() {
            // 初始化草地扩散状态
            if (!gameState.grassSpreadState) {
                gameState.grassSpreadState = {
                    checksPerFrame: 5,  // 降低每帧检查数量 10->5
                    checkRadius: 50      // 玩家周围50格
                };
            }
            
            const state = gameState.grassSpreadState;
            const playerGridX = Math.floor(gameState.player.x / WORLD_CONFIG.blockSize);
            const playerGridY = Math.floor(gameState.player.y / WORLD_CONFIG.blockSize);
            
            // 每帧检查5个方块
            for (let i = 0; i < state.checksPerFrame; i++) {
                // 在玩家周围随机选择方块
                const offsetX = Math.floor(Math.random() * state.checkRadius * 2) - state.checkRadius;
                const offsetY = Math.floor(Math.random() * state.checkRadius * 2) - state.checkRadius;
                const x = playerGridX + offsetX;
                const y = playerGridY + offsetY;
                
                // 边界检查
                if (x < 0 || x >= WORLD_CONFIG.width || y < 0 || y >= WORLD_CONFIG.height) {
                    continue;
                }
                
                const block = getBlock(x, y);
                if (!block) continue;
                
                // 检查草地退化：草地上方有实心方块覆盖
                if (block.id === 'grassDirt') {
                    const aboveBlock = getBlock(x, y - 1);
                    if (aboveBlock && aboveBlock.id !== 'air') {
                        // 检查上方方块是否是实心方块
                        const aboveBlockType = BLOCK_TYPES[aboveBlock.id];
                        if (aboveBlockType && aboveBlockType.solid) {
                            // 上方有实心方块，草地退化为泥土
                            gameState.worldMap[y][x] = {
                                id: 'dirt',
                                hp: block.hp
                            };
                        }
                    }
                }
                
                // 检查泥土变草地：泥土在顶端且左右有草地
                if (block.id === 'dirt') {
                    const aboveBlock = getBlock(x, y - 1);
                    // 必须上方是空气（顶端）
                    if (aboveBlock && aboveBlock.id === 'air') {
                        const leftBlock = getBlock(x - 1, y);
                        const rightBlock = getBlock(x + 1, y);
                        
                        const leftIsGrass = leftBlock && leftBlock.id === 'grassDirt';
                        const rightIsGrass = rightBlock && rightBlock.id === 'grassDirt';
                        
                        let spreadChance = 0;
                        if (leftIsGrass && rightIsGrass) {
                            spreadChance = 0.8; // 两边都有草：80%概率
                        } else if (leftIsGrass || rightIsGrass) {
                            spreadChance = 0.4; // 一边有草：40%概率
                        }
                        
                        if (spreadChance > 0 && Math.random() < spreadChance) {
                            // 泥土变成草地
                            gameState.worldMap[y][x] = {
                                id: 'grassDirt',
                                hp: block.hp
                            };
                        }
                    }
                }
            }
        }
        
        // 游戏循环（修复版 + 插值渲染 + 帧时间稳定 + 240fps帧率上限）
        let lastTime = performance.now();
        let lastFpsTime = performance.now();
        let frameCount = 0;
        let currentFPS = 60;
        let slowFrameCount = 0;
        let accumulator = 0;
        const fixedTimeStep = 16.67; // 固定时间步长：60fps
        let lowFpsCounter = 0;
        
        // 帧率限制：锁定240fps上限
        const MAX_FPS = 240;
        const TARGET_FRAME_TIME = 1000 / MAX_FPS; // 约4.17ms
        
        // 性能优化：使用高精度时间戳
        const useHighResTime = typeof performance !== 'undefined' && performance.now;
        
        function gameLoop(currentTime) {
            try {
                // 使用高精度时间戳
                const now = useHighResTime ? performance.now() : currentTime;
                let deltaTime = now - lastTime;
                
                // 帧率限制：如果deltaTime小于目标帧时间，则跳过本帧
                if (deltaTime < TARGET_FRAME_TIME) {
                    requestAnimationFrame(gameLoop);
                    return;
                }
                
                lastTime = now;
                
                // 限制deltaTime，防止异常值（最小值为目标帧时间，最大100ms防止卡顿跳跃）
                deltaTime = Math.max(TARGET_FRAME_TIME, Math.min(100, deltaTime));
                
                // 性能监控
                if (deltaTime > 50) {
                    slowFrameCount++;
                    lowFpsCounter++;
                    
                    if (lowFpsCounter > 10 && !gameState.performanceMode) {
                        gameState.performanceMode = true;
                        console.log('检测到低帧率，已自动启用性能模式');
                    }
                    
                    if (slowFrameCount > 10) {
                        console.warn('检测到连续慢帧，可能存在性能问题');
                        slowFrameCount = 0;
                    }
                } else {
                    slowFrameCount = 0;
                    if (lowFpsCounter > 0) lowFpsCounter--;
                    if (lowFpsCounter === 0 && gameState.performanceMode) {
                        gameState.performanceMode = false;
                        console.log('帧率恢复正常，已关闭性能模式');
                    }
                }
                
                // 计算FPS
                frameCount++;
                if (now - lastFpsTime >= 1000) {
                    currentFPS = Math.round(frameCount * 1000 / (now - lastFpsTime));
                    frameCount = 0;
                    lastFpsTime = now;
                }
                gameState.currentFPS = currentFPS;
                
                // 固定时间步长更新（优化：限制最大更新次数）
                accumulator += deltaTime;
                if (accumulator > 200) accumulator = 200;
                
                // 关键优化：确保每帧至少更新一次，但不超过2次（降低3->2）
                let updateCount = 0;
                while (accumulator >= fixedTimeStep && updateCount < 2) {
                    update(fixedTimeStep);
                    accumulator -= fixedTimeStep;
                    updateCount++;
                }
                
                // 关键优化：在所有更新完成后，立即更新摄像机
                // 这样可以确保摄像机位置与玩家位置同步
                updateCamera();
                
                // 渲染（使用最新的摄像机位置）
                render();
            } catch (error) {
                console.error('游戏循环错误:', error);
                // 尝试恢复游戏状态
                try {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FF0000';
                    ctx.font = '24px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('游戏出错，请刷新页面', canvas.width / 2, canvas.height / 2);
                    ctx.fillStyle = '#FFF';
                    ctx.font = '16px monospace';
                    ctx.fillText(error.message, canvas.width / 2, canvas.height / 2 + 40);
                    ctx.fillText('按F12查看控制台了解详情', canvas.width / 2, canvas.height / 2 + 70);
                } catch (e) {
                    console.error('无法显示错误信息:', e);
                }
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // 游戏循环启动函数
        function startGameLoop() {
            requestAnimationFrame(gameLoop);
            // 启动水流更新系统
            startWaterTick();
        }
        
        // 启动游戏（异步）
        initGame();
        
        // 键盘控制
        window.addEventListener('keydown', (e) => {
            // F3键切换调试模式
            if (e.key === 'F3') {
                gameState.debugMode = !gameState.debugMode;
                e.preventDefault();
                return;
            }
            
            // G键装配神器镐（作弊工具）
            if (e.key === 'g' || e.key === 'G') {
                // 检查背包中是否已有神器镐
                let hasGodPickaxe = false;
                for (let i = 0; i < gameState.inventory.slots.length; i++) {
                    const slot = gameState.inventory.slots[i];
                    if (slot && slot.item === 'godPickaxe') {
                        hasGodPickaxe = true;
                        break;
                    }
                }
                
                // 如果没有，添加到背包
                if (!hasGodPickaxe) {
                    addItemToInventory('godPickaxe', 1);
                    console.log('已装配神器镐！无限伤害，一击破坏任何方块！');
                }
                e.preventDefault();
                return;
            }
            
            // I+H组合键切换时间加速（50倍速）
            if (e.key === 'i' || e.key === 'I') {
                keys.i = true;
                const now = Date.now();
                // 检查H键是否已经按下或在容错时间内
                if (keys.h || (now - lastIHPressTime < IH_COMBO_WINDOW)) {
                    toggleTimeAcceleration();
                    e.preventDefault();
                    return;
                }
                // 记录I键按下时间
                lastIHPressTime = now;
                // I键单独按下没有功能
                e.preventDefault();
                return;
            }
            
            if (e.key === 'h' || e.key === 'H') {
                keys.h = true;
                const now = Date.now();
                // 检查I键是否已经按下或在容错时间内
                if (keys.i || (now - lastIHPressTime < IH_COMBO_WINDOW)) {
                    toggleTimeAcceleration();
                    e.preventDefault();
                    return;
                }
                // 记录H键按下时间
                lastIHPressTime = now;
                // H键单独按下没有功能
                e.preventDefault();
                return;
            }
            
            // M键打开/关闭全屏小地图
            if (e.key === 'm' || e.key === 'M') {
                if (!gameState.inventoryOpen) { // 背包打开时不处理M键
                    gameState.minimapExpanded = !gameState.minimapExpanded;
                    // 如果是打开小地图，重置拖拽偏移量
                    if (gameState.minimapExpanded) {
                        gameState.minimapDrag.offsetX = 0;
                        gameState.minimapDrag.offsetY = 0;
                        gameState.minimapDrag.lastOffsetX = 0;
                        gameState.minimapDrag.lastOffsetY = 0;
                    } else {
                        // 关闭时重置拖拽状态
                        gameState.minimapDrag.isDragging = false;
                    }
                }
                e.preventDefault();
                return;
            }
            
            // ESC键处理
            if (e.key === 'Escape') {
                // 优先关闭全屏地图
                if (gameState.minimapExpanded) {
                    gameState.minimapExpanded = false;
                    // 重置拖拽状态
                    gameState.minimapDrag.isDragging = false;
                    e.preventDefault();
                    return;
                }
                
                // 然后处理背包开关
                gameState.inventoryOpen = !gameState.inventoryOpen;
                // 关闭背包时重置状态并返回合成栏物品
                if (!gameState.inventoryOpen) {
                    gameState.lastHoveredCraftingSlot = null;
                    returnCraftingSlotsToInventory();
                }
                e.preventDefault();
                return;
            }
            
            // 背包或全屏小地图打开时，禁用移动控制
            if (gameState.inventoryOpen || gameState.minimapExpanded) {
                return;
            }
            
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = true;
                e.preventDefault();
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = true;
                e.preventDefault();
            }
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
                keys.up = true;
                e.preventDefault();
            }
        });
        
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                keys.left = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                keys.right = false;
            }
            if (e.key === 'i' || e.key === 'I') {
                keys.i = false;
            }
            if (e.key === 'h' || e.key === 'H') {
                keys.h = false;
            }
        });
        
        // 数字键选择热键栏（1-9对应slot 0-8，0对应slot 9）
        window.addEventListener('keydown', (e) => {
            // 如果菜单界面打开，不处理数字键切换快捷栏
            if (gameState.inventoryOpen) {
                return;
            }
            
            // 1-9 键对应 slot 0-8
            if (e.key >= '1' && e.key <= '9') {
                const slotIndex = parseInt(e.key) - 1;
                gameState.inventory.selectedSlot = slotIndex;
                // 显示1秒提示
                gameState.tooltipTimer = 1000;
                gameState.tooltipSlot = slotIndex;
                e.preventDefault();
            }
            // 0 键对应 slot 9
            if (e.key === '0') {
                gameState.inventory.selectedSlot = 9;
                // 显示1秒提示
                gameState.tooltipTimer = 1000;
                gameState.tooltipSlot = 9;
                e.preventDefault();
            }
        });
        
        // 鼠标滚轮切换物品栏
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            // 如果菜单界面打开，不处理滚轮切换快捷栏
            if (gameState.inventoryOpen) {
                return;
            }
            
            // 如果全屏小地图打开，不处理滚轮切换快捷栏
            if (gameState.minimapExpanded) {
                return;
            }
            
            // 向上滚动（deltaY < 0）：选择前一个格子
            // 向下滚动（deltaY > 0）：选择后一个格子
            if (e.deltaY < 0) {
                // 向上滚动，选择前一个
                gameState.inventory.selectedSlot--;
                if (gameState.inventory.selectedSlot < 0) {
                    gameState.inventory.selectedSlot = 9; // 循环到最后一个
                }
            } else if (e.deltaY > 0) {
                // 向下滚动，选择后一个
                gameState.inventory.selectedSlot++;
                if (gameState.inventory.selectedSlot > 9) {
                    gameState.inventory.selectedSlot = 0; // 循环到第一个
                }
            }
            
            // 显示1秒提示
            gameState.tooltipTimer = 1000;
            gameState.tooltipSlot = gameState.inventory.selectedSlot;
        }, { passive: false });
        
        // 鼠标移动监听
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            
            // 如果全屏地图打开且正在拖拽，更新偏移量
            if (gameState.minimapExpanded && gameState.minimapDrag.isDragging) {
                const blockSize = WORLD_CONFIG.blockSize;
                const screenWidthInBlocks = Math.ceil(canvas.width / blockSize);
                const screenHeightInBlocks = Math.ceil(canvas.height / blockSize);
                const viewportScale = 1.3;
                const viewWidthInBlocks = Math.floor(screenWidthInBlocks * viewportScale);
                const viewHeightInBlocks = Math.floor(screenHeightInBlocks * viewportScale);
                
                // 计算鼠标移动的像素距离
                const deltaX = screenX - gameState.minimapDrag.startMouseX;
                const deltaY = screenY - gameState.minimapDrag.startMouseY;
                
                // 计算地图的缩放比例
                const padding = 40;
                const mapWidth = canvas.width - padding * 2;
                const mapHeight = canvas.height - padding * 2;
                const scaleX = mapWidth / viewWidthInBlocks;
                const scaleY = mapHeight / viewHeightInBlocks;
                const scale = Math.min(scaleX, scaleY);
                
                // 将像素移动转换为方块移动（反向，因为拖拽是移动视野）
                const blockDeltaX = -Math.round(deltaX / scale);
                const blockDeltaY = -Math.round(deltaY / scale);
                
                // 更新偏移量（基于上次保存的偏移量）
                gameState.minimapDrag.offsetX = gameState.minimapDrag.lastOffsetX + blockDeltaX;
                gameState.minimapDrag.offsetY = gameState.minimapDrag.lastOffsetY + blockDeltaY;
                
                // 限制偏移量范围（不超出世界边界）
                const playerBlockX = Math.floor((gameState.player.x + gameState.player.width / 2) / blockSize);
                const playerBlockY = Math.floor((gameState.player.y + gameState.player.height / 2) / blockSize);
                
                const maxOffsetX = WORLD_CONFIG.width - playerBlockX - Math.floor(viewWidthInBlocks / 2);
                const minOffsetX = -playerBlockX + Math.floor(viewWidthInBlocks / 2);
                const maxOffsetY = WORLD_CONFIG.height - playerBlockY - Math.floor(viewHeightInBlocks / 2);
                const minOffsetY = -playerBlockY + Math.floor(viewHeightInBlocks / 2);
                
                gameState.minimapDrag.offsetX = Math.max(minOffsetX, Math.min(maxOffsetX, gameState.minimapDrag.offsetX));
                gameState.minimapDrag.offsetY = Math.max(minOffsetY, Math.min(maxOffsetY, gameState.minimapDrag.offsetY));
                
                return;
            }
            
            updateMouseWorldPosition(screenX, screenY);
            
            // 拖动物品扫过合成栏自动填充（仅在长按左键时触发）
            if (gameState.inventoryOpen && gameState.draggedItem && gameState.mouse.isDown) {
                // 只有在左键按下时才触发扫过填充
                // 排除从合成栏拖出的物品
                const sourceType = gameState.draggedItem.sourceType;
                
                // 只有从非合成栏拖出的物品才能自动填充到合成栏
                // sourceType 为 null 表示交换后的物品或右键分离后松开的物品，允许填充
                if (sourceType !== 'crafting' && sourceType !== 'craftingOutput') {
                    const slotSize = 50;
                    const slotSpacing = 5;
                    const cols = 10;
                    const sectionSpacing = 15;
                    const backpackWidth = cols * (slotSize + slotSpacing) - slotSpacing;
                    const backpackHeight = 5 * (slotSize + slotSpacing) - slotSpacing + 60;
                    const equipmentWidth = slotSize + 20;
                    const characterWidth = 120;
                    const craftingWidth = 120;
                    const totalWidth = equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing + backpackWidth + sectionSpacing + 2 + sectionSpacing + craftingWidth;
                    
                    const panelStartX = (canvas.width - totalWidth) / 2;
                    const panelStartY = (canvas.height - backpackHeight) / 2;
                    const backpackStartX = panelStartX + equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing;
                    const backpackStartY = panelStartY;
                    const craftingStartX = backpackStartX + backpackWidth + sectionSpacing + 2 + sectionSpacing + 10;
                    const craftingStartY = backpackStartY + 20;
                    const craftingSlotSize = 45;
                    const craftingSpacing = 5;
                    
                    let isOverCraftingSlot = false;
                    
                    // 检查鼠标是否在合成栏的某个格子上
                    for (let row = 0; row < 2; row++) {
                        for (let col = 0; col < 2; col++) {
                            const index = row * 2 + col;
                            const x = craftingStartX + col * (craftingSlotSize + craftingSpacing);
                            const y = craftingStartY + row * (craftingSlotSize + craftingSpacing);
                            
                            if (screenX >= x && screenX <= x + craftingSlotSize && screenY >= y && screenY <= y + craftingSlotSize) {
                                isOverCraftingSlot = true;
                                
                                // 检查是否是新格子（避免重复填充）
                                if (gameState.lastHoveredCraftingSlot !== index) {
                                    gameState.lastHoveredCraftingSlot = index;
                                    
                                    // 尝试填充一个物品到这个格子
                                    const slot = gameState.inventory.craftingSlots[index];
                                    if (gameState.draggedItem.count > 0) {
                                        if (!slot.item) {
                                            // 空格子，直接放入一个
                                            slot.item = gameState.draggedItem.item;
                                            slot.count = 1;
                                            gameState.draggedItem.count -= 1;
                                        } else if (slot.item === gameState.draggedItem.item) {
                                            // 相同物品，增加数量
                                            slot.count += 1;
                                            gameState.draggedItem.count -= 1;
                                        }
                                        // 不同物品则不填充
                                        
                                        // 如果拖动物品用完了，清除
                                        if (gameState.draggedItem.count === 0) {
                                            gameState.draggedItem = null;
                                            gameState.lastHoveredCraftingSlot = null;
                                        }
                                    }
                                }
                                break;
                            }
                        }
                        if (isOverCraftingSlot) break;
                    }
                    
                    // 如果鼠标不在任何合成栏格子上，重置状态（允许再次扫过同一格子）
                    if (!isOverCraftingSlot) {
                        gameState.lastHoveredCraftingSlot = null;
                    }
                }
            }
            
            // 检查右键长按时光标是否离开了原始格子
            if (gameState.rightClickHold.active && gameState.inventoryOpen) {
                const slotSize = 50;
                const slotSpacing = 5;
                const cols = 10;
                const sectionSpacing = 15;
                const backpackWidth = cols * (slotSize + slotSpacing) - slotSpacing;
                const backpackHeight = 5 * (slotSize + slotSpacing) - slotSpacing + 60;
                const equipmentWidth = slotSize + 20;
                const characterWidth = 120;
                const craftingWidth = 120;
                const totalWidth = equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing + backpackWidth + sectionSpacing + 2 + sectionSpacing + craftingWidth;
                
                const panelStartX = (canvas.width - totalWidth) / 2;
                const panelStartY = (canvas.height - backpackHeight) / 2;
                const equipStartX = panelStartX;
                const equipStartY = panelStartY;
                const backpackStartX = panelStartX + equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing;
                const backpackStartY = panelStartY;
                const craftingStartX = backpackStartX + backpackWidth + sectionSpacing + 2 + sectionSpacing + 10;
                const craftingStartY = backpackStartY + 20;
                const craftingSlotSize = 45;
                const craftingSpacing = 5;
                
                let isInOriginalSlot = false;
                
                // 检查是否还在原始格子内
                if (gameState.rightClickHold.slotType === 'crafting') {
                    const index = gameState.rightClickHold.slotIndex;
                    const row = Math.floor(index / 2);
                    const col = index % 2;
                    const x = craftingStartX + col * (craftingSlotSize + craftingSpacing);
                    const y = craftingStartY + row * (craftingSlotSize + craftingSpacing);
                    isInOriginalSlot = screenX >= x && screenX <= x + craftingSlotSize && 
                                      screenY >= y && screenY <= y + craftingSlotSize;
                } else if (gameState.rightClickHold.slotType === 'equipment') {
                    const equipmentSlotPositions = [
                        { key: 'helmet', x: equipStartX, y: equipStartY + 20 },
                        { key: 'chestplate', x: equipStartX, y: equipStartY + 20 + (slotSize + slotSpacing) },
                        { key: 'leggings', x: equipStartX, y: equipStartY + 20 + 2 * (slotSize + slotSpacing) },
                        { key: 'boots', x: equipStartX, y: equipStartY + 20 + 3 * (slotSize + slotSpacing) }
                    ];
                    const equipSlot = equipmentSlotPositions.find(s => s.key === gameState.rightClickHold.slotIndex);
                    if (equipSlot) {
                        isInOriginalSlot = screenX >= equipSlot.x && screenX <= equipSlot.x + slotSize && 
                                          screenY >= equipSlot.y && screenY <= equipSlot.y + slotSize;
                    }
                } else if (gameState.rightClickHold.slotType === 'backpack') {
                    const index = gameState.rightClickHold.slotIndex;
                    const row = Math.floor(index / cols);
                    const col = index % cols;
                    const x = backpackStartX + col * (slotSize + slotSpacing);
                    const y = backpackStartY + row * (slotSize + slotSpacing);
                    isInOriginalSlot = screenX >= x && screenX <= x + slotSize && 
                                      screenY >= y && screenY <= y + slotSize;
                } else if (gameState.rightClickHold.slotType === 'hotbar') {
                    const separatorY = backpackStartY + 4 * (slotSize + slotSpacing) + 10;
                    const hotbarY = separatorY + 20;
                    const i = gameState.rightClickHold.slotIndex;
                    const x = backpackStartX + i * (slotSize + slotSpacing);
                    const y = hotbarY;
                    isInOriginalSlot = screenX >= x && screenX <= x + slotSize && 
                                      screenY >= y && screenY <= y + slotSize;
                }
                
                // 如果离开了原始格子，停止长按
                if (!isInOriginalSlot) {
                    gameState.rightClickHold.active = false;
                }
            }
        });
        
        // 鼠标按下 - 开始挖掘或处理右键分离物品
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const screenX = e.clientX - rect.left;
            const screenY = e.clientY - rect.top;
            
            // 如果全屏地图打开，处理拖拽
            if (gameState.minimapExpanded) {
                if (e.button === 0) { // 左键开始拖拽
                    gameState.minimapDrag.isDragging = true;
                    gameState.minimapDrag.startMouseX = screenX;
                    gameState.minimapDrag.startMouseY = screenY;
                    // 保存当前偏移量作为起始点
                    gameState.minimapDrag.lastOffsetX = gameState.minimapDrag.offsetX;
                    gameState.minimapDrag.lastOffsetY = gameState.minimapDrag.offsetY;
                } else if (e.button === 2) { // 右键关闭全屏地图
                    gameState.minimapExpanded = false;
                    e.preventDefault();
                }
                return;
            }
            
            // 如果背包打开，处理右键分离物品
            if (gameState.inventoryOpen && e.button === 2) {
                handleInventoryRightClick(screenX, screenY);
                e.preventDefault();
                return;
            }
            
            if (e.button === 0) { // 左键 - 根据物品类型执行不同操作
                // 如果背包打开，处理craft button点击
                if (gameState.inventoryOpen) {
                    gameState.mouse.isDown = true;
                    gameState.mouse.downTime = performance.now(); // 记录按下时间
                    
                    // 检查是否点击了合成按钮
                    const slotSize = 50;
                    const slotSpacing = 5;
                    const cols = 10;
                    const sectionSpacing = 15;
                    const backpackWidth = cols * (slotSize + slotSpacing) - slotSpacing;
                    const backpackHeight = 5 * (slotSize + slotSpacing) - slotSpacing + 60;
                    const equipmentWidth = slotSize + 20;
                    const characterWidth = 120;
                    const craftingWidth = 120;
                    const totalWidth = equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing + backpackWidth + sectionSpacing + 2 + sectionSpacing + craftingWidth;
                    
                    const panelStartX = (canvas.width - totalWidth) / 2;
                    const panelStartY = (canvas.height - backpackHeight) / 2;
                    const backpackStartX = panelStartX + equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing;
                    const craftingStartX = backpackStartX + backpackWidth + sectionSpacing + 2 + sectionSpacing + 10;
                    const craftingStartY = panelStartY + 20;
                    const craftingSlotSize = 45;
                    const craftingSpacing = 5;
                    
                    const arrowY = craftingStartY + 2 * (craftingSlotSize + craftingSpacing) + 20;
                    const arrowX = craftingStartX + craftingSlotSize + craftingSpacing / 2;
                    const arrowSize = 20;
                    const arrowButtonSize = 30;
                    
                    if (screenX >= arrowX - arrowButtonSize / 2 && 
                        screenX <= arrowX + arrowButtonSize / 2 && 
                        screenY >= arrowY - arrowSize - 5 && 
                        screenY <= arrowY + 5) {
                        // 点击了合成按钮
                        const currentTime = performance.now();
                        const success = handleCraftingButtonClick();
                        
                        // 如果合成成功，初始化长按状态
                        if (success) {
                            gameState.craftButtonHold = {
                                active: true,
                                startTime: currentTime,
                                lastCraftTime: currentTime
                            };
                        }
                        return;
                    }
                    
                    return;
                }
                
                updateMouseWorldPosition(screenX, screenY);
                
                const selectedItem = getSelectedItem();
                
                if (!selectedItem) {
                    // 没有选中物品，空手挖掘
                    gameState.mouse.isDown = true;
                    handleContinuousMining();
                } else if (selectedItem.type === 'tool') {
                    // 检查是否是水桶
                    if (selectedItem.special === 'waterBucket') {
                        // 水桶：左键放置水
                        placeWater(gameState.mouse.gridX, gameState.mouse.gridY);
                    } else if (selectedItem.special === 'emptyBucket') {
                        // 空桶：左键点击水方块装水
                        collectWater(gameState.mouse.gridX, gameState.mouse.gridY);
                    } else {
                        // 其他工具：用于挖掘
                        gameState.mouse.isDown = true;
                        handleContinuousMining();
                    }
                } else if (selectedItem.type === 'block') {
                    // 方块：左键放置方块
                    placeBlock(gameState.mouse.gridX, gameState.mouse.gridY);
                } else if (selectedItem.type === 'consumable') {
                    // 消耗品：尝试消耗（如吃苹果）
                    consumeItem();
                } else if (selectedItem.type === 'material') {
                    // 材料：左键无效果（木棍、凝胶等）
                    // 不执行任何操作
                }
            } else if (e.button === 2) { // 右键 - 禁用（所有逻辑已移至左键）
                e.preventDefault(); // 阻止右键菜单
                // 右键不再执行任何操作
            }
        });
        
        // 禁用右键菜单
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
        
        // 鼠标松开 - 处理右键分离物品的吸附
        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 2) { // 右键松开
                // 停止右键长按
                gameState.rightClickHold.active = false;
                
                // 如果背包打开且有分离的物品，将其转换为普通拖动状态
                if (gameState.inventoryOpen && gameState.draggedItem && 
                    gameState.draggedItem.sourceType === 'rightClickSplit') {
                    // 将右键分离的物品转换为普通拖动状态（无源）
                    gameState.draggedItem.sourceType = null;
                    gameState.draggedItem.sourceIndex = null;
                    // 删除 originalType 字段
                    delete gameState.draggedItem.originalType;
                }
            } else if (e.button === 0) { // 左键松开
                // 如果全屏地图打开且正在拖拽，停止拖拽
                if (gameState.minimapExpanded && gameState.minimapDrag.isDragging) {
                    gameState.minimapDrag.isDragging = false;
                    // 保存最终偏移量
                    gameState.minimapDrag.lastOffsetX = gameState.minimapDrag.offsetX;
                    gameState.minimapDrag.lastOffsetY = gameState.minimapDrag.offsetY;
                    return;
                }
                
                gameState.mouse.isDown = false;
                gameState.mining.targetX = -1;
                gameState.mining.targetY = -1;
                
                // 停止合成按钮长按
                gameState.craftButtonHold.active = false;
            }
        });
        
        // 鼠标点击 - 处理背包物品交互和热键栏选择
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 如果全屏地图打开，不做任何处理（拖拽在mousedown/mousemove/mouseup中处理）
            if (gameState.minimapExpanded) {
                return;
            }
            
            // 检查是否点击了小地图（展开为全屏）
            if (gameState.minimapBounds && !gameState.inventoryOpen) {
                const bounds = gameState.minimapBounds;
                if (mouseX >= bounds.x && mouseX <= bounds.x + bounds.width &&
                    mouseY >= bounds.y && mouseY <= bounds.y + bounds.height) {
                    gameState.minimapExpanded = true;
                    // 重置拖拽偏移量（展开时初始显示当前缩略图方位）
                    gameState.minimapDrag.offsetX = 0;
                    gameState.minimapDrag.offsetY = 0;
                    gameState.minimapDrag.lastOffsetX = 0;
                    gameState.minimapDrag.lastOffsetY = 0;
                    return;
                }
            }
            
            // 如果背包打开，处理物品点击交互
            if (gameState.inventoryOpen) {
                // 检查是否是长按（按下时间超过150ms）
                const clickDuration = performance.now() - gameState.mouse.downTime;
                const isLongPress = clickDuration > 150;
                
                // 只有非长按的点击才执行物品交互
                if (!isLongPress) {
                    handleInventoryMouseDown(mouseX, mouseY);
                }
                return;
            }
            
            // 检查是否点击了背包按钮
            if (gameState.backpackButton) {
                const btn = gameState.backpackButton;
                if (mouseX >= btn.x && mouseX <= btn.x + btn.size &&
                    mouseY >= btn.y && mouseY <= btn.y + btn.size) {
                    // 切换背包界面
                    gameState.inventoryOpen = !gameState.inventoryOpen;
                    // 关闭背包时重置状态并返回合成栏物品
                    if (!gameState.inventoryOpen) {
                        gameState.lastHoveredCraftingSlot = null;
                        returnCraftingSlotsToInventory();
                    }
                    return;
                }
            }
            
            // 计算热键栏位置
            const slotSize = 50;
            const slotSpacing = 5;
            const totalWidth = gameState.inventory.slots.length * (slotSize + slotSpacing) - slotSpacing;
            const startX = (canvas.width - totalWidth) / 2;
            const startY = canvas.height - slotSize - 20;
            
            // 检查是否点击了热键栏
            for (let i = 0; i < gameState.inventory.slots.length; i++) {
                const x = startX + i * (slotSize + slotSpacing);
                const y = startY;
                
                if (mouseX >= x && mouseX <= x + slotSize && mouseY >= y && mouseY <= y + slotSize) {
                    gameState.inventory.selectedSlot = i;
                    break;
                }
            }
        });
        
        // 鼠标离开画布 - 停止挖掘
        canvas.addEventListener('mouseleave', () => {
            gameState.mouse.isDown = false;
            gameState.mining.targetX = -1;
            gameState.mining.targetY = -1;
        });
    </script>
</body>
