<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秦安端巫</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            /* 强制启用硬件加速 */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform;
            /* 优化渲染性能 */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            perspective: 1000;
            -webkit-perspective: 1000;
        }
        
        /* 加载界面样式 */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 50%, #7CB342 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: 'Arial', sans-serif;
        }
        
        #loadingScreen.hidden {
            display: none;
        }
        
        .loading-title {
            font-size: 48px;
            color: #fff;
            text-shadow: 4px 4px 0px #333;
            margin-bottom: 40px;
            font-weight: bold;
        }
        
        .loading-container {
            width: 600px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .loading-text {
            color: #fff;
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 2px 2px 0px #333;
        }
        
        .progress-bar-container {
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #fff;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.8);
        }
        
        .progress-percentage {
            color: #fff;
            font-size: 24px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            text-shadow: 2px 2px 0px #333;
        }
    </style>
</head>
<body>
    <!-- 加载界面 -->
    <div id="loadingScreen">
        <div class="loading-title">秦安端巫</div>
        <div class="loading-container">
            <div class="loading-text" id="loadingText">正在生成世界...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-percentage" id="progressPercentage">0%</div>
        </div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <script>
        // 全局变量
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', {
            alpha: false, // 不需要透明度，提升性能
            desynchronized: true, // 降低延迟，提升流畅度
            willReadFrequently: false // 不频繁读取像素，优化写入性能
        });
        
        // 禁用图像平滑，确保像素完美渲染
        ctx.imageSmoothingEnabled = false;
        ctx.webkitImageSmoothingEnabled = false;
        ctx.mozImageSmoothingEnabled = false;
        ctx.msImageSmoothingEnabled = false;
        
        const textures = {};
        const itemIcons = {}; // 物品图标
        let playerSprite = null;
        
        // 设置全屏 Canvas
        function resizeCanvas() {
            // 直接使用window的内部尺寸
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // 设置canvas的实际分辨率
            canvas.width = width;
            canvas.height = height;
            
            // 同时设置canvas的CSS尺寸，确保完全匹配
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }
        
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas);
        resizeCanvas();
        
        // 生成纹理函数
        function generateTextures() {
            const textureSize = 16;
            
            // 辅助函数：创建临时 Canvas
            function createTextureCanvas() {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = textureSize;
                tempCanvas.height = textureSize;
                return tempCanvas;
            }
            
            // 生成碎裂纹理（10个等级，参考Minecraft风格）
            function generateCrackTextures() {
                const cracks = [];
                for (let level = 0; level < 10; level++) {
                    const crackCanvas = createTextureCanvas();
                    const crackCtx = crackCanvas.getContext('2d');
                    
                    // 透明背景
                    crackCtx.clearRect(0, 0, textureSize, textureSize);
                    
                    // 纯黑色裂纹，透明度随等级增加
                    const alpha = 0.2 + (level / 10) * 0.4; // 0.2 到 0.6
                    crackCtx.fillStyle = `rgba(0, 0, 0, ${alpha})`;
                    crackCtx.strokeStyle = `rgba(0, 0, 0, ${alpha})`;
                    crackCtx.lineWidth = 1;
                    crackCtx.lineCap = 'square';
                    crackCtx.lineJoin = 'miter';
                    
                    // 生成主裂纹网络（从中心向外辐射）
                    const centerX = textureSize / 2;
                    const centerY = textureSize / 2;
                    const numMainCracks = 3 + Math.floor(level / 2); // 3到8条主裂纹
                    
                    for (let i = 0; i < numMainCracks; i++) {
                        crackCtx.beginPath();
                        
                        // 从中心或边缘开始
                        const startFromCenter = Math.random() > 0.3;
                        let startX, startY;
                        
                        if (startFromCenter) {
                            // 从中心附近开始
                            startX = centerX + (Math.random() - 0.5) * 4;
                            startY = centerY + (Math.random() - 0.5) * 4;
                        } else {
                            // 从边缘开始
                            const edge = Math.floor(Math.random() * 4);
                            switch(edge) {
                                case 0: startX = 0; startY = Math.random() * textureSize; break;
                                case 1: startX = textureSize; startY = Math.random() * textureSize; break;
                                case 2: startX = Math.random() * textureSize; startY = 0; break;
                                case 3: startX = Math.random() * textureSize; startY = textureSize; break;
                            }
                        }
                        
                        crackCtx.moveTo(startX, startY);
                        
                        // 向目标方向延伸
                        const targetAngle = Math.random() * Math.PI * 2;
                        let currentX = startX;
                        let currentY = startY;
                        
                        const segments = 4 + Math.floor(level / 2); // 4到9段
                        for (let j = 0; j < segments; j++) {
                            // 添加随机偏移，但保持大致方向
                            const angle = targetAngle + (Math.random() - 0.5) * Math.PI / 3;
                            const length = 2 + Math.random() * 3;
                            
                            currentX += Math.cos(angle) * length;
                            currentY += Math.sin(angle) * length;
                            
                            // 限制在纹理范围内
                            currentX = Math.max(0, Math.min(textureSize, currentX));
                            currentY = Math.max(0, Math.min(textureSize, currentY));
                            
                            crackCtx.lineTo(currentX, currentY);
                        }
                        
                        crackCtx.stroke();
                    }
                    
                    // 添加次级裂纹（分支）
                    const numBranches = Math.floor(level / 2); // 0到5条分支
                    for (let i = 0; i < numBranches; i++) {
                        crackCtx.beginPath();
                        
                        // 随机位置开始
                        const startX = Math.random() * textureSize;
                        const startY = Math.random() * textureSize;
                        crackCtx.moveTo(startX, startY);
                        
                        // 短分支
                        const angle = Math.random() * Math.PI * 2;
                        const length = 3 + Math.random() * 4;
                        const endX = Math.max(0, Math.min(textureSize, startX + Math.cos(angle) * length));
                        const endY = Math.max(0, Math.min(textureSize, startY + Math.sin(angle) * length));
                        
                        crackCtx.lineTo(endX, endY);
                        crackCtx.stroke();
                    }
                    
                    // 添加碎片效果（高等级）
                    if (level >= 5) {
                        const numFragments = (level - 4) * 3; // 3到18个碎片
                        for (let i = 0; i < numFragments; i++) {
                            const x = Math.random() * textureSize;
                            const y = Math.random() * textureSize;
                            const size = 1 + Math.random() * 2;
                            
                            // 绘制小碎片（不规则形状）
                            crackCtx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(size), 1);
                            if (Math.random() > 0.5) {
                                crackCtx.fillRect(Math.floor(x), Math.floor(y) + 1, 1, 1);
                            }
                        }
                    }
                    
                    // 添加边缘强化（让裂纹更明显）
                    if (level >= 7) {
                        // 在方块边缘添加破损效果
                        const edgeDamage = (level - 6) * 2; // 2到8个边缘破损点
                        for (let i = 0; i < edgeDamage; i++) {
                            const edge = Math.floor(Math.random() * 4);
                            let x, y;
                            
                            switch(edge) {
                                case 0: x = Math.random() * textureSize; y = 0; break; // 上
                                case 1: x = Math.random() * textureSize; y = textureSize - 1; break; // 下
                                case 2: x = 0; y = Math.random() * textureSize; break; // 左
                                case 3: x = textureSize - 1; y = Math.random() * textureSize; break; // 右
                            }
                            
                            crackCtx.fillRect(Math.floor(x), Math.floor(y), 2, 2);
                        }
                    }
                    
                    cracks.push(crackCanvas);
                }
                return cracks;
            }
            
            // 生成碎裂纹理
            textures.cracks = generateCrackTextures();
            
            
            // 1. 带草皮的泥土（顶部绿色，主体棕色 - 与纯泥土颜色一致）
            const grassDirtCanvas = createTextureCanvas();
            const grassDirtCtx = grassDirtCanvas.getContext('2d');
            
            // 绘制棕色泥土主体（使用与纯泥土相同的颜色）
            grassDirtCtx.fillStyle = '#654321'; // 改为与纯泥土相同的深棕色
            grassDirtCtx.fillRect(0, 3, textureSize, textureSize - 3);
            
            // 添加泥土噪点（与纯泥土相同的噪点）
            for (let i = 0; i < 50; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * (textureSize - 3)) + 3;
                const brightness = Math.floor(Math.random() * 40) - 20;
                grassDirtCtx.fillStyle = `rgb(${101 + brightness}, ${67 + brightness}, ${33 + brightness})`;
                const size = Math.random() > 0.7 ? 2 : 1;
                grassDirtCtx.fillRect(x, y, size, size);
            }
            
            // 绘制草皮层（顶部3像素）
            grassDirtCtx.fillStyle = '#228B22';
            grassDirtCtx.fillRect(0, 0, textureSize, 3);
            
            // 添加草皮细节
            for (let i = 0; i < 20; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * 3);
                const brightness = Math.random() > 0.5 ? 30 : -30;
                grassDirtCtx.fillStyle = `rgb(${34 + brightness}, ${139 + brightness}, ${34 + brightness})`;
                grassDirtCtx.fillRect(x, y, 1, 1);
            }
            
            textures.grassDirt = grassDirtCanvas;
            
            // 2. 纯泥土（深棕色带噪点）
            const dirtCanvas = createTextureCanvas();
            const dirtCtx = dirtCanvas.getContext('2d');
            
            // 基础深棕色
            dirtCtx.fillStyle = '#654321';
            dirtCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加噪点纹理
            for (let i = 0; i < 50; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 40) - 20;
                dirtCtx.fillStyle = `rgb(${101 + brightness}, ${67 + brightness}, ${33 + brightness})`;
                const size = Math.random() > 0.7 ? 2 : 1;
                dirtCtx.fillRect(x, y, size, size);
            }
            
            textures.dirt = dirtCanvas;
            
            // 3. 石头（灰色带裂纹）
            const stoneCanvas = createTextureCanvas();
            const stoneCtx = stoneCanvas.getContext('2d');
            
            // 基础灰色
            stoneCtx.fillStyle = '#808080';
            stoneCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加灰色噪点
            for (let i = 0; i < 40; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 60) - 30;
                stoneCtx.fillStyle = `rgb(${128 + brightness}, ${128 + brightness}, ${128 + brightness})`;
                stoneCtx.fillRect(x, y, 1, 1);
            }
            
            // 绘制裂纹图案
            stoneCtx.strokeStyle = '#505050';
            stoneCtx.lineWidth = 1;
            
            // 对角线裂纹
            stoneCtx.beginPath();
            stoneCtx.moveTo(2, 2);
            stoneCtx.lineTo(6, 5);
            stoneCtx.lineTo(10, 4);
            stoneCtx.stroke();
            
            stoneCtx.beginPath();
            stoneCtx.moveTo(8, 10);
            stoneCtx.lineTo(12, 12);
            stoneCtx.lineTo(14, 14);
            stoneCtx.stroke();
            
            // 水平裂纹
            stoneCtx.beginPath();
            stoneCtx.moveTo(1, 8);
            stoneCtx.lineTo(7, 9);
            stoneCtx.stroke();
            
            textures.stone = stoneCanvas;
            
            // 3.5. 基岩（深黑色，带微弱裂纹）
            const bedrockCanvas = createTextureCanvas();
            const bedrockCtx = bedrockCanvas.getContext('2d');
            
            // 基础深黑色
            bedrockCtx.fillStyle = '#1a1a1a';
            bedrockCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加深色噪点（非常暗）
            for (let i = 0; i < 50; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 20) - 10; // 更小的亮度变化
                bedrockCtx.fillStyle = `rgb(${26 + brightness}, ${26 + brightness}, ${26 + brightness})`;
                bedrockCtx.fillRect(x, y, 1, 1);
            }
            
            // 绘制微弱的裂纹（深灰色）
            bedrockCtx.strokeStyle = '#2a2a2a';
            bedrockCtx.lineWidth = 1;
            
            // 不规则裂纹
            bedrockCtx.beginPath();
            bedrockCtx.moveTo(1, 3);
            bedrockCtx.lineTo(5, 6);
            bedrockCtx.lineTo(8, 5);
            bedrockCtx.stroke();
            
            bedrockCtx.beginPath();
            bedrockCtx.moveTo(10, 8);
            bedrockCtx.lineTo(13, 11);
            bedrockCtx.lineTo(15, 13);
            bedrockCtx.stroke();
            
            bedrockCtx.beginPath();
            bedrockCtx.moveTo(2, 12);
            bedrockCtx.lineTo(6, 14);
            bedrockCtx.stroke();
            
            textures.bedrock = bedrockCanvas;
            
            // 4. 铜矿石（带橙色斑点的石头）
            const copperOreCanvas = createTextureCanvas();
            const copperOreCtx = copperOreCanvas.getContext('2d');
            
            // 基础灰色（与石头相同）
            copperOreCtx.fillStyle = '#808080';
            copperOreCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加灰色噪点
            for (let i = 0; i < 40; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 60) - 30;
                copperOreCtx.fillStyle = `rgb(${128 + brightness}, ${128 + brightness}, ${128 + brightness})`;
                copperOreCtx.fillRect(x, y, 1, 1);
            }
            
            // 添加橙色矿石斑点（较大）
            for (let i = 0; i < 8; i++) {
                const x = Math.floor(Math.random() * (textureSize - 2));
                const y = Math.floor(Math.random() * (textureSize - 2));
                const size = Math.random() > 0.5 ? 2 : 3;
                
                // 橙色（铜的颜色）
                copperOreCtx.fillStyle = '#FF8C00';
                copperOreCtx.fillRect(x, y, size, size);
                
                // 添加高光
                copperOreCtx.fillStyle = '#FFA500';
                copperOreCtx.fillRect(x, y, 1, 1);
            }
            
            textures.copperOre = copperOreCanvas;
            
            // 5. 铁矿石（带银色斑点的石头）
            const ironOreCanvas = createTextureCanvas();
            const ironOreCtx = ironOreCanvas.getContext('2d');
            
            // 基础灰色（与石头相同）
            ironOreCtx.fillStyle = '#808080';
            ironOreCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加灰色噪点
            for (let i = 0; i < 40; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 60) - 30;
                ironOreCtx.fillStyle = `rgb(${128 + brightness}, ${128 + brightness}, ${128 + brightness})`;
                ironOreCtx.fillRect(x, y, 1, 1);
            }
            
            // 添加银色矿石斑点（较小但更亮）
            for (let i = 0; i < 10; i++) {
                const x = Math.floor(Math.random() * (textureSize - 2));
                const y = Math.floor(Math.random() * (textureSize - 2));
                const size = Math.random() > 0.6 ? 2 : 1;
                
                // 银色（铁的颜色）
                ironOreCtx.fillStyle = '#C0C0C0';
                ironOreCtx.fillRect(x, y, size, size);
                
                // 添加高光
                ironOreCtx.fillStyle = '#E8E8E8';
                ironOreCtx.fillRect(x, y, 1, 1);
            }
            
            textures.ironOre = ironOreCanvas;
            
            // 5.5. 银矿石（带大块亮银色斑点的石头，深灰色基底）
            const silverOreCanvas = createTextureCanvas();
            const silverOreCtx = silverOreCanvas.getContext('2d');
            
            // 基础灰色（与石头相同）
            silverOreCtx.fillStyle = '#808080';
            silverOreCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加灰色噪点
            for (let i = 0; i < 40; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 60) - 30;
                silverOreCtx.fillStyle = `rgb(${128 + brightness}, ${128 + brightness}, ${128 + brightness})`;
                silverOreCtx.fillRect(x, y, 1, 1);
            }
            
            // 添加纯白色矿石斑点（与铁矿大小相同，但颜色更亮）
            for (let i = 0; i < 10; i++) {
                const x = Math.floor(Math.random() * (textureSize - 2));
                const y = Math.floor(Math.random() * (textureSize - 2));
                const size = Math.random() > 0.6 ? 2 : 1;
                
                // 纯白色（与铁矿的银色区分）
                silverOreCtx.fillStyle = '#FFFFFF';
                silverOreCtx.fillRect(x, y, size, size);
                
                // 添加亮白色高光
                silverOreCtx.fillStyle = '#FFFFFF';
                silverOreCtx.fillRect(x, y, 1, 1);
            }
            
            textures.silverOre = silverOreCanvas;
            
            // 5.6. 金矿石（带金色斑点的石头）
            const goldOreCanvas = createTextureCanvas();
            const goldOreCtx = goldOreCanvas.getContext('2d');
            
            // 基础灰色
            goldOreCtx.fillStyle = '#808080';
            goldOreCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加灰色噪点
            for (let i = 0; i < 40; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 60) - 30;
                goldOreCtx.fillStyle = `rgb(${128 + brightness}, ${128 + brightness}, ${128 + brightness})`;
                goldOreCtx.fillRect(x, y, 1, 1);
            }
            
            // 添加金色矿石斑点
            for (let i = 0; i < 10; i++) {
                const x = Math.floor(Math.random() * (textureSize - 2));
                const y = Math.floor(Math.random() * (textureSize - 2));
                const size = Math.random() > 0.6 ? 2 : 1;
                
                // 金色
                goldOreCtx.fillStyle = '#FFD700';
                goldOreCtx.fillRect(x, y, size, size);
                
                // 添加高光
                goldOreCtx.fillStyle = '#FFED4E';
                goldOreCtx.fillRect(x, y, 1, 1);
            }
            
            textures.goldOre = goldOreCanvas;
            
            // 5.7. 钻石矿石（带青色钻石的石头）
            const diamondOreCanvas = createTextureCanvas();
            const diamondOreCtx = diamondOreCanvas.getContext('2d');
            
            // 基础灰色
            diamondOreCtx.fillStyle = '#808080';
            diamondOreCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加灰色噪点
            for (let i = 0; i < 40; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 60) - 30;
                diamondOreCtx.fillStyle = `rgb(${128 + brightness}, ${128 + brightness}, ${128 + brightness})`;
                diamondOreCtx.fillRect(x, y, 1, 1);
            }
            
            // 添加青色钻石斑点（较少但更显眼）
            for (let i = 0; i < 8; i++) {
                const x = Math.floor(Math.random() * (textureSize - 2));
                const y = Math.floor(Math.random() * (textureSize - 2));
                const size = Math.random() > 0.7 ? 2 : 1;
                
                // 青色（钻石色）
                diamondOreCtx.fillStyle = '#00FFFF';
                diamondOreCtx.fillRect(x, y, size, size);
                
                // 添加高光
                diamondOreCtx.fillStyle = '#FFFFFF';
                diamondOreCtx.fillRect(x, y, 1, 1);
            }
            
            textures.diamondOre = diamondOreCanvas;
            
            // 6. 树干（棕色木质纹理）
            const trunkCanvas = createTextureCanvas();
            const trunkCtx = trunkCanvas.getContext('2d');
            
            // 基础棕色（木头颜色）
            trunkCtx.fillStyle = '#8B4513';
            trunkCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 绘制垂直的木纹
            for (let x = 0; x < textureSize; x += 2) {
                const brightness = Math.floor(Math.random() * 20) - 10;
                trunkCtx.fillStyle = `rgb(${139 + brightness}, ${69 + brightness}, ${19 + brightness})`;
                trunkCtx.fillRect(x, 0, 1, textureSize);
            }
            
            // 添加木纹细节（横向裂纹）
            for (let i = 0; i < 3; i++) {
                const y = Math.floor(Math.random() * textureSize);
                trunkCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                trunkCtx.fillRect(0, y, textureSize, 1);
            }
            
            // 添加高光
            for (let i = 0; i < 15; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                trunkCtx.fillStyle = 'rgba(160, 100, 40, 0.3)';
                trunkCtx.fillRect(x, y, 1, 1);
            }
            
            textures.trunk = trunkCanvas;
            
            // 6.5. 原木（竖状木纹纹理，原木侧面）
            const logCanvas = createTextureCanvas();
            const logCtx = logCanvas.getContext('2d');
            
            // 基础中等棕色（比之前稍浅）
            logCtx.fillStyle = '#8B6239';
            logCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 绘制竖向木纹（主要纹理）
            for (let x = 0; x < textureSize; x += 2) {
                const offset = Math.floor(Math.random() * 3) - 1;
                const darkness = Math.random() * 0.3;
                logCtx.strokeStyle = `rgba(60, 40, 20, ${darkness})`;
                logCtx.lineWidth = 1 + Math.floor(Math.random() * 2);
                logCtx.beginPath();
                logCtx.moveTo(x + offset, 0);
                // 添加轻微波浪，模拟木纹不规则
                for (let y = 0; y < textureSize; y += 4) {
                    const waveOffset = Math.sin(y * 0.3) * 0.5 + (Math.random() - 0.5) * 0.5;
                    logCtx.lineTo(x + offset + waveOffset, y);
                }
                logCtx.lineTo(x + offset, textureSize);
                logCtx.stroke();
            }
            
            // 添加更粗的竖向木纹条纹
            for (let i = 0; i < 3; i++) {
                const x = Math.floor(Math.random() * textureSize);
                logCtx.strokeStyle = `rgba(101, 67, 33, ${0.4 + Math.random() * 0.2})`;
                logCtx.lineWidth = 2;
                logCtx.beginPath();
                logCtx.moveTo(x, 0);
                for (let y = 0; y < textureSize; y += 3) {
                    const waveOffset = Math.sin(y * 0.4) * 1 + (Math.random() - 0.5);
                    logCtx.lineTo(x + waveOffset, y);
                }
                logCtx.stroke();
            }
            
            // 添加竖向的浅色木纹高光
            for (let i = 0; i < 4; i++) {
                const x = Math.floor(Math.random() * textureSize);
                logCtx.strokeStyle = `rgba(160, 120, 80, ${0.2 + Math.random() * 0.15})`;
                logCtx.lineWidth = 1;
                logCtx.beginPath();
                logCtx.moveTo(x, 0);
                for (let y = 0; y < textureSize; y += 4) {
                    const waveOffset = Math.sin(y * 0.35) * 0.8;
                    logCtx.lineTo(x + waveOffset, y);
                }
                logCtx.stroke();
            }
            
            // 添加横向的木节和裂纹（少量，不破坏竖向纹理）
            for (let i = 0; i < 2; i++) {
                const y = Math.floor(Math.random() * textureSize);
                const x = Math.floor(Math.random() * (textureSize - 6));
                const width = 4 + Math.floor(Math.random() * 4);
                logCtx.fillStyle = 'rgba(60, 40, 20, 0.3)';
                logCtx.fillRect(x, y, width, 1);
                // 木节周围的深色区域
                logCtx.fillStyle = 'rgba(60, 40, 20, 0.15)';
                logCtx.fillRect(x - 1, y - 1, width + 2, 3);
            }
            
            // 添加细微的竖向纹理变化
            for (let x = 0; x < textureSize; x++) {
                for (let y = 0; y < textureSize; y += 2) {
                    if (Math.random() > 0.7) {
                        const brightness = Math.floor(Math.random() * 20) - 10;
                        logCtx.fillStyle = `rgba(${139 + brightness}, ${98 + brightness}, ${57 + brightness}, 0.15)`;
                        logCtx.fillRect(x, y, 1, 2);
                    }
                }
            }
            
            // 添加边缘阴影（增加立体感）
            logCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            logCtx.fillRect(0, 0, textureSize, 1); // 顶部
            logCtx.fillRect(0, 0, 1, textureSize); // 左侧
            logCtx.fillRect(textureSize - 1, 0, 1, textureSize); // 右侧
            logCtx.fillRect(0, textureSize - 1, textureSize, 1); // 底部
            
            textures.log = logCanvas;
            
            // 7. 树叶（绿色带细节）
            const leavesCanvas = createTextureCanvas();
            const leavesCtx = leavesCanvas.getContext('2d');
            
            // 基础绿色
            leavesCtx.fillStyle = '#228B22';
            leavesCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加深浅不一的绿色噪点
            for (let i = 0; i < 80; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 60) - 30;
                leavesCtx.fillStyle = `rgb(${34 + brightness}, ${139 + brightness}, ${34 + brightness})`;
                const size = Math.random() > 0.7 ? 2 : 1;
                leavesCtx.fillRect(x, y, size, size);
            }
            
            // 添加一些更深的绿色斑块
            for (let i = 0; i < 10; i++) {
                const x = Math.floor(Math.random() * (textureSize - 2));
                const y = Math.floor(Math.random() * (textureSize - 2));
                leavesCtx.fillStyle = 'rgba(0, 100, 0, 0.3)';
                leavesCtx.fillRect(x, y, 2, 2);
            }
            
            // 添加亮绿色高光
            for (let i = 0; i < 12; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                leavesCtx.fillStyle = 'rgba(144, 238, 144, 0.4)';
                leavesCtx.fillRect(x, y, 1, 1);
            }
            
            textures.leaves = leavesCanvas;
            
            // 8. 洞穴背景墙（棕色带纹理）
            const caveWallCanvas = createTextureCanvas();
            const caveWallCtx = caveWallCanvas.getContext('2d');
            
            // 基础棕色（类似泥土的深棕色）
            caveWallCtx.fillStyle = '#5C4033';
            caveWallCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加棕色噪点（增加纹理变化）
            for (let i = 0; i < 70; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                const brightness = Math.floor(Math.random() * 40) - 20;
                caveWallCtx.fillStyle = `rgb(${92 + brightness}, ${64 + brightness}, ${51 + brightness})`;
                caveWallCtx.fillRect(x, y, 1, 1);
            }
            
            // 添加更暗的棕色斑块（模拟岩石纹理）
            for (let i = 0; i < 12; i++) {
                const x = Math.floor(Math.random() * (textureSize - 3));
                const y = Math.floor(Math.random() * (textureSize - 3));
                const size = Math.floor(Math.random() * 2) + 2;
                caveWallCtx.fillStyle = 'rgba(40, 30, 20, 0.4)';
                caveWallCtx.fillRect(x, y, size, size);
            }
            
            // 添加一些浅色高光（模拟岩石反光）
            for (let i = 0; i < 8; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                caveWallCtx.fillStyle = 'rgba(120, 90, 70, 0.3)';
                caveWallCtx.fillRect(x, y, 1, 1);
            }
            
            textures.caveWall = caveWallCanvas;
            
            // 9. 墓碑（十字架型，无外框，完全透明背景）
            const tombstoneCanvas = createTextureCanvas();
            const tombstoneCtx = tombstoneCanvas.getContext('2d');
            
            // 确保画布完全透明（使用 getImageData 手动清除）
            const tombstoneImageData = tombstoneCtx.createImageData(textureSize, textureSize);
            // 所有像素默认为透明（alpha = 0）
            tombstoneCtx.putImageData(tombstoneImageData, 0, 0);
            
            // === 绘制十字架主体（石质，深灰色） ===
            tombstoneCtx.fillStyle = '#555555';
            
            // 竖杆（中间，从顶部到底部）
            tombstoneCtx.fillRect(6, 0, 4, 16);
            
            // 横杆（上部）
            tombstoneCtx.fillRect(2, 4, 12, 4);
            
            // === 添加简单的立体感 ===
            // 高光（左侧）
            tombstoneCtx.fillStyle = '#6A6A6A';
            tombstoneCtx.fillRect(6, 0, 1, 16);
            tombstoneCtx.fillRect(2, 4, 1, 4);
            
            // 阴影（右侧）
            tombstoneCtx.fillStyle = '#3A3A3A';
            tombstoneCtx.fillRect(9, 0, 1, 16);
            tombstoneCtx.fillRect(13, 4, 1, 4);
            
            textures.tombstone = tombstoneCanvas;
            
            // 9.5. 火把（发光的木棍）
            const torchCanvas = createTextureCanvas();
            const torchCtx = torchCanvas.getContext('2d');
            
            // 背景透明
            torchCtx.clearRect(0, 0, textureSize, textureSize);
            
            // 绘制木棍（底部）
            torchCtx.fillStyle = '#8B6239';
            torchCtx.fillRect(7, 8, 2, 8); // 竖直的木棍
            
            // 添加木棍阴影
            torchCtx.fillStyle = '#6B4A29';
            torchCtx.fillRect(8, 8, 1, 8); // 右侧阴影
            
            // 绘制火焰（顶部）
            // 火焰底部（橙色）
            torchCtx.fillStyle = '#FF8C00';
            torchCtx.fillRect(6, 5, 4, 3);
            
            // 火焰中部（橙黄色）
            torchCtx.fillStyle = '#FFA500';
            torchCtx.fillRect(6, 3, 4, 2);
            
            // 火焰顶部（黄色）
            torchCtx.fillStyle = '#FFD700';
            torchCtx.fillRect(7, 2, 2, 1);
            
            // 火焰核心（亮黄色）
            torchCtx.fillStyle = '#FFFF00';
            torchCtx.fillRect(7, 4, 2, 2);
            
            // 添加火焰高光
            torchCtx.fillStyle = '#FFFFFF';
            torchCtx.fillRect(7, 3, 1, 1);
            
            textures.torch = torchCanvas;
            
            // 9.6. 木材（横向木板纹理）
            const planksCanvas = createTextureCanvas();
            const planksCtx = planksCanvas.getContext('2d');
            
            // 木材基础色（浅棕黄色 - Burlywood）
            planksCtx.fillStyle = '#DEB887';
            planksCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 绘制横向木板纹理（3块木板）
            // 木板1（顶部）
            planksCtx.fillStyle = '#D4A574';
            planksCtx.fillRect(0, 0, textureSize, 5);
            planksCtx.fillStyle = '#E8C89A';
            planksCtx.fillRect(0, 0, textureSize, 1); // 顶部高光
            
            // 木板2（中部）
            planksCtx.fillStyle = '#D4A574';
            planksCtx.fillRect(0, 5, textureSize, 5);
            planksCtx.fillStyle = '#E8C89A';
            planksCtx.fillRect(0, 5, textureSize, 1); // 高光
            
            // 木板3（底部）
            planksCtx.fillStyle = '#D4A574';
            planksCtx.fillRect(0, 11, textureSize, 5);
            planksCtx.fillStyle = '#E8C89A';
            planksCtx.fillRect(0, 11, textureSize, 1); // 高光
            
            // 木纹细节（深色线条）
            planksCtx.fillStyle = '#B8956A';
            // 木板1的木纹
            planksCtx.fillRect(2, 1, 1, 3);
            planksCtx.fillRect(7, 1, 1, 3);
            planksCtx.fillRect(12, 2, 1, 2);
            // 木板2的木纹
            planksCtx.fillRect(4, 6, 1, 3);
            planksCtx.fillRect(9, 6, 1, 3);
            planksCtx.fillRect(14, 7, 1, 2);
            // 木板3的木纹
            planksCtx.fillRect(1, 12, 1, 3);
            planksCtx.fillRect(6, 12, 1, 3);
            planksCtx.fillRect(11, 13, 1, 2);
            
            // 木板边缘阴影
            planksCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            planksCtx.fillRect(0, 4, textureSize, 1);
            planksCtx.fillRect(0, 10, textureSize, 1);
            planksCtx.fillRect(0, 15, textureSize, 1);
            
            textures.planks = planksCanvas;
            
            // 9.5 水方块（半透明蓝色，带波纹效果）
            const waterCanvas = createTextureCanvas();
            const waterCtx = waterCanvas.getContext('2d');
            
            // 基础蓝色（调深：从 74,144,226 改为 50,110,180，透明度从0.7改为0.8）
            waterCtx.fillStyle = 'rgba(50, 110, 180, 0.8)';
            waterCtx.fillRect(0, 0, textureSize, textureSize);
            
            // 添加波纹效果（浅蓝色，也调深一些）
            for (let i = 0; i < 15; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                waterCtx.fillStyle = 'rgba(100, 160, 200, 0.5)';
                waterCtx.fillRect(x, y, 2, 1);
            }
            
            // 添加高光（稍微减少透明度，让高光不那么明显）
            for (let i = 0; i < 8; i++) {
                const x = Math.floor(Math.random() * textureSize);
                const y = Math.floor(Math.random() * textureSize);
                waterCtx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                waterCtx.fillRect(x, y, 1, 1);
            }
            
            textures.water = waterCanvas;
            
            // 10. 草原-树林背景（像素风格，顶部透明以显示动态天空）
            const backgroundCanvas = document.createElement('canvas');
            backgroundCanvas.width = 2500;
            backgroundCanvas.height = 1400;
            const bgCtx = backgroundCanvas.getContext('2d');
            
            // 不绘制背景色，保持透明，让动态天空可见
            // bgCtx不填充任何背景，默认透明
            
            // 草地区域（从200px开始，使用渐变但不透明）
            const grassStartY = 200;
            const grassGradient = bgCtx.createLinearGradient(0, grassStartY, 0, 1400);
            grassGradient.addColorStop(0, '#7BAA5A'); // 浅绿色（顶部）
            grassGradient.addColorStop(0.3, '#6B9B4A'); // 中浅绿色
            grassGradient.addColorStop(0.6, '#5C8A3D'); // 中绿色
            grassGradient.addColorStop(1, '#4D7A2E'); // 深绿色（底部）
            bgCtx.fillStyle = grassGradient;
            bgCtx.fillRect(0, grassStartY, 2500, 1200);
            
            // 远处的山丘轮廓（半透明深绿色，位于顶部，与草地连接）
            bgCtx.fillStyle = 'rgba(45, 80, 22, 0.3)';
            bgCtx.beginPath();
            bgCtx.moveTo(0, 100);
            for (let x = 0; x < 2500; x += 100) {
                const hillHeight = 80 + Math.sin(x * 0.008) * 30 + Math.random() * 25;
                bgCtx.lineTo(x, hillHeight);
            }
            bgCtx.lineTo(2500, 100);
            bgCtx.lineTo(2500, grassStartY); // 连接到草地顶部
            bgCtx.lineTo(0, grassStartY);
            bgCtx.closePath();
            bgCtx.fill();
            
            // 第二层山丘（更近，更不透明，与草地连接）
            bgCtx.fillStyle = 'rgba(61, 107, 31, 0.5)';
            bgCtx.beginPath();
            bgCtx.moveTo(0, 150);
            for (let x = 0; x < 2500; x += 80) {
                const hillHeight = 130 + Math.sin(x * 0.012) * 30 + Math.random() * 20;
                bgCtx.lineTo(x, hillHeight);
            }
            bgCtx.lineTo(2500, 150);
            bgCtx.lineTo(2500, grassStartY); // 连接到草地顶部
            bgCtx.lineTo(0, grassStartY);
            bgCtx.closePath();
            bgCtx.fill();
            
            // 草地细节（只在草地区域）
            for (let i = 0; i < 1500; i++) {
                const x = Math.random() * 2500;
                const y = grassStartY + Math.random() * 1200;
                const brightness = Math.random() * 40 - 20;
                bgCtx.fillStyle = `rgb(${92 + brightness}, ${138 + brightness}, ${61 + brightness})`;
                bgCtx.fillRect(Math.floor(x), Math.floor(y), 2, 3);
            }
            
            // 草丛（小草簇，只在草地区域）
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * 2500;
                const y = grassStartY + 50 + Math.random() * 1150;
                const grassHeight = 5 + Math.random() * 8;
                
                bgCtx.strokeStyle = `rgba(76, 122, 46, ${0.5 + Math.random() * 0.5})`;
                bgCtx.lineWidth = 1;
                
                // 绘制3-5根草叶
                const blades = 3 + Math.floor(Math.random() * 3);
                for (let b = 0; b < blades; b++) {
                    const offsetX = (b - blades / 2) * 2;
                    bgCtx.beginPath();
                    bgCtx.moveTo(x + offsetX, y);
                    bgCtx.lineTo(x + offsetX + (Math.random() - 0.5) * 3, y - grassHeight);
                    bgCtx.stroke();
                }
            }
            
            // 稀疏的树木（背景树，分布在草地区域）
            const treeCount = 50;
            for (let i = 0; i < treeCount; i++) {
                const treeX = (i * 50) + Math.random() * 40;
                const treeY = grassStartY + 100 + Math.random() * 900;
                const treeHeight = 60 + Math.random() * 100;
                const treeWidth = 8 + Math.random() * 6;
                
                // 树干（棕色）
                const trunkGradient = bgCtx.createLinearGradient(treeX, 0, treeX + treeWidth, 0);
                trunkGradient.addColorStop(0, '#5A3820');
                trunkGradient.addColorStop(0.5, '#6B4423');
                trunkGradient.addColorStop(1, '#4A2F1A');
                bgCtx.fillStyle = trunkGradient;
                bgCtx.fillRect(treeX, treeY, treeWidth, treeHeight);
                
                // 树干纹理
                bgCtx.fillStyle = '#4A2F1A';
                for (let j = 0; j < 3; j++) {
                    const lineY = treeY + (j + 1) * (treeHeight / 4);
                    bgCtx.fillRect(treeX, lineY, treeWidth, 1);
                }
                
                // 树冠（深绿色，像素化圆形）
                const crownSize = 40 + Math.random() * 35;
                const crownX = treeX + treeWidth / 2 - crownSize / 2;
                const crownY = treeY - crownSize * 0.6;
                
                // 树冠基础色
                bgCtx.fillStyle = '#2D5016';
                
                // 像素化圆形树冠
                for (let py = 0; py < crownSize; py += 4) {
                    for (let px = 0; px < crownSize; px += 4) {
                        const dx = px - crownSize / 2;
                        const dy = py - crownSize / 2;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < crownSize / 2) {
                            // 随机变化颜色深浅
                            if (Math.random() > 0.7) {
                                bgCtx.fillStyle = '#3D6B1F';
                            } else {
                                bgCtx.fillStyle = '#2D5016';
                            }
                            bgCtx.fillRect(crownX + px, crownY + py, 4, 4);
                        }
                    }
                }
                
                // 树冠高光（亮绿色点）
                bgCtx.fillStyle = '#4D8B2A';
                for (let j = 0; j < 8; j++) {
                    const hx = crownX + crownSize * 0.2 + Math.random() * crownSize * 0.6;
                    const hy = crownY + Math.random() * crownSize * 0.4;
                    bgCtx.fillRect(hx, hy, 3, 3);
                }
            }
            
            // 添加一些灌木丛（只在草地区域）
            for (let i = 0; i < 80; i++) {
                const bushX = Math.random() * 2500;
                const bushY = grassStartY + 200 + Math.random() * 1000;
                const bushSize = 15 + Math.random() * 20;
                
                bgCtx.fillStyle = '#3D6B1F';
                // 简单的圆形灌木
                bgCtx.beginPath();
                bgCtx.arc(bushX, bushY, bushSize / 2, 0, Math.PI * 2);
                bgCtx.fill();
                
                // 灌木高光
                bgCtx.fillStyle = '#4D8B2A';
                bgCtx.beginPath();
                bgCtx.arc(bushX - bushSize / 4, bushY - bushSize / 4, bushSize / 4, 0, Math.PI * 2);
                bgCtx.fill();
            }
            
            textures.background = backgroundCanvas;
            
            // 11. 云朵纹理（用于飘动的云朵）
            const cloudTextures = [];
            for (let i = 0; i < 3; i++) {
                const cloudCanvas = document.createElement('canvas');
                cloudCanvas.width = 240 + i * 80; // 再增大一倍（原来是120 + i * 40）
                cloudCanvas.height = 120; // 再增大一倍（原来是60）
                const cloudCtx = cloudCanvas.getContext('2d');
                
                cloudCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                // 像素化云朵形状
                const w = cloudCanvas.width;
                cloudCtx.fillRect(w * 0.2, 48, w * 0.6, 32);
                cloudCtx.fillRect(w * 0.3, 16, w * 0.4, 32);
                cloudCtx.fillRect(w * 0.35, 0, w * 0.3, 32);
                cloudCtx.fillRect(w * 0.25, 80, w * 0.5, 32);
                
                cloudTextures.push(cloudCanvas);
            }
            textures.clouds = cloudTextures;
        }
        
        // 生成物品图标
        function generateItemIcons() {
            const iconSize = 32; // 图标大小
            
            // 辅助函数：创建图标 Canvas
            function createIconCanvas() {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = iconSize;
                tempCanvas.height = iconSize;
                return tempCanvas;
            }
            
            // 1. 铜镐图标（重新设计 - 镐头向下弯曲，长手柄）
            const copperPickaxeCanvas = createIconCanvas();

        // 一维柏林噪声实现
        class PerlinNoise {
            constructor(seed = 0) {
                this.seed = seed;
                this.permutation = this.generatePermutation();
            }
            
            // 生成置换表
            generatePermutation() {
                const p = [];
                for (let i = 0; i < 256; i++) {
                    p[i] = i;
                }
                
                // Fisher-Yates 洗牌算法
                for (let i = 255; i > 0; i--) {
                    const j = Math.floor(this.random(i) * (i + 1));
                    [p[i], p[j]] = [p[j], p[i]];
                }
                
                // 复制一份以避免溢出
                return [...p, ...p];
            }
            
            // 简单的伪随机数生成器
            random(x) {
                const seed = this.seed + x;
                const value = Math.sin(seed) * 10000;
                return value - Math.floor(value);
            }
            
            // 线性插值
            lerp(a, b, t) {
                return a + (b - a) * t;
            }
            
            // 平滑插值（使用 smoothstep）
            fade(t) {
                return t * t * t * (t * (t * 6 - 15) + 10);
            }
            
            // 一维柏林噪声
            noise(x) {
                const X = Math.floor(x) & 255;
                x -= Math.floor(x);
                
                const u = this.fade(x);
                
                const a = this.permutation[X];
                const b = this.permutation[X + 1];
                
                // 使用梯度
                const grad1 = (a % 2 === 0 ? 1 : -1);
                const grad2 = (b % 2 === 0 ? 1 : -1);
                
                return this.lerp(grad1 * x, grad2 * (x - 1), u);
            }
            
            // 多层噪声（Octave）
            octaveNoise(x, octaves = 4, persistence = 0.5) {
                let total = 0;
                let frequency = 1;
                let amplitude = 1;
                let maxValue = 0;
                
                for (let i = 0; i < octaves; i++) {
                    total += this.noise(x * frequency) * amplitude;
                    maxValue += amplitude;
                    amplitude *= persistence;
                    frequency *= 2;
                }
                
                return total / maxValue;
            }
        }

        // 使用细胞自动机生成洞穴

                // 找到地表位置

                for (let y = 0; y < Math.min(terrainBaseY + 50, height); y++) {
                    const block = gameState.worldMap[y][x];
                    if (block && block.id !== 'air') {
                        surfaceY = y;
                        break;
                    }
                }
                
                if (surfaceY === -1) continue;
                
                // 检查地表附近是否有水（湖泊）
                let hasWaterNearby = false;
                const checkRadius = 20; // 检查半径
                
                for (let dy = -5; dy <= 15; dy++) {
                    for (let dx = -checkRadius; dx <= checkRadius; dx++) {
                        const checkX = x + dx;
                        const checkY = surfaceY + dy;
                        
                        if (checkX >= 0 && checkX < width && checkY >= 0 && checkY < height) {
                            const block = gameState.worldMap[checkY][checkX];
                            if (block && block.id === 'water') {
                                hasWaterNearby = true;
                                break;
                            }
                        }
                    }
                    if (hasWaterNearby) break;
                }
                
                // 如果附近有水，标记保护区域（地表下方30格内）
                if (hasWaterNearby) {
                    const protectionDepth = 30; // 保护深度
                    const protectionWidth = 15; // 保护宽度

                        for (let dx = -protectionWidth; dx <= protectionWidth; dx++) {
                            const protectX = x + dx;
                            const protectY = surfaceY + dy;

        // 创建椭圆形洞穴
        function createEllipseCave(centerX, centerY, radiusX, radiusY, lakeProtectionZone) {
            const { width, height } = WORLD_CONFIG;
            
            // 遍历椭圆范围
            for (let y = centerY - radiusY; y <= centerY + radiusY; y++) {
                for (let x = centerX - radiusX; x <= centerX + radiusX; x++) {
                    // 边界检查
                    if (x < 0 || x >= width || y < 0 || y >= height) continue;
                    
                    // 检查是否在湖泊保护区域内
                    const blockKey = y * width + x;
                    if (lakeProtectionZone && lakeProtectionZone.has(blockKey)) {
                        continue; // 跳过保护区域
                    }
                    
                    // 椭圆方程：(x-cx)²/rx² + (y-cy)²/ry² <= 1
                    const dx = (x - centerX) / radiusX;
                    const dy = (y - centerY) / radiusY;
                    const distance = dx * dx + dy * dy;
                    
                    // 在椭圆内部，添加更多随机性让边缘更不规则
                    if (distance <= 1.0) {
                        // 边缘添加更多噪声，减少规则性
                        const edgeFactor = 1.0 - distance;
                        const threshold = edgeFactor > 0.5 ? 0.95 : (edgeFactor > 0.2 ? 0.7 : 0.4);
                        
                        if (Math.random() < threshold) {
                            const block = gameState.worldMap[y][x];
                            // 只清空石头，保留泥土和草地
                            if (block.id === 'stone') {
                                gameState.worldMap[y][x] = { ...BLOCK_TYPES.air };
                            }
                        }
                    }
                }
            }
        }

                    }
                }
            }
            
            // 应用新状态到地图
            for (let y = startY; y < height; y++) {

        // 移除过小的洞穴（使用洪水填充算法）
        async function removeSmallCaves(startY, progressCallback) {
            const { width, height } = WORLD_CONFIG;
            const minCaveSize = 25; // 最小洞穴大小保持25方块
            const visited = Array(height).fill(null).map(() => Array(width).fill(false));
            
            let removedCount = 0;
            let keptCount = 0;
            let processedRows = 0;
            
            // 遍历所有空气方块
            for (let y = startY; y < height - 1; y++) { // 不包括基岩层
                for (let x = 0; x < width; x++) {
                    const block = gameState.worldMap[y][x];
                    
                    if (block.id === 'air' && !visited[y][x]) {
                        // 使用洪水填充计算洞穴大小
                        const caveBlocks = floodFillCount(x, y, visited, startY);
                        
                        // 计算该洞穴的平均深度
                        let avgDepth = 0;
                        for (const pos of caveBlocks) {
                            avgDepth += pos.y;
                        }
                        avgDepth /= caveBlocks.length;
                        
                        // 根据深度计算期望的洞穴大小（正态分布）
                        const depthRatio = (avgDepth - startY) / (height - startY);
                        
                        // 使用正态分布生成期望大小
                        // 浅层：均值100，标准差50
                        // 深层：均值500，标准差200
                        const meanSize = 100 + depthRatio * 400; // 100到500
                        const stdDev = 50 + depthRatio * 150;    // 50到200
                        
                        // 生成正态分布的阈值（使用Box-Muller变换）
                        const u1 = Math.random();
                        const u2 = Math.random();
                        const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
                        const expectedSize = meanSize + z * stdDev;
                        
                        // 确保阈值不小于最小值
                        const threshold = Math.max(minCaveSize, expectedSize);
                        
                        // 如果洞穴太小，填充为石头
                        if (caveBlocks.length < threshold) {
                            for (const pos of caveBlocks) {
                                gameState.worldMap[pos.y][pos.x] = {
                                    id: BLOCK_TYPES.stone.id,
                                    hp: BLOCK_TYPES.stone.hp
                                };
                            }
                            removedCount++;
                        } else {
                            keptCount++;
                        }
                    }
                }
                
                // 每100行更新一次进度
                if (y % 100 === 0 && progressCallback) {
                    processedRows++;
                    const progress = 55 + Math.floor(((y - startY) / (height - startY)) * 5);
                    await progressCallback(1, progress, `优化洞穴大小... ${Math.floor(((y - startY) / (height - startY)) * 100)}%`);
                }
            }
        }
        
        // 洪水填充计算洞穴大小（优化版本：使用循环队列）

            const queue = new Array(maxQueueSize);

            queue[queueTail++] = { x: startX, y: startY };
            const blocks = [];
            
            // 预定义方向数组（避免重复创建对象）
            const directions = [
                [1, 0],   // 右
                [-1, 0],  // 左
                [0, 1],   // 下
                [0, -1]   // 上
            ];
            
            while (queueHead < queueTail) {
                const current = queue[queueHead++];
                const x = current.x;
                const y = current.y;
                
                // 边界检查（不包括基岩层）
                if (x < 0 || x >= width || y < minY || y >= height - 1) continue;
                if (visited[y][x]) continue;
                
                const block = gameState.worldMap[y][x];
                if (block.id !== 'air') continue;
                
                // 标记为已访问
                visited[y][x] = true;
                blocks.push({ x, y });
                
                // 添加4个方向的邻居（不包括对角线，让洞穴更连续）
                for (let i = 0; i < 4; i++) {
                    const nx = x + directions[i][0];
                    const ny = y + directions[i][1];
                    
                    // 提前检查避免重复入队
                    if (nx >= 0 && nx < width && ny >= minY && ny < height && !visited[ny][nx]) {
                        queue[queueTail++] = { x: nx, y: ny };
                    }
                }
            }
            
            return blocks;
        }
        
        // 计算周围8个方向的石头数量
        function countAdjacentStones(x, y) {
            let count = 0;
            
            // 8个方向
            const directions = [
                { dx: -1, dy: -1 }, { dx: 0, dy: -1 }, { dx: 1, dy: -1 },
                { dx: -1, dy: 0 },                      { dx: 1, dy: 0 },
                { dx: -1, dy: 1 },  { dx: 0, dy: 1 },  { dx: 1, dy: 1 }
            ];
            
            for (const dir of directions) {
                const checkX = x + dir.dx;
                const checkY = y + dir.dy;
                
                // 边界外视为石头（防止洞穴延伸到边界外）
                if (checkX < 0 || checkX >= WORLD_CONFIG.width || 
                    checkY < 0 || checkY >= WORLD_CONFIG.height) {
                    count++;
                    continue;
                }
                
                const block = gameState.worldMap[checkY][checkX];
                if (block && block.id === 'stone') {
                    count++;
                }
            }
            
            return count;
        }
        
        // 生成地表裂缝（Z字型隧道连接到地下洞穴）
        async function generateSurfaceCracks(progressCallback) {
            const { width, height, terrainBaseY } = WORLD_CONFIG;
            const spawnX = Math.floor(width / 2); // 出生点X坐标
            
            // 在出生点左右各生成一个裂缝
            const crackPositions = [
                spawnX - 125, // 左侧裂缝
                spawnX + 125  // 右侧裂缝
            ];
            
            const perlin = new PerlinNoise(54321); // 使用不同的种子
            
            for (let i = 0; i < crackPositions.length; i++) {
                const startX = crackPositions[i];
                
                // 确保裂缝在世界范围内
                if (startX < 10 || startX >= width - 10) continue;
                
                // 找到地表Y坐标
                let surfaceY = terrainBaseY;
                for (let y = 0; y < height; y++) {
                    const block = gameState.worldMap[y][startX];
                    if (block && block.id !== 'air') {
                        surfaceY = y;
                        break;
                    }
                }
                
                // 寻找目标洞穴（在地下深处）
                let targetX = startX;
                let targetY = terrainBaseY + 100; // 从地表下100格开始搜索
                let foundCave = false;
                
                // 向下搜索最近的大洞穴
                for (let searchY = terrainBaseY + 80; searchY < height - 50 && !foundCave; searchY += 5) {
                    for (let searchX = startX - 50; searchX <= startX + 50 && !foundCave; searchX += 5) {
                        if (searchX < 0 || searchX >= width) continue;
                        
                        const block = gameState.worldMap[searchY][searchX];
                        if (block && block.id === 'air') {
                            // 检查周围是否是大洞穴（至少有20个空气方块）
                            let airCount = 0;
                            for (let dy = -3; dy <= 3; dy++) {
                                for (let dx = -3; dx <= 3; dx++) {
                                    const checkX = searchX + dx;
                                    const checkY = searchY + dy;
                                    if (checkX >= 0 && checkX < width && checkY >= 0 && checkY < height) {
                                        const checkBlock = gameState.worldMap[checkY][checkX];
                                        if (checkBlock && checkBlock.id === 'air') {
                                            airCount++;
                                        }
                                    }
                                }
                            }
                            
                            if (airCount >= 20) {
                                targetX = searchX;
                                targetY = searchY;
                                foundCave = true;
                            }
                        }
                    }
                }
                
                // 如果没找到洞穴，使用默认深度
                if (!foundCave) {
                    targetY = Math.min(terrainBaseY + 150, height - 50);
                }
                
                // 生成Z字型隧道
                let currentX = startX;
                let currentY = surfaceY;
                const crackWidth = 3; // 裂缝宽度
                
                // 分3段：向下斜、水平、向下斜
                const segment1EndY = surfaceY + Math.floor((targetY - surfaceY) * 0.4);
                const segment2EndY = surfaceY + Math.floor((targetY - surfaceY) * 0.6);
                
                // 第一段：从地表斜向下（向左或向右）
                const direction1 = i === 0 ? -1 : 1; // 左侧裂缝向左，右侧裂缝向右
                while (currentY < segment1EndY) {
                    // 挖掘当前位置
                    for (let w = -crackWidth; w <= crackWidth; w++) {
                        const digX = currentX + w;
                        if (digX >= 0 && digX < width && currentY >= 0 && currentY < height) {
                            gameState.worldMap[currentY][digX] = { ...BLOCK_TYPES.air };
                        }
                    }
                    
                    // 使用柏林噪声添加随机波动
                    const noise = perlin.noise(currentY * 0.1, i * 100);
                    const wiggle = Math.floor(noise * 2); // ±2格的波动
                    
                    currentY++;
                    currentX += direction1 + wiggle;
                    currentX = Math.max(5, Math.min(width - 5, currentX)); // 边界限制
                }
                
                // 第二段：水平移动
                const segment2EndX = currentX + direction1 * 30; // 水平移动30格
                while ((direction1 > 0 && currentX < segment2EndX) || (direction1 < 0 && currentX > segment2EndX)) {
                    // 挖掘当前位置
                    for (let w = -crackWidth; w <= crackWidth; w++) {
                        const digX = currentX + w;
                        if (digX >= 0 && digX < width && currentY >= 0 && currentY < height) {
                            gameState.worldMap[currentY][digX] = { ...BLOCK_TYPES.air };
                        }
                    }
                    
                    // 使用柏林噪声添加随机波动
                    const noise = perlin.noise(currentX * 0.1, i * 100 + 50);
                    const wiggle = Math.floor(noise * 2);
                    
                    currentX += direction1;
                    currentY += wiggle;
                    currentY = Math.max(segment1EndY, Math.min(segment2EndY, currentY));
                }
                
                // 第三段：继续斜向下到达目标洞穴
                while (currentY < targetY) {
                    // 挖掘当前位置
                    for (let w = -crackWidth; w <= crackWidth; w++) {
                        const digX = currentX + w;
                        if (digX >= 0 && digX < width && currentY >= 0 && currentY < height) {
                            gameState.worldMap[currentY][digX] = { ...BLOCK_TYPES.air };
                        }
                    }
                    
                    // 使用柏林噪声添加随机波动
                    const noise = perlin.noise(currentY * 0.1, i * 100 + 100);
                    const wiggle = Math.floor(noise * 2);
                    
                    currentY++;
                    // 逐渐向目标X移动
                    if (currentX < targetX) {
                        currentX += 1 + wiggle;
                    } else if (currentX > targetX) {
                        currentX -= 1 + wiggle;
                    } else {
                        currentX += wiggle;
                    }
                    currentX = Math.max(5, Math.min(width - 5, currentX));
                }
                
                if (progressCallback) {
                    await progressCallback(1, 58 + i, `生成地表裂缝... ${i + 1}/2`);
                }
            }
        }
        
        // 生成地下土块（大片随机分布）

                const generatedBlocks = new Set();

                generatedBlocks.add(`${centerX},${centerY}`);
                
                while (queue.length > 0 && generatedBlocks.size < patchSize) {
                    const current = queue.shift();
                    const { x, y } = current;
                    
                    // 边界检查
                    if (x < 0 || x >= width || y < undergroundStartY || y >= height - 1) {
                        continue;

                    // 将当前方块变为土块（只转换石头）
                    const block = gameState.worldMap[y][x];

                        gameState.worldMap[y][x] = {
                            id: BLOCK_TYPES.dirt.id,
                            hp: BLOCK_TYPES.dirt.hp

                    // 随机扩展到相邻方块（上下左右）
                    const directions = [

                        { dx: 0, dy: 1 },   // 下
                        { dx: -1, dy: 0 },  // 左
                        { dx: 1, dy: 0 }    // 右
                    ];
                    
                    // 打乱方向顺序，增加随机性
                    directions.sort(() => Math.random() - 0.5);
                    
                    for (const dir of directions) {
                        const newX = x + dir.dx;
                        const newY = y + dir.dy;
                        const key = `${newX},${newY}`;
                        
                        // 如果还没有访问过这个方块
                        if (!generatedBlocks.has(key)) {
                            // 边界检查

                                if (neighborBlock.id === 'stone') {

                                    if (Math.random() < 0.7) {
                                        queue.push({ x: newX, y: newY });
                                        generatedBlocks.add(key);
                                    }

                }
                
                // 每50个土块更新一次进度
                if (i % 50 === 0 && progressCallback) {
                    await progressCallback(1, 59, `生成地下土块... ${i}/${numDirtPatches}`);
                }
            }
        }

        // 使用密度和正态分布生成矿脉
        async function generateOreTypeByDensity(config, progressCallback, oreIndex, totalOres) {
            const { width, height } = WORLD_CONFIG;
            const { minDepth, maxDepth, baseDensity, veinSizeMean, veinSizeStdDev, blockType, depthBonus, name, minSpacing } = config;
            
            let generatedVeins = 0;
            let processedBlocks = 0;
            const totalBlocks = (maxDepth - minDepth) * width;
            
            // 记录最近生成的矿脉位置（用于间隔检查）
            const recentVeins = [];
            
            // 遍历矿石生成范围内的所有石头方块
            for (let y = minDepth; y < Math.min(maxDepth, height - 1); y++) {
                for (let x = 0; x < width; x++) {
                    const block = getBlock(x, y);
                    
                    // 只在石头方块上生成矿石
                    if (block && block.id === 'stone') {
                        // 检查与最近矿脉的距离
                        let tooClose = false;
                        for (const vein of recentVeins) {
                            const dx = x - vein.x;
                            const dy = y - vein.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < minSpacing) {
                                tooClose = true;
                                break;
                            }
                        }
                        
                        if (tooClose) continue;
                        
                        // 计算当前深度的密度（随深度增加）
                        const depthRatio = (y - minDepth) / (maxDepth - minDepth);
                        const density = baseDensity + depthBonus * depthRatio;
                        
                        // 随机判断是否生成矿脉
                        if (Math.random() < density) {
                            // 使用正态分布生成矿脉大小
                            const veinSize = Math.max(3, Math.round(generateNormalRandom(veinSizeMean, veinSizeStdDev)));
                            
                            // 生成矿脉
                            generateVeinWithRandomWalk(x, y, veinSize, blockType);
                            generatedVeins++;
                            
                            // 记录矿脉位置
                            recentVeins.push({ x, y });
                            
                            // 只保留最近100个矿脉位置（优化性能）
                            if (recentVeins.length > 100) {
                                recentVeins.shift();
                            }
                        }
                    }
                    
                    processedBlocks++;
                }
                
                // 每50行更新一次进度
                if (y % 50 === 0 && progressCallback) {
                    const progress = 60 + Math.floor((oreIndex / totalOres) * 20) + Math.floor(((y - minDepth) / (maxDepth - minDepth)) * (20 / totalOres));
                    await progressCallback(1, progress, `生成${name}... ${generatedVeins}个矿脉`);
                }
            }
        }
        
        // 生成正态分布随机数（Box-Muller变换）
        function generateNormalRandom(mean, stdDev) {
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            return mean + stdDev * z0;
        }
        
        // 使用随机游走算法生成单个矿脉
        function generateVeinWithRandomWalk(startX, startY, size, blockType) {
            const { width, height } = WORLD_CONFIG;
            const visited = new Set();
            
            let currentX = startX;
            let currentY = startY;
            let placedCount = 0;
            
            // 6个方向（包括上下左右和两个对角）
            const directions = [
                { dx: 1, dy: 0 },   // 右
                { dx: -1, dy: 0 },  // 左
                { dx: 0, dy: 1 },   // 下
                { dx: 0, dy: -1 },  // 上
                { dx: 1, dy: 1 },   // 右下
                { dx: -1, dy: 1 }   // 左下
            ];
            
            // 随机游走
            for (let step = 0; step < size * 3 && placedCount < size; step++) {
                // 检查当前位置
                if (currentX >= 0 && currentX < width && 
                    currentY >= 0 && currentY < height) {
                    
                    const posKey = `${currentX},${currentY}`;
                    const block = getBlock(currentX, currentY);
                    
                    // 如果是石头且未访问过，替换为矿石
                    if (block && block.id === 'stone' && !visited.has(posKey)) {
                        setBlock(currentX, currentY, blockType);
                        visited.add(posKey);
                        placedCount++;
                    }
                }
                
                // 随机选择下一个方向
                const dir = directions[Math.floor(Math.random() * directions.length)];
                currentX += dir.dx;
                currentY += dir.dy;
                
                // 边界检查，如果超出边界则重新选择方向
                if (currentX < 0 || currentX >= width || 
                    currentY < 0 || currentY >= height) {
                    currentX = startX;
                    currentY = startY;
                }
            }
            
            // 如果至少放置了一半的矿石，认为成功
            return placedCount >= size * 0.5;
        }
        
        // 生成洞穴背景墙

            const { width, height, terrainBaseY } = WORLD_CONFIG;
