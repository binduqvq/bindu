            // 保存背包按钮位置到全局状态（用于点击检测）
            gameState.backpackButton = {
                x: backpackButtonX,
                y: backpackButtonY,
                size: backpackButtonSize
            };
            
            for (let i = 0; i < gameState.inventory.slots.length; i++) {
                const slot = gameState.inventory.slots[i];
                const x = startX + i * (slotSize + slotSpacing);
                const y = startY;
                
                // 绘制格子背景
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(x, y, slotSize, slotSize);
                
                // 如果是选中的格子，绘制高亮边框
                if (i === gameState.inventory.selectedSlot) {
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 3;
                } else {
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 2;
                }
                ctx.strokeRect(x, y, slotSize, slotSize);
                
                // 绘制物品
                if (slot.item) {
                    const itemType = ITEM_TYPES[slot.item];
                    if (itemType) {
                        // 使用物品图标（如果存在）
                        const icon = itemIcons[slot.item];
                        if (icon) {
                            const iconSize = 36;
                            const iconX = x + (slotSize - iconSize) / 2;
                            const iconY = y + (slotSize - iconSize) / 2 - 3;
                            ctx.drawImage(icon, iconX, iconY, iconSize, iconSize);
                        } else {
                            // 降级方案：使用颜色方块
                            ctx.fillStyle = itemType.color;
                            const iconSize = 30;
                            const iconX = x + (slotSize - iconSize) / 2;
                            const iconY = y + (slotSize - iconSize) / 2 - 5;
                            ctx.fillRect(iconX, iconY, iconSize, iconSize);
                            
                            // 绘制物品边框
                            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(iconX, iconY, iconSize, iconSize);
                        }
                        
                        // 绘制数量（如果可堆叠）
                        if (itemType.stackable && slot.count > 1) {
                            ctx.fillStyle = '#fff';
                            ctx.strokeStyle = '#000';
                            ctx.lineWidth = 3;
                            ctx.font = 'bold 14px monospace';
                            ctx.textAlign = 'right';
                            ctx.textBaseline = 'bottom';
                            const text = slot.count.toString();
                            ctx.strokeText(text, x + slotSize - 5, y + slotSize - 5);
                            ctx.fillText(text, x + slotSize - 5, y + slotSize - 5);
                        }
                    }
                }
                
                // 绘制快捷键数字
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.font = 'bold 12px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                const keyText = (i + 1) % 10; // 1-9, 0
                ctx.strokeText(keyText, x + 3, y + 3);
                ctx.fillText(keyText, x + 3, y + 3);
            }
        }
        
        // 渲染物品栏提示（单独函数，确保在最上层）
        function renderHotbarTooltips() {
            const slotSize = 50;
            const slotSpacing = 5;
            const totalWidth = gameState.inventory.slots.length * (slotSize + slotSpacing) - slotSpacing;
            const startX = (canvas.width - totalWidth) / 2;
            const startY = canvas.height - slotSize - 20;
            
            const mouseX = gameState.mouse.screenX;
            const mouseY = gameState.mouse.screenY;
            
            // 检查鼠标是否悬停在背包按钮上
            if (gameState.backpackButton) {
                const btn = gameState.backpackButton;
                if (mouseX >= btn.x && mouseX <= btn.x + btn.size &&
                    mouseY >= btn.y && mouseY <= btn.y + btn.size) {
                    // 绘制背包按钮提示
                    const tooltipText = '背包/esc';
                    ctx.font = '14px monospace';
                    const textWidth = ctx.measureText(tooltipText).width;
                    const tooltipX = btn.x + btn.size / 2 - textWidth / 2 - 5;
                    const tooltipY = btn.y - 30;
                    
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                    ctx.fillRect(tooltipX, tooltipY, textWidth + 10, 25);
                    
                    ctx.strokeStyle = '#666';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(tooltipX, tooltipY, textWidth + 10, 25);
                    
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(tooltipText, btn.x + btn.size / 2, tooltipY + 12);
                    
                    return; // 显示背包提示后直接返回，不显示物品栏提示
                }
            }
            
            // 检查鼠标悬停提示
            let hoveredSlot = -1;
            for (let i = 0; i < gameState.inventory.slots.length; i++) {
                const x = startX + i * (slotSize + slotSpacing);
                const y = startY;
                
                if (mouseX >= x && mouseX <= x + slotSize && mouseY >= y && mouseY <= y + slotSize) {
                    hoveredSlot = i;
                    break;
                }
            }
            
            // 优先显示鼠标悬停提示，否则显示定时提示
            let tooltipSlot = hoveredSlot >= 0 ? hoveredSlot : (gameState.tooltipTimer > 0 ? gameState.tooltipSlot : -1);
            
            if (tooltipSlot >= 0 && tooltipSlot < gameState.inventory.slots.length) {
                const slot = gameState.inventory.slots[tooltipSlot];
                if (slot.item) {
                    const itemType = ITEM_TYPES[slot.item];
                    if (itemType) {
                        const x = startX + tooltipSlot * (slotSize + slotSpacing);
                        const y = startY;
                        
                        // 绘制提示框
                        const tooltipText = itemType.name;
                        ctx.font = '14px monospace';
                        const textWidth = ctx.measureText(tooltipText).width;
                        const tooltipX = x + slotSize / 2 - textWidth / 2 - 5;
                        const tooltipY = y - 30;
                        
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                        ctx.fillRect(tooltipX, tooltipY, textWidth + 10, 25);
                        
                        ctx.strokeStyle = '#666';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(tooltipX, tooltipY, textWidth + 10, 25);
                        
                        ctx.fillStyle = '#fff';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(tooltipText, x + slotSize / 2, tooltipY + 12);
                    }
                }
            }
        }
        
        // 渲染背包界面提示框（辅助函数）
        function renderInventoryTooltip(text, mouseX, mouseY) {
            ctx.font = '14px monospace';
            const textWidth = ctx.measureText(text).width;
            const tooltipWidth = textWidth + 10;
            const tooltipHeight = 25;
            
            // 计算提示框位置（跟随鼠标，但避免超出屏幕）
            let tooltipX = mouseX + 15;
            let tooltipY = mouseY - 10;
            
            // 防止超出右边界
            if (tooltipX + tooltipWidth > canvas.width) {
                tooltipX = mouseX - tooltipWidth - 15;
            }
            
            // 防止超出下边界
            if (tooltipY + tooltipHeight > canvas.height) {
                tooltipY = canvas.height - tooltipHeight - 5;
            }
            
            // 防止超出上边界
            if (tooltipY < 5) {
                tooltipY = 5;
            }
            
            // 绘制提示框背景
            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillRect(tooltipX, tooltipY, tooltipWidth, tooltipHeight);
            
            // 绘制提示框边框
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.strokeRect(tooltipX, tooltipY, tooltipWidth, tooltipHeight);
            
            // 绘制文字
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, tooltipX + tooltipWidth / 2, tooltipY + tooltipHeight / 2);
        }
        
        // 更新小地图探索区域（基于玩家视野）
        function updateMinimapExploration() {
            if (!gameState.player || !gameState.minimapExploredMap) return;
            
            const blockSize = WORLD_CONFIG.blockSize;
            const playerBlockX = Math.floor((gameState.player.x + gameState.player.width / 2) / blockSize);
            const playerBlockY = Math.floor((gameState.player.y + gameState.player.height / 2) / blockSize);
            
            // 探索半径（方块数）- 玩家周围的区域会被标记为已探索
            const exploreRadius = 8; // 减少探索范围（原来是15）
            
            // 标记玩家周围的方块为已探索
            for (let dy = -exploreRadius; dy <= exploreRadius; dy++) {
                for (let dx = -exploreRadius; dx <= exploreRadius; dx++) {
                    const blockX = playerBlockX + dx;
                    const blockY = playerBlockY + dy;
                    
                    // 检查坐标是否在世界范围内
                    if (blockX >= 0 && blockX < WORLD_CONFIG.width && 
                        blockY >= 0 && blockY < WORLD_CONFIG.height) {
                        
                        // 圆形探索范围（可选，如果想要方形探索范围可以去掉这个判断）
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance <= exploreRadius) {
                            gameState.minimapExploredMap[blockY][blockX] = true;
                        }
                    }
                }
            }
        }
        
        // 渲染小地图
        function renderMinimap() {
            // 如果小地图展开为全屏，使用全屏渲染
            if (gameState.minimapExpanded) {
                renderFullscreenMinimap();
                return;
            }
            
            const blockSize = WORLD_CONFIG.blockSize;
            
            // 计算物品栏的宽度
            const slotSize = 50;
            const slotSpacing = 5;
            const hotbarWidth = gameState.inventory.slots.length * (slotSize + slotSpacing) - slotSpacing;
            
            // 小地图配置
            const minimapConfig = {
                targetWidth: hotbarWidth * 0.5, // 目标宽度：物品栏宽度的一半
                aspectRatio: 5 / 4, // 宽高比 5:4（宽度稍大于高度）
                padding: 10, // 距离屏幕边缘的距离
                borderWidth: 2,
                backgroundColor: 'rgba(0, 0, 0, 0.7)',
                borderColor: 'rgba(255, 255, 255, 0.8)',
                playerColor: '#FF0000', // 玩家红点颜色
                playerSize: 4, // 玩家红点大小（像素）
                viewportScale: 1.3 // 显示范围为屏幕的1.3倍
            };
            
            // 根据目标宽度和宽高比计算高度
            const minimapWidth = minimapConfig.targetWidth;
            const minimapHeight = Math.floor(minimapWidth / minimapConfig.aspectRatio);
            
            // 计算小地图位置（右上角）
            const minimapX = canvas.width - minimapWidth - minimapConfig.padding;
            const minimapY = minimapConfig.padding;
            
            // 保存小地图边界（用于点击检测）
            gameState.minimapBounds = {
                x: minimapX,
                y: minimapY,
                width: minimapWidth,
                height: minimapHeight
            };
            
            // 计算玩家在世界中的位置（方块坐标）
            const playerBlockX = Math.floor((gameState.player.x + gameState.player.width / 2) / blockSize);
            const playerBlockY = Math.floor((gameState.player.y + gameState.player.height / 2) / blockSize);
            
            // 计算小地图显示的世界范围（基于当前屏幕视野的1.3倍）
            const screenWidthInBlocks = Math.ceil(canvas.width / blockSize);
            const screenHeightInBlocks = Math.ceil(canvas.height / blockSize);
            const viewWidthInBlocks = Math.floor(screenWidthInBlocks * minimapConfig.viewportScale);
            const viewHeightInBlocks = Math.floor(screenHeightInBlocks * minimapConfig.viewportScale);
            
            // 以玩家为中心
            const startBlockX = Math.max(0, playerBlockX - Math.floor(viewWidthInBlocks / 2));
            const startBlockY = Math.max(0, playerBlockY - Math.floor(viewHeightInBlocks / 2));
            const endBlockX = Math.min(WORLD_CONFIG.width, startBlockX + viewWidthInBlocks);
            const endBlockY = Math.min(WORLD_CONFIG.height, startBlockY + viewHeightInBlocks);
            
            // 实际显示的方块范围
            const actualViewWidth = endBlockX - startBlockX;
            const actualViewHeight = endBlockY - startBlockY;
            
            // 计算缩放比例（等比例放大到填满小地图宽度）
            const scaleX = minimapWidth / actualViewWidth;
            const scaleY = minimapHeight / actualViewHeight;
            const actualScale = Math.min(scaleX, scaleY); // 保持宽高比，取较小的缩放比例
            
            // 计算实际内容的尺寸（可能小于小地图尺寸）
            const contentWidth = actualViewWidth * actualScale;
            const contentHeight = actualViewHeight * actualScale;
            
            // 居中显示内容
            const contentOffsetX = (minimapWidth - contentWidth) / 2;
            const contentOffsetY = (minimapHeight - contentHeight) / 2;
            
            // 绘制小地图背景
            ctx.fillStyle = minimapConfig.backgroundColor;
            ctx.fillRect(minimapX, minimapY, minimapWidth, minimapHeight);
            
            // 绘制小地图边框
            ctx.strokeStyle = minimapConfig.borderColor;
            ctx.lineWidth = minimapConfig.borderWidth;
            ctx.strokeRect(minimapX, minimapY, minimapWidth, minimapHeight);
            
            // 绘制世界方块（每个方块用actualScale像素表示，方块贴合无间隙）
            ctx.save();
            ctx.beginPath();
            ctx.rect(minimapX, minimapY, minimapWidth, minimapHeight);
            ctx.clip();
            
            for (let blockY = startBlockY; blockY < endBlockY; blockY++) {
                for (let blockX = startBlockX; blockX < endBlockX; blockX++) {
                    // 战争迷雾：只显示已探索的区域
                    if (!gameState.minimapExploredMap[blockY][blockX]) {
                        continue; // 未探索的区域保持黑色（背景色）
                    }
                    
                    const block = getBlock(blockX, blockY);
                    
                    if (block && block.id !== 'air') {
                        const blockType = BLOCK_TYPES[block.id];
                        if (blockType) {
                            const pixelX = minimapX + contentOffsetX + (blockX - startBlockX) * actualScale;
                            const pixelY = minimapY + contentOffsetY + (blockY - startBlockY) * actualScale;
                            
                            // 获取方块颜色
                            let color = blockType.color || '#888';
                            
                            // 根据方块类型调整颜色
                            if (blockType.id === 'grass') {
                                color = '#7CFC00'; // 草地：亮绿色
                            } else if (blockType.id === 'dirt') {
                                color = '#8B4513'; // 泥土：棕色
                            } else if (blockType.id === 'stone') {
                                color = '#808080'; // 石头：灰色
                            } else if (blockType.id === 'trunk' || blockType.id === 'log') {
                                color = '#8B4513'; // 木头：深棕色
                            } else if (blockType.id === 'leaves') {
                                color = '#228B22'; // 树叶：森林绿
                            } else if (blockType.id === 'torch') {
                                color = '#FFD700'; // 火把：金色
                            } else if (blockType.id === 'wood') {
                                color = '#DEB887'; // 木材：浅棕黄色
                            } else if (blockType.id === 'coalOre') {
                                color = '#2F4F4F'; // 煤矿：深灰色
                            } else if (blockType.id === 'ironOre') {
                                color = '#C0C0C0'; // 铁矿：银色
                            }
                            
                            ctx.fillStyle = color;
                            // 使用Math.ceil确保方块完全贴合，无间隙
                            ctx.fillRect(
                                Math.floor(pixelX), 
                                Math.floor(pixelY), 
                                Math.ceil(actualScale), 
                                Math.ceil(actualScale)
                            );
                        }
                    }
                }
            }
            
            ctx.restore();
            
            // 绘制玩家位置（红点）
            const playerPixelX = minimapX + contentOffsetX + (playerBlockX - startBlockX) * actualScale;
            const playerPixelY = minimapY + contentOffsetY + (playerBlockY - startBlockY) * actualScale;
            
            ctx.fillStyle = minimapConfig.playerColor;
            ctx.beginPath();
            ctx.arc(playerPixelX, playerPixelY, minimapConfig.playerSize, 0, Math.PI * 2);
            ctx.fill();
            
            // 绘制玩家红点边框（更明显）
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(playerPixelX, playerPixelY, minimapConfig.playerSize, 0, Math.PI * 2);
            ctx.stroke();
            
            // 返回小地图的底部Y坐标，供时间显示使用
            return minimapY + minimapHeight;
        }
        
        // 渲染全屏小地图
        function renderFullscreenMinimap() {
            const blockSize = WORLD_CONFIG.blockSize;
            
            // 全屏地图配置
            const padding = 40;
            const mapWidth = canvas.width - padding * 2;
            const mapHeight = canvas.height - padding * 2;
            
            // 绘制半透明黑色背景
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制地图边框
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 3;
            ctx.strokeRect(padding, padding, mapWidth, mapHeight);
            
            // 计算玩家在世界中的位置（方块坐标）
            const playerBlockX = Math.floor((gameState.player.x + gameState.player.width / 2) / blockSize);
            const playerBlockY = Math.floor((gameState.player.y + gameState.player.height / 2) / blockSize);
            
            // 计算显示范围（与小地图相同的范围）
            const screenWidthInBlocks = Math.ceil(canvas.width / blockSize);
            const screenHeightInBlocks = Math.ceil(canvas.height / blockSize);
            const viewportScale = 1.3; // 与小地图相同的视野缩放
            const viewWidthInBlocks = Math.floor(screenWidthInBlocks * viewportScale);
            const viewHeightInBlocks = Math.floor(screenHeightInBlocks * viewportScale);
            
            // 应用拖拽偏移量（以玩家为中心，加上拖拽偏移）
            const centerBlockX = playerBlockX + gameState.minimapDrag.offsetX;
            const centerBlockY = playerBlockY + gameState.minimapDrag.offsetY;
            
            // 计算显示范围
            const startBlockX = Math.max(0, centerBlockX - Math.floor(viewWidthInBlocks / 2));
            const startBlockY = Math.max(0, centerBlockY - Math.floor(viewHeightInBlocks / 2));
            const endBlockX = Math.min(WORLD_CONFIG.width, startBlockX + viewWidthInBlocks);
            const endBlockY = Math.min(WORLD_CONFIG.height, startBlockY + viewHeightInBlocks);
            
            // 实际显示的方块范围
            const actualViewWidth = endBlockX - startBlockX;
            const actualViewHeight = endBlockY - startBlockY;
            
            // 计算缩放比例（填满屏幕）
            const scaleX = mapWidth / actualViewWidth;
            const scaleY = mapHeight / actualViewHeight;
            const scale = Math.min(scaleX, scaleY);
            
            // 计算实际内容尺寸
            const contentWidth = actualViewWidth * scale;
            const contentHeight = actualViewHeight * scale;
            
            // 居中显示
            const offsetX = padding + (mapWidth - contentWidth) / 2;
            const offsetY = padding + (mapHeight - contentHeight) / 2;
            
            // 裁剪区域
            ctx.save();
            ctx.beginPath();
            ctx.rect(padding, padding, mapWidth, mapHeight);
            ctx.clip();
            
            // 绘制方块（只绘制视野范围内的方块）
            for (let blockY = startBlockY; blockY < endBlockY; blockY++) {
                for (let blockX = startBlockX; blockX < endBlockX; blockX++) {
                    // 战争迷雾：只显示已探索的区域
                    if (!gameState.minimapExploredMap[blockY][blockX]) {
                        continue; // 未探索的区域保持黑色（背景色）
                    }
                    
                    const block = getBlock(blockX, blockY);
                    
                    if (block && block.id !== 'air') {
                        const blockType = BLOCK_TYPES[block.id];
                        if (blockType) {
                            const pixelX = offsetX + (blockX - startBlockX) * scale;
                            const pixelY = offsetY + (blockY - startBlockY) * scale;
                            
                            // 获取方块颜色
                            let color = blockType.color || '#888';
                            
                            // 根据方块类型调整颜色
                            if (blockType.id === 'grassDirt') {
                                color = '#7CFC00';
                            } else if (blockType.id === 'dirt') {
                                color = '#8B4513';
                            } else if (blockType.id === 'stone') {
                                color = '#808080';
                            } else if (blockType.id === 'trunk') {
                                color = '#8B4513';
                            } else if (blockType.id === 'leaves') {
                                color = '#228B22';
                            } else if (blockType.id === 'torch') {
                                color = '#FFD700';
                            } else if (blockType.id === 'planks') {
                                color = '#DEB887';
                            } else if (blockType.id === 'copperOre') {
                                color = '#FF8C00';
                            } else if (blockType.id === 'ironOre') {
                                color = '#C0C0C0';
                            } else if (blockType.id === 'goldOre') {
                                color = '#FFD700';
                            }
                            
                            ctx.fillStyle = color;
                            ctx.fillRect(
                                Math.floor(pixelX),
                                Math.floor(pixelY),
                                Math.ceil(scale),
                                Math.ceil(scale)
                            );
                        }
                    }
                }
            }
            
            ctx.restore();
            
            // 绘制玩家位置（红点，放大）
            const playerPixelX = offsetX + (playerBlockX - startBlockX) * scale;
            const playerPixelY = offsetY + (playerBlockY - startBlockY) * scale;
            
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.arc(playerPixelX, playerPixelY, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(playerPixelX, playerPixelY, 8, 0, Math.PI * 2);
            ctx.stroke();
            
            return 0; // 全屏模式不需要返回位置
        }
        
        // 渲染背包界面
        function renderInventoryScreen() {
            try {
                // 保存canvas上下文状态
                ctx.save();
                
                // 半透明黑色背景遮罩
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 背包界面参数
                const slotSize = 50;
                const slotSpacing = 5;
                const cols = 10;
                const rows = 5; // 4排背包 + 1排热键栏
                const sectionSpacing = 15; // 统一的区域间距
                
                // 计算各部分宽度
                const backpackWidth = cols * (slotSize + slotSpacing) - slotSpacing;
                const backpackHeight = rows * (slotSize + slotSpacing) - slotSpacing + 60;
                const equipmentWidth = slotSize + 20; // 装备栏宽度（1列）
                const characterWidth = 120; // 角色模型区域宽度
                const craftingWidth = 120; // 合成栏宽度（2x2格子 + 输出）
                // 总宽度 = 装备栏 + 角色 + 间距 + 黑线 + 间距 + 背包 + 间距 + 黑线 + 间距 + 合成栏
                const totalWidth = equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing + backpackWidth + sectionSpacing + 2 + sectionSpacing + craftingWidth;
                
                const panelStartX = (canvas.width - totalWidth) / 2;
                const panelStartY = (canvas.height - backpackHeight) / 2;
                
                // 绘制整体背景
                ctx.fillStyle = 'rgba(50, 50, 50, 0.95)';
                ctx.fillRect(panelStartX - 20, panelStartY - 50, totalWidth + 40, backpackHeight + 40);
                
                // 绘制边框
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 3;
                ctx.strokeRect(panelStartX - 20, panelStartY - 50, totalWidth + 40, backpackHeight + 40);
                
                // 绘制分割线1（装备栏和背包栏之间）
                const divider1X = panelStartX + equipmentWidth + characterWidth + sectionSpacing;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(divider1X, panelStartY - 40);
                ctx.lineTo(divider1X, panelStartY - 40 + backpackHeight + 20);
                ctx.stroke();
                
                // 绘制分割线2（背包栏和合成栏之间）
                const divider2X = panelStartX + equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing + backpackWidth + sectionSpacing;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(divider2X, panelStartY - 40);
                ctx.lineTo(divider2X, panelStartY - 40 + backpackHeight + 20);
                ctx.stroke();
                
                // === 绘制装备栏（左侧，一列） ===
                const equipStartX = panelStartX;
                const equipStartY = panelStartY;
                
                // 装备栏标题
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px monospace';
                ctx.fillText('装备', equipStartX, equipStartY - 10);
                
                // 装备槽位置（一列布局）
                const equipmentSlotPositions = [
                    { key: 'helmet', x: equipStartX, y: equipStartY + 20, label: '头盔' },
                    { key: 'chestplate', x: equipStartX, y: equipStartY + 20 + (slotSize + slotSpacing), label: '胸甲' },
                    { key: 'leggings', x: equipStartX, y: equipStartY + 20 + 2 * (slotSize + slotSpacing), label: '腿甲' },
                    { key: 'boots', x: equipStartX, y: equipStartY + 20 + 3 * (slotSize + slotSpacing), label: '战靴' }
                ];
                
                // 绘制装备槽
                if (gameState.inventory.equipmentSlots) {
                    for (let equipSlot of equipmentSlotPositions) {
                        const slot = gameState.inventory.equipmentSlots[equipSlot.key];
                        if (!slot) continue;
                        
                        const x = equipSlot.x;
                        const y = equipSlot.y;
                        
                        // 检查是否是拖动源（左键拖动会让格子变空，右键分离不会）
                        const isDragSource = gameState.draggedItem && 
                                            gameState.draggedItem.sourceType !== 'rightClickSplit' &&
                                            gameState.draggedItem.sourceType === 'equipment' && 
                                            gameState.draggedItem.sourceIndex === equipSlot.key;
                        
                        // 检查是否是背包界面高亮的格子
                        const isHighlighted = gameState.inventoryHighlight.type === 'equipment' && 
                                             gameState.inventoryHighlight.index === equipSlot.key;
                        
                        // 绘制格子背景（高亮的格子使用白色背景）
                        if (isHighlighted) {
                            ctx.fillStyle = '#555'; // 浅灰色背景表示高亮
                        } else {
                            ctx.fillStyle = '#2a2a2a';
                        }
                        ctx.fillRect(x, y, slotSize, slotSize);
                        
                        // 绘制格子边框（高亮的格子使用白色边框）
                        if (isHighlighted) {
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 3;
                        } else {
                            ctx.strokeStyle = '#666';
                            ctx.lineWidth = 2;
                        }
                        ctx.strokeRect(x, y, slotSize, slotSize);
                        
                        // 绘制装备槽标签（小字）
                        ctx.fillStyle = '#888';
                        ctx.font = '10px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(equipSlot.label, x + slotSize / 2, y + slotSize / 2);
                        ctx.textAlign = 'left';
                        
                        // 绘制物品图标（如果有且不是拖动源）
                        if (slot.item && itemIcons[slot.item] && !isDragSource) {
                            const icon = itemIcons[slot.item];
                            const iconSize = 32;
                            const iconX = x + (slotSize - iconSize) / 2;
                            const iconY = y + (slotSize - iconSize) / 2;
                            ctx.drawImage(icon, iconX, iconY, iconSize, iconSize);
                        }
                    }
                }
                
                // === 绘制角色模型（中间） ===
                const characterStartX = equipStartX + equipmentWidth - 5; // 装备栏右侧，向左移动5px
                const characterStartY = equipStartY + 20;
                const characterDisplayHeight = 4 * (slotSize + slotSpacing) - slotSpacing;
                
                // 绘制角色背景框（草原-蓝天背景）
                // 蓝天部分（上半部分）
                const skyHeight = characterDisplayHeight * 0.6;
                const grassHeight = characterDisplayHeight * 0.4;
                
                // 渐变蓝天
                const skyGradient = ctx.createLinearGradient(characterStartX, characterStartY, characterStartX, characterStartY + skyHeight);
                skyGradient.addColorStop(0, '#87CEEB'); // 天蓝色
                skyGradient.addColorStop(1, '#B0E0E6'); // 浅蓝色
                ctx.fillStyle = skyGradient;
                ctx.fillRect(characterStartX, characterStartY, characterWidth, skyHeight);
                
                // 草地部分（下半部分）
                const grassGradient = ctx.createLinearGradient(characterStartX, characterStartY + skyHeight, characterStartX, characterStartY + characterDisplayHeight);
                grassGradient.addColorStop(0, '#90EE90'); // 浅绿色
                grassGradient.addColorStop(1, '#228B22'); // 森林绿
                ctx.fillStyle = grassGradient;
                ctx.fillRect(characterStartX, characterStartY + skyHeight, characterWidth, grassHeight);
                
                // 绘制一些草的细节（竖线）- 使用固定位置避免每帧闪烁
                ctx.strokeStyle = '#32CD32';
                ctx.lineWidth = 1;
                // 预定义的草位置（固定的，不使用随机）
                const grassPositions = [
                    {x: 15, y: 10, len: 5}, {x: 25, y: 15, len: 7}, {x: 35, y: 8, len: 6},
                    {x: 45, y: 12, len: 4}, {x: 55, y: 18, len: 8}, {x: 65, y: 5, len: 5},
                    {x: 75, y: 14, len: 6}, {x: 85, y: 9, len: 7}, {x: 95, y: 16, len: 5},
                    {x: 105, y: 11, len: 6}, {x: 20, y: 20, len: 4}, {x: 40, y: 22, len: 5},
                    {x: 60, y: 19, len: 7}, {x: 80, y: 23, len: 6}, {x: 100, y: 17, len: 5}
                ];
                for (let grass of grassPositions) {
                    const grassX = characterStartX + grass.x;
                    const grassY = characterStartY + skyHeight + grass.y;
                    ctx.beginPath();
                    ctx.moveTo(grassX, grassY);
                    ctx.lineTo(grassX, grassY + grass.len);
                    ctx.stroke();
                }
                
                // 绘制几朵白云
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                // 云1
                ctx.beginPath();
                ctx.arc(characterStartX + 30, characterStartY + 30, 12, 0, Math.PI * 2);
                ctx.arc(characterStartX + 42, characterStartY + 30, 15, 0, Math.PI * 2);
                ctx.arc(characterStartX + 54, characterStartY + 30, 12, 0, Math.PI * 2);
                ctx.fill();
                
                // 云2
                ctx.beginPath();
                ctx.arc(characterStartX + 80, characterStartY + 50, 10, 0, Math.PI * 2);
                ctx.arc(characterStartX + 90, characterStartY + 50, 12, 0, Math.PI * 2);
                ctx.arc(characterStartX + 100, characterStartY + 50, 10, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制边框
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.strokeRect(characterStartX, characterStartY, characterWidth, characterDisplayHeight);
                
                // 绘制角色模型（绘制火柴人）
                const scale = 7; // 再增大比例
                const baseX = characterStartX + characterWidth / 2; // 人物居中于白色背景
                const baseY = characterStartY + characterDisplayHeight / 2;
                
                ctx.save();
                ctx.translate(baseX, baseY);
                
                // 绘制火柴人（黑色）
                ctx.strokeStyle = '#000';
                ctx.fillStyle = '#000';
                ctx.lineWidth = 4; // 再加粗线条
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // 头部（圆形）
                ctx.beginPath();
                ctx.arc(0, -25 * scale / 3, 6 * scale / 3, 0, Math.PI * 2);
                ctx.stroke();
                
                // 身体（竖线）
                ctx.beginPath();
                ctx.moveTo(0, -19 * scale / 3);
                ctx.lineTo(0, 5 * scale / 3);
                ctx.stroke();
                
                // 左臂
                ctx.beginPath();
                ctx.moveTo(0, -15 * scale / 3);
                ctx.lineTo(-8 * scale / 3, -5 * scale / 3);
                ctx.stroke();
                
                // 右臂
                ctx.beginPath();
                ctx.moveTo(0, -15 * scale / 3);
                ctx.lineTo(8 * scale / 3, -5 * scale / 3);
                ctx.stroke();
                
                // 左腿
                ctx.beginPath();
                ctx.moveTo(0, 5 * scale / 3);
                ctx.lineTo(-6 * scale / 3, 20 * scale / 3);
                ctx.stroke();
                
                // 右腿
                ctx.beginPath();
                ctx.moveTo(0, 5 * scale / 3);
                ctx.lineTo(6 * scale / 3, 20 * scale / 3);
                ctx.stroke();
                
                ctx.restore();
                
                // 绘制装备提示（如果有装备）
                const hasEquipment = gameState.inventory.equipmentSlots.helmet.item ||
                                    gameState.inventory.equipmentSlots.chestplate.item ||
                                    gameState.inventory.equipmentSlots.leggings.item ||
                                    gameState.inventory.equipmentSlots.boots.item;
                
                if (hasEquipment) {
                    ctx.fillStyle = '#666';
                    ctx.font = '10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('(装备效果)', baseX, characterStartY + characterDisplayHeight - 5);
                    ctx.textAlign = 'left';
                }
                
                // === 绘制背包栏（右侧） ===
                const backpackStartX = panelStartX + equipmentWidth + characterWidth + sectionSpacing + 2 + sectionSpacing; // 左黑线后 + 间距
                const backpackStartY = panelStartY;
                
                // 绘制背包格子（前4排）
                for (let row = 0; row < 4; row++) {
                    for (let col = 0; col < cols; col++) {
                        const index = row * cols + col;
                        const slot = gameState.inventory.backpackSlots[index];
                        const x = backpackStartX + col * (slotSize + slotSpacing);
                        const y = backpackStartY + row * (slotSize + slotSpacing);
                        
                        // 检查是否是拖动源（左键拖动会让格子变空，右键分离不会）
                        const isDragSource = gameState.draggedItem && 
                                            gameState.draggedItem.sourceType !== 'rightClickSplit' &&
                                            gameState.draggedItem.sourceType === 'backpack' && 
                                            gameState.draggedItem.sourceIndex === index;
                        
                        // 检查是否是背包界面高亮的格子
                        const isHighlighted = gameState.inventoryHighlight.type === 'backpack' && 
                                             gameState.inventoryHighlight.index === index;
                        
                        // 绘制格子背景（高亮的格子使用白色背景）
                        if (isHighlighted) {
                            ctx.fillStyle = '#888'; // 浅灰色背景表示高亮
                        } else {
                            ctx.fillStyle = '#333';
                        }
                        ctx.fillRect(x, y, slotSize, slotSize);
                        
                        // 绘制格子边框（高亮的格子使用白色边框）
                        if (isHighlighted) {
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 3;
                        } else {
                            ctx.strokeStyle = '#666';
                            ctx.lineWidth = 2;
                        }
                        ctx.strokeRect(x, y, slotSize, slotSize);
                        
                        // 绘制物品图标（如果不是拖动源）
                        if (slot && slot.item && itemIcons[slot.item] && !isDragSource) {
                            const icon = itemIcons[slot.item];
                            const iconSize = 32;
                            const iconX = x + (slotSize - iconSize) / 2;
                            const iconY = y + (slotSize - iconSize) / 2;
                            ctx.drawImage(icon, iconX, iconY, iconSize, iconSize);
                            
                            // 绘制数量
                            if (slot.count > 1) {
                                ctx.fillStyle = '#fff';
                                ctx.strokeStyle = '#000';
                                ctx.lineWidth = 3;
                                ctx.font = 'bold 14px monospace';
                                ctx.textAlign = 'right';
                                ctx.textBaseline = 'bottom';
                                ctx.strokeText(slot.count.toString(), x + slotSize - 4, y + slotSize - 4);
                                ctx.fillText(slot.count.toString(), x + slotSize - 4, y + slotSize - 4);
                            }
                        }
                    }
                }
                
                // 绘制分隔线
                const separatorY = backpackStartY + 4 * (slotSize + slotSpacing) + 10;
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(backpackStartX, separatorY);
                ctx.lineTo(backpackStartX + backpackWidth, separatorY);
                ctx.stroke();
                
                // 绘制热键栏（第5排）
                const hotbarY = separatorY + 20;
                for (let i = 0; i < 10; i++) {
                    const slot = gameState.inventory.slots[i];
                    const x = backpackStartX + i * (slotSize + slotSpacing);
                    const y = hotbarY;
                    
                    // 检查是否是拖动源（左键拖动会让格子变空，右键分离不会）
                    const isDragSource = gameState.draggedItem && 
                                        gameState.draggedItem.sourceType !== 'rightClickSplit' &&
                                        gameState.draggedItem.sourceType === 'hotbar' && 
                                        gameState.draggedItem.sourceIndex === i;
                    
                    // 检查是否是背包界面高亮的格子
                    const isHighlighted = gameState.inventoryHighlight.type === 'hotbar' && 
                                         gameState.inventoryHighlight.index === i;
                    
                    // 绘制格子背景（高亮的格子使用白色背景）
                    if (isHighlighted) {
                        ctx.fillStyle = '#888'; // 浅灰色背景表示高亮
                    } else {
                        ctx.fillStyle = '#333';
                    }
                    ctx.fillRect(x, y, slotSize, slotSize);
                    
                    // 绘制格子边框（高亮的格子使用白色边框）
                    if (isHighlighted) {
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 3;
                    } else {
                        ctx.strokeStyle = '#666';
                        ctx.lineWidth = 2;
                    }
                    ctx.strokeRect(x, y, slotSize, slotSize);
                    
                    // 绘制物品图标（如果不是拖动源）
                    if (slot && slot.item && itemIcons[slot.item] && !isDragSource) {
                        const icon = itemIcons[slot.item];
                        const iconSize = 32;
                        const iconX = x + (slotSize - iconSize) / 2;
                        const iconY = y + (slotSize - iconSize) / 2;
                        ctx.drawImage(icon, iconX, iconY, iconSize, iconSize);
                        
                        // 绘制数量
                        if (slot.count > 1) {
                            ctx.fillStyle = '#fff';
                            ctx.strokeStyle = '#000';
                            ctx.lineWidth = 3;
                            ctx.font = 'bold 14px monospace';
                            ctx.textAlign = 'right';
                            ctx.textBaseline = 'bottom';
                            ctx.strokeText(slot.count.toString(), x + slotSize - 4, y + slotSize - 4);
                            ctx.fillText(slot.count.toString(), x + slotSize - 4, y + slotSize - 4);
                        }
                    }
                    
                    // 绘制数字标签
                    ctx.fillStyle = '#aaa';
                    ctx.font = '12px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText((i + 1) % 10, x + 2, y + 2);
                }
                
                // === 绘制合成栏（背包右侧，在大灰框内） ===
                const craftingStartX = backpackStartX + backpackWidth + sectionSpacing + 2 + sectionSpacing + 10; // 右黑线后 + 间距 + 额外10px向右
                const craftingStartY = backpackStartY + 20; // 与背包顶部对齐
                const craftingSlotSize = 45; // 合成格子稍小
                const craftingSpacing = 5;
                
                // 绘制合成栏标题
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('合成', craftingStartX + craftingSlotSize + craftingSpacing / 2, craftingStartY - 15);
                ctx.textAlign = 'left';
                
                // 绘制2x2合成格子
                for (let row = 0; row < 2; row++) {
                    for (let col = 0; col < 2; col++) {
                        const index = row * 2 + col;
                        const slot = gameState.inventory.craftingSlots[index];
                        const x = craftingStartX + col * (craftingSlotSize + craftingSpacing);
                        const y = craftingStartY + row * (craftingSlotSize + craftingSpacing);
                        
                        // 检查是否是拖动源（左键拖动会让格子变空，右键分离不会）
                        const isDragSource = gameState.draggedItem && 
                                            gameState.draggedItem.sourceType !== 'rightClickSplit' &&
                                            gameState.draggedItem.sourceType === 'crafting' && 
                                            gameState.draggedItem.sourceIndex === index;
                        
                        // 检查是否是背包界面高亮的格子
                        const isHighlighted = gameState.inventoryHighlight.type === 'crafting' && 
                                             gameState.inventoryHighlight.index === index;
                        
                        // 绘制格子背景（高亮的格子使用白色背景）
                        if (isHighlighted) {
                            ctx.fillStyle = '#666'; // 浅灰色背景表示高亮
                        } else {
                            ctx.fillStyle = '#3a3a3a';
                        }
                        ctx.fillRect(x, y, craftingSlotSize, craftingSlotSize);
                        
                        // 绘制格子边框（高亮的格子使用白色边框）
                        if (isHighlighted) {
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 3;
                        } else {
                            ctx.strokeStyle = '#777';
                            ctx.lineWidth = 2;
                        }
                        ctx.strokeRect(x, y, craftingSlotSize, craftingSlotSize);
                        
                        // 绘制物品图标（如果不是拖动源）
                        if (slot && slot.item && itemIcons[slot.item] && !isDragSource) {
                            const icon = itemIcons[slot.item];
                            const iconSize = 28;
                            const iconX = x + (craftingSlotSize - iconSize) / 2;
                            const iconY = y + (craftingSlotSize - iconSize) / 2;
                            ctx.drawImage(icon, iconX, iconY, iconSize, iconSize);
                            
                            // 绘制数量
                            if (slot.count > 1) {
                                ctx.fillStyle = '#fff';
                                ctx.strokeStyle = '#000';
                                ctx.lineWidth = 2;
                                ctx.font = 'bold 12px monospace';
                                ctx.textAlign = 'right';
                                ctx.textBaseline = 'bottom';
                                ctx.strokeText(slot.count.toString(), x + craftingSlotSize - 3, y + craftingSlotSize - 3);
                                ctx.fillText(slot.count.toString(), x + craftingSlotSize - 3, y + craftingSlotSize - 3);
                            }
                        }
                    }
                }
                
                // 绘制合成按钮（箭头）
                const arrowX = craftingStartX + craftingSlotSize + craftingSpacing / 2;
                const arrowY = craftingStartY + 2 * (craftingSlotSize + craftingSpacing) + 20; // 从 +10 改为 +20
                const arrowSize = 20;
                const arrowButtonSize = 30; // 按钮的可点击区域
                
                // 检查鼠标是否悬停在箭头按钮上
                const arrowMouseX = gameState.mouse.screenX;
                const arrowMouseY = gameState.mouse.screenY;
                const isHoveringArrow = arrowMouseX >= arrowX - arrowButtonSize / 2 && 
                                       arrowMouseX <= arrowX + arrowButtonSize / 2 && 
                                       arrowMouseY >= arrowY - arrowSize - 5 && 
                                       arrowMouseY <= arrowY + 5;
                
                // 绘制按钮背景（悬停时高亮）
                if (isHoveringArrow) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.fillRect(arrowX - arrowButtonSize / 2, arrowY - arrowSize - 5, arrowButtonSize, arrowSize + 10);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(arrowX - arrowButtonSize / 2, arrowY - arrowSize - 5, arrowButtonSize, arrowSize + 10);
                }
                
                // 绘制箭头（悬停时变亮）
                ctx.fillStyle = isHoveringArrow ? '#fff' : '#aaa';
                ctx.beginPath();
                // 箭头主体（三角形）
                ctx.moveTo(arrowX, arrowY);
                ctx.lineTo(arrowX - arrowSize / 2, arrowY - arrowSize / 2);
                ctx.lineTo(arrowX + arrowSize / 2, arrowY - arrowSize / 2);
                ctx.closePath();
                ctx.fill();
                
                // 箭头杆
                ctx.fillRect(arrowX - 3, arrowY - arrowSize, 6, arrowSize / 2);
                
                // 绘制合成输出格子
                const outputX = craftingStartX + (craftingSlotSize + craftingSpacing) / 2;
                const outputY = arrowY + 20; // 从 +15 改为 +20，增加箭头和输出框之间的间距
                const outputSlot = gameState.inventory.craftingOutput;
                
                // 检查是否是拖动源
                const isOutputDragSource = gameState.draggedItem && 
                                          gameState.draggedItem.sourceType === 'craftingOutput';
                
                // 绘制输出格子背景（稍微亮一点表示这是输出）
                ctx.fillStyle = '#4a4a4a';
                ctx.fillRect(outputX, outputY, craftingSlotSize, craftingSlotSize);
                
                // 绘制输出格子边框（金色表示输出）
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.strokeRect(outputX, outputY, craftingSlotSize, craftingSlotSize);
                
                // 绘制物品图标（如果不是拖动源）
                if (outputSlot && outputSlot.item && itemIcons[outputSlot.item] && !isOutputDragSource) {
                    const icon = itemIcons[outputSlot.item];
                    const iconSize = 28;
                    const iconX = outputX + (craftingSlotSize - iconSize) / 2;
                    const iconY = outputY + (craftingSlotSize - iconSize) / 2;
                    ctx.drawImage(icon, iconX, iconY, iconSize, iconSize);
                    
                    // 绘制数量
                    if (outputSlot.count > 1) {
                        ctx.fillStyle = '#fff';
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 2;
                        ctx.font = 'bold 12px monospace';
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'bottom';
                        ctx.strokeText(outputSlot.count.toString(), outputX + craftingSlotSize - 3, outputY + craftingSlotSize - 3);
                        ctx.fillText(outputSlot.count.toString(), outputX + craftingSlotSize - 3, outputY + craftingSlotSize - 3);
                    }
                }
                
                // === 绘制鼠标悬停提示 ===
                const mouseX = gameState.mouse.screenX;
                const mouseY = gameState.mouse.screenY;
                
                // 检查合成栏悬停
                for (let row = 0; row < 2; row++) {
                    for (let col = 0; col < 2; col++) {
                        const index = row * 2 + col;
                        const slot = gameState.inventory.craftingSlots[index];
                        const x = craftingStartX + col * (craftingSlotSize + craftingSpacing);
                        const y = craftingStartY + row * (craftingSlotSize + craftingSpacing);
                        
                        if (mouseX >= x && mouseX <= x + craftingSlotSize && mouseY >= y && mouseY <= y + craftingSlotSize) {
                            if (slot && slot.item) {
                                const itemType = ITEM_TYPES[slot.item];
                                if (itemType) {
                                    renderInventoryTooltip(itemType.name, mouseX, mouseY);
                                }
                            }
                            break;
                        }
                    }
                }
                
                // 检查合成输出悬停
                if (mouseX >= outputX && mouseX <= outputX + craftingSlotSize && 
                    mouseY >= outputY && mouseY <= outputY + craftingSlotSize) {
                    if (outputSlot && outputSlot.item) {
                        const itemType = ITEM_TYPES[outputSlot.item];
                        if (itemType) {
                            renderInventoryTooltip(itemType.name, mouseX, mouseY);
                        }
                    }
                }
                
                // 检查装备栏悬停
                for (let equipSlot of equipmentSlotPositions) {
                    const x = equipSlot.x;

        // 处理合成按钮点击
        function handleCraftingButtonClick() {
            console.log('合成按钮被点击！');
            
            // 获取合成栏的4个格子 [1-1, 1-2, 2-1, 2-2]
            const craftingSlots = gameState.inventory.craftingSlots;
            
            // 遍历所有配方，查找匹配的配方
            for (let recipe of CRAFTING_RECIPES) {
                if (checkRecipeMatch(craftingSlots, recipe)) {
                    // 找到匹配的配方，执行合成
                    executeCrafting(craftingSlots, recipe);
                    console.log(`合成成功: ${recipe.name}`);
                    return true;

            }
            
            console.log('没有找到匹配的配方');

        // 处理合成按钮长按（连续合成）
        function handleCraftButtonHold() {
            if (!gameState.craftButtonHold.active) {
                return;
            }
            
            const currentTime = performance.now();
            const holdDuration = currentTime - gameState.craftButtonHold.startTime;
            
            // 计算当前应该的合成间隔（与右键分离相同的速率逻辑）
            // 第1秒(0.5-1.5秒): 250ms间隔
            // 第2秒(1.5-2.5秒): 62.5ms间隔 (翻4倍)
            // 第3秒(2.5-3.5秒): 15.625ms间隔 (再翻4倍)
            // 以此类推
            const secondsPassed = Math.floor(holdDuration / 1000);
            const baseInterval = 250; // 第1秒的基础间隔
            const currentInterval = baseInterval / Math.pow(4, secondsPassed); // 每秒翻4倍
            
            // 检查是否到了合成时间
            const timeSinceLastCraft = currentTime - gameState.craftButtonHold.lastCraftTime;
            if (timeSinceLastCraft < currentInterval) {
                return;
            }
            
            // 尝试执行合成
            const success = handleCraftingButtonClick();
            
            if (success) {
                // 合成成功，更新上次合成时间
                gameState.craftButtonHold.lastCraftTime = currentTime;
            } else {
                // 合成失败（材料不足或没有匹配配方），停止长按
                gameState.craftButtonHold.active = false;
            }
        }
        
        // 检查配方是否匹配
        function checkRecipeMatch(craftingSlots, recipe) {
            if (recipe.exactPosition) {
                // 精确位置匹配
                for (let i = 0; i < 4; i++) {
                    const slot = craftingSlots[i];
                    const required = recipe.input[i];
                    
                    if (required === null) {
                        // 该位置可以为空或任意物品
                        continue;
                    }
                    
                    if (!slot.item || slot.item !== required.item || slot.count < required.count) {
                        return false;
                    }
                }
                return true;
            } else {
                // 非精确位置匹配：只要有对应的物品即可
                const requiredItems = recipe.input.filter(item => item !== null);
                
                for (let required of requiredItems) {
                    let found = false;
                    for (let slot of craftingSlots) {
                        if (slot.item === required.item && slot.count >= required.count) {
                            found = true;
                            break;
                        }
                    }
                    if (!found) {
                        return false;
                    }
                }
                return true;
            }
        }
        
        // 执行合成
        function executeCrafting(craftingSlots, recipe) {
            // 消耗材料（优先顺序：1-1, 1-2, 2-1, 2-2）
            const requiredItems = recipe.input.filter(item => item !== null);
            
            for (let required of requiredItems) {
                let remaining = required.count;
                
                // 按优先顺序消耗
                for (let i = 0; i < 4 && remaining > 0; i++) {
                    const slot = craftingSlots[i];
                    if (slot.item === required.item) {
                        const consume = Math.min(slot.count, remaining);
                        slot.count -= consume;
                        remaining -= consume;
                        
                        if (slot.count === 0) {
                            slot.item = null;
                        }
                    }
                }
            }
            
            // 生成输出物品
            const outputSlot = gameState.inventory.craftingOutput;
            if (outputSlot.item === recipe.output.item) {
                // 输出格子已有相同物品，增加数量
                outputSlot.count += recipe.output.count;
            } else {
                // 输出格子为空或不同物品，直接放入
                outputSlot.item = recipe.output.item;
                outputSlot.count = recipe.output.count;
            }
        }

                const x = backpackStartX + i * (slotSize + slotSpacing);
                const y = hotbarY;
                
                if (mouseX >= x && mouseX <= x + slotSize && mouseY >= y && mouseY <= y + slotSize) {
                    const slot = gameState.inventory.slots[i];
                    if (slot.item && slot.count >= 1) {
                        // 分离一个物品
                        if (splitOneItem(slot, 'hotbar', i)) {
                            // 初始化长按状态
                            gameState.rightClickHold = {
                                active: true,
                                startTime: currentTime,
                                lastSplitTime: currentTime,
                                slotType: 'hotbar',
                                slotIndex: i,

        // 更新右键长按状态（在游戏循环中调用）
        function updateRightClickHold() {
            if (!gameState.rightClickHold.active || !gameState.inventoryOpen) {
                return;
            }
            
            const currentTime = performance.now();
            const holdDuration = currentTime - gameState.rightClickHold.startTime;
            
            // 0.5秒内不做任何事
            if (holdDuration < 500) {
                return;
            }
            
            // 计算当前应该的分离间隔
            // 第1秒(0.5-1.5秒): 250ms间隔
            // 第2秒(1.5-2.5秒): 62.5ms间隔 (翻4倍)
            // 第3秒(2.5-3.5秒): 15.625ms间隔 (再翻4倍)
            // 以此类推
            const secondsPassed = Math.floor(holdDuration / 1000);
            const baseInterval = 250; // 第1秒的基础间隔
            const currentInterval = baseInterval / Math.pow(4, secondsPassed); // 每秒翻4倍
            
            // 检查是否到了分离时间
            const timeSinceLastSplit = currentTime - gameState.rightClickHold.lastSplitTime;
            if (timeSinceLastSplit < currentInterval) {
                return;
            }
            
            // 获取对应的格子
            const slotType = gameState.rightClickHold.slotType;
            const slotIndex = gameState.rightClickHold.slotIndex;
            let slot = null;
            
            if (slotType === 'crafting') {
                slot = gameState.inventory.craftingSlots[slotIndex];
            } else if (slotType === 'equipment') {
                slot = gameState.inventory.equipmentSlots[slotIndex];
            } else if (slotType === 'backpack') {
                slot = gameState.inventory.backpackSlots[slotIndex];
            } else if (slotType === 'hotbar') {
                slot = gameState.inventory.slots[slotIndex];
            }
            
            // 如果格子没有物品了，停止
            if (!slot || !slot.item || slot.count < 1) {
                gameState.rightClickHold.active = false;
                return;
            }
            
            // 如果拖动的物品类型不匹配，停止
            if (gameState.draggedItem && gameState.draggedItem.item !== slot.item) {
                gameState.rightClickHold.active = false;
                return;
            }
            
            // 分离一个物品
            if (gameState.draggedItem) {
                gameState.draggedItem.count += 1;
            } else {
                gameState.draggedItem = {
                    item: slot.item,
                    count: 1,
                    sourceType: 'rightClickSplit',
                    sourceIndex: slotIndex,
                    originalType: slotType
                };
            }
            
            slot.count -= 1;
            if (slot.count === 0) {
                slot.item = null;
                gameState.rightClickHold.active = false;
            }
            
            gameState.rightClickHold.lastSplitTime = currentTime;
        }
        
        // 处理背包界面鼠标松开（放下物品）

        // 渲染玩家手持物品（包括静态手臂）
        function renderHeldItem() {
            if (!gameState.player) return;
            
            const selectedSlot = gameState.inventory.slots[gameState.inventory.selectedSlot];
            if (!selectedSlot.item) return;
            
            const itemType = ITEM_TYPES[selectedSlot.item];
            if (!itemType) return;
            
            const icon = itemIcons[selectedSlot.item];
            if (!icon) return;
            
            // 玩家参数
            const playerCenterX = gameState.player.x + gameState.player.width / 2;
            const playerY = gameState.player.y;
            const facingRight = gameState.player.facingRight;
            
            // 获取玩家动画状态用于同步抖动
            const animTimer = gameState.player.animationTimer;
            const currentAnim = gameState.player.currentAnimation;
            
            // 计算抖动偏移（idle时轻微抖动）
            let bobOffset = 0;
            if (currentAnim === 'idle') {
                // 与玩家idle动画同步的轻微抖动
                bobOffset = Math.sin((animTimer / 1000) * Math.PI * 2 / 3) * 0.8;
            }
            
            // 挖掘动画参数
            // 只要按下鼠标且持有工具就挥舞镐子（不需要指定方块）
            // 或者正在挥舞水桶
            const isMining = gameState.mouse.isDown && itemType.type === 'tool';
            const isSwinging = gameState.toolSwing.active;
            
            // 玩家身体中点（圆心）
            const bodyBaseY = 2;
            const bodyCenterY = playerY + bodyBaseY + 17 + bobOffset; // 肩膀位置作为身体中点
            
            // 手臂总长度（半径）
            const upperArmLength = 8;
            const lowerArmLength = 8;
            const totalArmLength = upperArmLength + lowerArmLength; // 16像素
            
            if ((isMining && itemType.type === 'tool') || isSwinging) {
                // 挖掘/挥舞动画：以玩家身体中点为圆心，做圆弧运动
                // 从右上方挥到右下方（面向右时）
                let t;
                if (isSwinging) {
                    // 水桶挥舞：使用toolSwing计时器
                    t = 1 - (gameState.toolSwing.timer / gameState.toolSwing.duration);
                } else {
                    // 挖掘动画：使用mining计时器
                    const miningCycle = 550; // 550ms，让动作更慢更有力
                    t = (gameState.mining.animationTimer % miningCycle) / miningCycle;
                }
                
                // 圆弧角度：从-60度（右上方）挥到60度（右下方）
                // 这里的角度是相对于水平向右的角度
                // -60度 = 右上方，0度 = 水平向右，60度 = 右下方
                const startAngle = -60; // 起始角度（右上方）
                const endAngle = 60;    // 结束角度（右下方）
                const swingAngle = startAngle + (Math.sin(t * Math.PI * 2 - Math.PI / 2) + 1) / 2 * (endAngle - startAngle);
                
                // 将角度转换为弧度
                const angleRad = (swingAngle * Math.PI) / 180;
                
                // 计算手部位置（以身体中点为圆心，totalArmLength为半径）
                // 面向右时：x = centerX + cos(angle) * radius, y = centerY + sin(angle) * radius
                const handX = playerCenterX + Math.cos(angleRad) * totalArmLength * (facingRight ? 1 : -1);
                const handY = bodyCenterY + Math.sin(angleRad) * totalArmLength;
                
                // 计算肘部位置（在肩膀和手之间，距离肩膀upperArmLength）
                const shoulderX = playerCenterX;
                const shoulderY = bodyCenterY;
                
                const dx = handX - shoulderX;
                const dy = handY - shoulderY;
                const distToHand = Math.sqrt(dx * dx + dy * dy);
                
                const elbowX = shoulderX + (dx / distToHand) * upperArmLength;
                const elbowY = shoulderY + (dy / distToHand) * upperArmLength;
                
                // 计算物品旋转角度（镐柄沿手臂方向）
                // 面向左时需要翻转180度，让镐头朝外
                let itemRotation = Math.atan2(dy, dx) * 180 / Math.PI;
                if (!facingRight) {
                    itemRotation += 180; // 向左时翻转180度
                }
                
                // 转换为屏幕坐标并绘制
                const screenShoulderX = shoulderX - gameState.camera.x;
                const screenShoulderY = shoulderY - gameState.camera.y;
                const screenElbowX = elbowX - gameState.camera.x;
                const screenElbowY = elbowY - gameState.camera.y;
                const screenHandX = handX - gameState.camera.x;
                const screenHandY = handY - gameState.camera.y;
                
                // 绘制手臂
                ctx.save();
                ctx.strokeStyle = '#000000';
                ctx.fillStyle = '#000000';
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // 上臂
                ctx.beginPath();
                ctx.moveTo(screenShoulderX, screenShoulderY);
                ctx.lineTo(screenElbowX, screenElbowY);
                ctx.stroke();
                
                // 下臂
                ctx.beginPath();
                ctx.moveTo(screenElbowX, screenElbowY);
                ctx.lineTo(screenHandX, screenHandY);
                ctx.stroke();
                
                // 肘关节
                ctx.beginPath();
                ctx.arc(screenElbowX, screenElbowY, 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                
                // 绘制手持物品
                let itemSize = 20;
                if (selectedSlot.item === 'copperPickaxe' || selectedSlot.item === 'copperAxe') {
                    itemSize = 30;
                }
                
                ctx.save();
                ctx.translate(screenHandX, screenHandY);
                ctx.rotate((itemRotation * Math.PI) / 180);
                
                // 铜斧需要水平翻转（因为斧刃是不对称的）
                if (selectedSlot.item === 'copperAxe' && !facingRight) {
                    ctx.scale(-1, 1); // 水平翻转
                }
                
                ctx.drawImage(icon, -itemSize / 2, -itemSize / 2, itemSize, itemSize);
                ctx.restore();
                
                return; // 挖掘时使用特殊绘制，直接返回
            }
            
            // === 待机姿势（非挖掘状态）===
            let shoulderAngle = 25; // 待机姿势：大臂向前25度
            let elbowAngle = 40; // 待机姿势：小臂40度（相对于垂直方向）
            
            // 手臂参数（与sprite生成中的参数一致）
            const baseY = 2;
            const shoulderY = playerY + baseY + 17 + bobOffset;
            const lineWidth = 2.5;
            
            // 计算肘部位置
            let shoulderX = playerCenterX;
            let elbowX = shoulderX + Math.sin((shoulderAngle * Math.PI) / 180) * upperArmLength;
            let elbowY = shoulderY + Math.cos((shoulderAngle * Math.PI) / 180) * upperArmLength;
            
            // 计算手部位置
            let handX = elbowX + Math.sin((elbowAngle * Math.PI) / 180) * lowerArmLength;
            let handY = elbowY + Math.cos((elbowAngle * Math.PI) / 180) * lowerArmLength;
            
            // 计算物品旋转角度（镐柄沿小臂方向，作为小臂延长）
            let itemRotation = elbowAngle; // 镐柄沿小臂方向
            
            // 如果面向左，镜像手臂位置和旋转
            if (!facingRight) {
                const elbowOffsetFromCenter = elbowX - shoulderX;
                elbowX = shoulderX - elbowOffsetFromCenter;
                
                const handOffsetFromElbow = handX - elbowX;
                handX = elbowX - handOffsetFromElbow;
                
                // 面向左时：镜像角度，镐柄继续沿小臂方向
                itemRotation = -elbowAngle;
            }
            
            // 转换为屏幕坐标
            const screenShoulderX = shoulderX - gameState.camera.x;
            const screenShoulderY = shoulderY - gameState.camera.y;
            const screenElbowX = elbowX - gameState.camera.x;
            const screenElbowY = elbowY - gameState.camera.y;
            const screenHandX = handX - gameState.camera.x;
            const screenHandY = handY - gameState.camera.y;
            
            // 绘制静态手臂（覆盖原有的摆动手臂）
            ctx.save();
            ctx.strokeStyle = '#000000';
            ctx.fillStyle = '#000000';
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            // 上臂
            ctx.beginPath();
            ctx.moveTo(screenShoulderX, screenShoulderY);
            ctx.lineTo(screenElbowX, screenElbowY);
            ctx.stroke();
            
            // 下臂
            ctx.beginPath();
            ctx.moveTo(screenElbowX, screenElbowY);
            ctx.lineTo(screenHandX, screenHandY);
            ctx.stroke();
            
            // 肘关节
            ctx.beginPath();
            ctx.arc(screenElbowX, screenElbowY, 1.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // 绘制手持物品（在手部位置，镐柄沿小臂方向）
            let itemSize = 20; // 手持物品基础大小
            
            // 铜镐和铜斧放大1.5倍

        }

        // 使用洪水算法计算光照（所有空气方块作为最亮方块，地下洞穴除外）
        // 优化版本：使用区块处理、循环队列、增量更新、帧间缓存、可见区域裁剪
        function calculateFloodLighting() {
            // 如果有缓存且不需要重新计算，直接返回缓存
            if (gameState.lightMapCache && !gameState.lightMapDirty) {
                return gameState.lightMapCache;
            }
            
            const { width, height, blockSize, terrainBaseY } = WORLD_CONFIG;
            
            // 区块大小（每个区块包含 CHUNK_SIZE x CHUNK_SIZE 个方块）
            const CHUNK_SIZE = 16;
            
            // ========== 关键优化：只计算可见区域 + 边距 ==========
            // 计算可见区域（基于摄像机位置）
            const cameraGridX = Math.floor(gameState.camera.x / blockSize);
            const cameraGridY = Math.floor(gameState.camera.y / blockSize);
            const viewWidth = Math.ceil(canvas.width / blockSize);
            const viewHeight = Math.ceil(canvas.height / blockSize);
            
            // 添加边距（光照需要向外扩散）
            const lightMargin = 40; // 减少光照边距 50->40，平衡性能和视觉效果
            
            // 计算光照计算范围（限制在可见区域 + 边距）
            const viewStartX = Math.max(0, cameraGridX - lightMargin);
            const viewEndX = Math.min(width - 1, cameraGridX + viewWidth + lightMargin);
            const viewStartY = Math.max(0, cameraGridY - lightMargin);
            const viewEndY = Math.min(height - 1, cameraGridY + viewHeight + lightMargin);
            
            // 计算需要更新的区块范围
            const chunkStartX = Math.floor(viewStartX / CHUNK_SIZE);
            const chunkEndX = Math.floor(viewEndX / CHUNK_SIZE);
            const chunkStartY = Math.floor(viewStartY / CHUNK_SIZE);
            const chunkEndY = Math.floor(viewEndY / CHUNK_SIZE);
            
            // 创建光照图（0-1，1为最亮）- 复用旧缓存以减少内存分配
            let lightMap = gameState.lightMapCache;
            if (!lightMap) {
                lightMap = Array(height).fill(null).map(() => Array(width).fill(0));
            }
            
            // 初始化区块脏标记（记录哪些区块需要更新）
            if (!gameState.chunkDirtyMap) {
                const chunksX = Math.ceil(width / CHUNK_SIZE);
                const chunksY = Math.ceil(height / CHUNK_SIZE);
                gameState.chunkDirtyMap = Array(chunksY).fill(null).map(() => Array(chunksX).fill(true));
            }
            
            // ========== 关键修复：标记可见区域的所有区块为脏 ==========
            // 当摄像机移动到新区域时，确保这些区块会被计算
            for (let cy = chunkStartY; cy <= chunkEndY; cy++) {
                for (let cx = chunkStartX; cx <= chunkEndX; cx++) {
                    if (gameState.chunkDirtyMap[cy] && gameState.chunkDirtyMap[cy][cx] === false) {
                        // 如果这个区块之前被标记为"已更新"，但现在在可见区域内
                        // 需要重新标记为脏，确保它会被计算
                        gameState.chunkDirtyMap[cy][cx] = true;
                    }
                }
            }
            
            // 只清空需要更新的区块
            for (let cy = chunkStartY; cy <= chunkEndY; cy++) {
                for (let cx = chunkStartX; cx <= chunkEndX; cx++) {
                    if (gameState.chunkDirtyMap[cy] && gameState.chunkDirtyMap[cy][cx]) {
                        // 清空该区块的光照数据
                        const startX = cx * CHUNK_SIZE;
                        const startY = cy * CHUNK_SIZE;
                        const endX = Math.min(startX + CHUNK_SIZE - 1, width - 1);
                        const endY = Math.min(startY + CHUNK_SIZE - 1, height - 1);
                        
                        for (let y = startY; y <= endY; y++) {
                            for (let x = startX; x <= endX; x++) {
                                lightMap[y][x] = 0;
                            }
                        }
                    }
                }
            }
            
            // 获取当前环境光照强度
            const ambientLight = getAmbientLight();
            
            // 优化2：使用循环队列代替数组shift（避免O(n)操作）
            const queueSize = (viewEndX - viewStartX + 1) * (viewEndY - viewStartY + 1) * 2;
            const queue = new Array(queueSize);
            let queueHead = 0;
            let queueTail = 0;
            
            // 复用visited数组 - 优化：只创建可见区域的visited数组
            const visitedWidth = viewEndX - viewStartX + 1;
            const visitedHeight = viewEndY - viewStartY + 1;
            const visited = Array(visitedHeight).fill(null).map(() => Array(visitedWidth).fill(false));
            
            // 第一步：找到所有地表空气方块（没有洞穴背景墙的空气方块）作为光源
            // 优化3：只扫描需要更新的区块
            for (let cy = chunkStartY; cy <= chunkEndY; cy++) {
                for (let cx = chunkStartX; cx <= chunkEndX; cx++) {
                    // 跳过不需要更新的区块
                    if (gameState.chunkDirtyMap[cy] && !gameState.chunkDirtyMap[cy][cx]) {
                        continue;
                    }
                    
                    // 计算区块内的方块范围
                    const chunkStartBlockX = Math.max(viewStartX, cx * CHUNK_SIZE);
                    const chunkEndBlockX = Math.min(viewEndX, (cx + 1) * CHUNK_SIZE - 1);
                    const chunkStartBlockY = Math.max(viewStartY, cy * CHUNK_SIZE);
                    const chunkEndBlockY = Math.min(viewEndY, (cy + 1) * CHUNK_SIZE - 1);
                    
                    for (let x = chunkStartBlockX; x <= chunkEndBlockX; x++) {
                        for (let y = chunkStartBlockY; y <= chunkEndBlockY; y++) {
                            const block = getBlock(x, y);
                            const hasWall = gameState.wallMap && gameState.wallMap[y] && gameState.wallMap[y][x];
                            
                            // 空气方块且没有洞穴背景墙，或者不阻挡光线的方块（如火把、墓碑）
                            // 注意：水方块不再作为初始光源，让它参与阴影计算
                            const blockType = BLOCK_TYPES[block.id];
                            const isTransparent = (block.id === 'air' && !hasWall) || 
                                                 (blockType && !blockType.blocksLight && block.id !== 'air' && block.id !== 'water');
                            
                            if (isTransparent) {
                                lightMap[y][x] = 1.0; // 最亮
                                queue[queueTail++] = { x, y, light: 1.0 };
                                const vx = x - viewStartX;
                                const vy = y - viewStartY;
                                if (vx >= 0 && vx < visitedWidth && vy >= 0 && vy < visitedHeight) {
                                    visited[vy][vx] = true;
                                }
                            }
                        }
                    }
                    
                    // 标记该区块已更新
                    if (gameState.chunkDirtyMap[cy]) {
                        gameState.chunkDirtyMap[cy][cx] = false;
                    }
                }
            }
            
            // 第二步：扫描线洪水填充算法传播光照（优化版）
            // 扫描线算法：按行扫描，减少队列操作，提高缓存命中率
            const straightDecay = 0.2;  // 直线衰减（从 0.04 增加到 0.2，衰减更快）
            const diagonalDecay = 0.3;  // 对角线衰减（从 0.06 增加到 0.3，衰减更快）
            const solidBlockMultiplier = 0.6;
            const minLightThreshold = 0.02;
            
            // 扫描线结构：{ y, xLeft, xRight, dy, parentLight }
            const scanlineQueue = new Array(queueSize);
            let scanlineHead = 0;
            let scanlineTail = 0;
            
            // 初始化扫描线：为每个光源创建初始扫描线
            for (let i = 0; i < queueTail; i++) {
                const seed = queue[i];
                scanlineQueue[scanlineTail++] = {
                    y: seed.y,
                    xLeft: seed.x,
                    xRight: seed.x,
                    dy: 0,
                    parentLight: seed.light
                };
            }
            
            // 处理扫描线队列
            while (scanlineHead < scanlineTail) {
                const scanline = scanlineQueue[scanlineHead++];
                const { y, xLeft, xRight, dy, parentLight } = scanline;
                
                // 先填充起始区域
                for (let x = xLeft; x <= xRight; x++) {
                    const vx = x - viewStartX;
                    const vy = y - viewStartY;
                    
                    if (vx < 0 || vx >= visitedWidth || vy < 0 || vy >= visitedHeight) continue;
                    if (visited[vy][vx]) continue;
                    
                    const block = getBlock(x, y);
                    if (!block) continue;
                    
                    let newLight = parentLight - straightDecay;
                    const blockType = BLOCK_TYPES[block.id];
                    if (blockType && blockType.blocksLight) {
                        newLight = parentLight * solidBlockMultiplier;
                    } else if (block.id === 'water') {
                        // 水方块特殊处理：衰减减半
                        newLight = parentLight - (straightDecay * 0.5);
                    }
