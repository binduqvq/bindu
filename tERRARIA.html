        // 生成树木（泰拉瑞亚风格）
        async function generateTrees(progressCallback) {
            const { width, height } = WORLD_CONFIG;
            const treeChance = 0.15; // 15% 概率生成树木
            const minTreeSpacing = 3; // 树木之间最小间距
            let treeCount = 0;
            let lastTreeX = -minTreeSpacing; // 上一棵树的 X 坐标
            
            // 遍历地表
            for (let x = 0; x < width; x++) {
                // 检查间距
                if (x - lastTreeX < minTreeSpacing) continue;
                
                // 找到这一列的地表位置
                let surfaceY = -1;
                for (let y = 0; y < height; y++) {
                    const block = getBlock(x, y);
                    if (block && block.id === 'grassDirt') {
                        surfaceY = y;
                        break;
                    }
                }
                
                // 如果没有找到草地，跳过
                if (surfaceY === -1) continue;
                
                // 检查左右是否平整（至少需要三块相连的平整草地）
                // 检查左侧是否有方块（不是空气）
                const leftX = x - 1;
                const rightX = x + 1;
                
                // 边界检查
                if (leftX < 0 || rightX >= width) continue;
                
                // 检查左侧地表高度
                const leftBlock = getBlock(leftX, surfaceY);
                const leftAbove = getBlock(leftX, surfaceY - 1);
                
                // 检查右侧地表高度
                const rightBlock = getBlock(rightX, surfaceY);
                const rightAbove = getBlock(rightX, surfaceY - 1);
                
                // 左右两侧必须都是实心方块（草地或泥土），且上方必须是空气
                const isLeftFlat = leftBlock && (leftBlock.id === 'grassDirt' || leftBlock.id === 'dirt') && 
                                   leftAbove && leftAbove.id === 'air';
                const isRightFlat = rightBlock && (rightBlock.id === 'grassDirt' || rightBlock.id === 'dirt') && 
                                    rightAbove && rightAbove.id === 'air';
                
                // 如果左右任意一侧不平整，跳过
                if (!isLeftFlat || !isRightFlat) continue;
                
                // 随机决定是否生成树木
                if (Math.random() > treeChance) continue;
                
                // 检查上方是否有足够空间（至少需要 8 格高度）
                const requiredHeight = 8;
                let hasSpace = true;
                for (let checkY = surfaceY - requiredHeight; checkY < surfaceY; checkY++) {
                    if (checkY < 0) {
                        hasSpace = false;
                        break;
                    }
                    const checkBlock = getBlock(x, checkY);
                    if (checkBlock && checkBlock.id !== 'air') {
                        hasSpace = false;
                        break;
                    }
                }
                
                if (!hasSpace) continue;
                
                // 生成树木（使用正态分布生成树干高度）
                // 原来：4-6格（均匀分布）
                // 现在：3-7格（正态分布，中心在5）
                const treeHeight = generateTreeHeight();
                const success = generateSingleTree(x, surfaceY, treeHeight);
                
                if (success) {
                    treeCount++;
                    lastTreeX = x;
                }
                
                // 每200棵树更新一次进度
                if (treeCount % 200 === 0 && progressCallback) {
                    const progress = 90 + Math.floor((x / width) * 10);
                    await progressCallback(1, progress, `生成树木... ${treeCount}棵`);
                }
            }
        }
        
        // 生成树干高度（正态分布）
        function generateTreeHeight() {
            // 使用Box-Muller变换生成正态分布随机数
            // 均值：5，标准差：0.8（使得大部分值在3-7之间）
            const mean = 5;
            const stdDev = 0.8;
            
            // Box-Muller变换
            const u1 = Math.random();
            const u2 = Math.random();
            const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            
            // 转换为目标均值和标准差
            let height = Math.round(mean + stdDev * z0);
            
            // 限制在3-7范围内
            height = Math.max(3, Math.min(7, height));
            
            return height;
        }
        
        // 生成单棵树
        function generateSingleTree(x, groundY, height) {
            const { width, height: worldHeight } = WORLD_CONFIG;
            
            // 生成树干
            for (let i = 1; i <= height; i++) {
                const trunkY = groundY - i;
                if (trunkY < 0 || trunkY >= worldHeight) return false;
                
                setBlock(x, trunkY, BLOCK_TYPES.trunk);
            }
            
            // 生成树叶簇（在树顶）
            const leavesY = groundY - height;
            const leavesRadius = 2; // 半径为 2，形成 5x5 的区域
            
            for (let dy = -leavesRadius; dy <= leavesRadius; dy++) {
                for (let dx = -leavesRadius; dx <= leavesRadius; dx++) {
                    const leafX = x + dx;
                    const leafY = leavesY + dy;
                    
                    // 边界检查
                    if (leafX < 0 || leafX >= width || leafY < 0 || leafY >= worldHeight) continue;
                    
                    // 跳过树干位置
                    if (dx === 0 && dy >= 0) continue;
                    
                    // 圆形树冠（使用距离判断）
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > leavesRadius + 0.5) continue;
                    
                    // 检查是否是空气
                    const block = getBlock(leafX, leafY);
                    if (block && block.id === 'air') {
                        setBlock(leafX, leafY, BLOCK_TYPES.leaves);
                    }
                }
            }
            
            // 在树冠顶部额外添加一些树叶（让树冠更圆润）
            const topY = leavesY - leavesRadius;
            if (topY >= 0) {
                const topBlock = getBlock(x, topY);
                if (topBlock && topBlock.id === 'air') {
                    setBlock(x, topY, BLOCK_TYPES.leaves);
                }
            }
            
            return true;
        }
        
        // 获取方块
        function getBlock(x, y) {
            if (x < 0 || x >= WORLD_CONFIG.width || y < 0 || y >= WORLD_CONFIG.height) {
                return null;
            }
            return gameState.worldMap[y][x];
        }
        
        // 生成三级水体生态系统
        async function generateLakes(progressCallback) {
            const { width, height, terrainBaseY } = WORLD_CONFIG;
            const perlin = new PerlinNoise(99999); // 使用独特的种子
            
            // 确保 activeWaterSet 已初始化
            if (typeof activeWaterSet === 'undefined') {
                activeWaterSet = new Set();
            }
            
            // ========== 第一级：地表湖泊（基于 X 轴步进，强行挖坑） ==========
            if (progressCallback) {
                await progressCallback(1, 85, '生成地表湖泊...');
            }
            
            const surfaceLakeProbability = 0.01; // 约 1% 概率
            let surfaceLakeCount = 0;
            
            for (let x = 50; x < width - 50; x++) {
                if (Math.random() < surfaceLakeProbability) {
                    // 找到当前 X 的最高地表 Y 坐标
                    let surfaceY = -1;
                    for (let y = 0; y < height; y++) {
                        const block = getBlock(x, y);
                        if (block && block.id !== 'air') {
                            surfaceY = y;
                            break;
                        }
                    }
                    
                    if (surfaceY === -1 || surfaceY < 10) continue;
                    
                    // ========== 新增：地形平整度检测 ==========
                    // 检查周围地形的高度变化，优先选择平整地表
                    const checkRadius = 20; // 检查范围：左右各20格
                    let heightSum = 0;
                    let heightCount = 0;
                    let minHeight = surfaceY;
                    let maxHeight = surfaceY;
                    
                    // 采样周围地形高度
                    for (let checkX = x - checkRadius; checkX <= x + checkRadius; checkX += 2) {
                        if (checkX < 0 || checkX >= width) continue;
                        
                        // 找到该X坐标的地表高度
                        for (let checkY = 0; checkY < height; checkY++) {
                            const checkBlock = getBlock(checkX, checkY);
                            if (checkBlock && checkBlock.id !== 'air') {
                                heightSum += checkY;
                                heightCount++;
                                minHeight = Math.min(minHeight, checkY);
                                maxHeight = Math.max(maxHeight, checkY);
                                break;
                            }
                        }
                    }
                    
                    // 计算地形平整度（高度差）
                    const heightVariation = maxHeight - minHeight;
                    
                    // 平整度判定：
                    // - 高度差 <= 5：非常平整，100%接受
                    // - 高度差 6-10：较平整，70%接受
                    // - 高度差 11-15：一般，40%接受
                    // - 高度差 16-20：较陡峭，20%接受
                    // - 高度差 > 20：陡峭/裂谷，5%接受（基本拒绝）
                    let acceptProbability = 1.0;
                    if (heightVariation > 20) {
                        acceptProbability = 0.05; // 陡峭地形：5%概率
                    } else if (heightVariation > 15) {
                        acceptProbability = 0.2; // 较陡峭：20%概率
                    } else if (heightVariation > 10) {
                        acceptProbability = 0.4; // 一般：40%概率
                    } else if (heightVariation > 5) {
                        acceptProbability = 0.7; // 较平整：70%概率
                    }
                    // else: 非常平整，100%概率
                    
                    // 根据平整度决定是否生成湖泊
                    if (Math.random() > acceptProbability) {
                        continue; // 地形不够平整，跳过
                    }
                    
                    // 湖泊半径 6~12（缩小）
                    const radius = Math.floor(Math.random() * 7) + 6;
                    
                    // ========== 步骤1：先挖坑（将泥土/草地替换成空气）==========
                    for (let dy = 0; dy <= radius; dy++) { // 只向下挖，不向上
                        for (let dx = -radius; dx <= radius; dx++) {
                            const digX = x + dx;
                            const digY = surfaceY + dy;
                            
                            // 边界检查
                            if (digX < 0 || digX >= width || digY < 0 || digY >= height - 1) continue;
                            
                            // 半圆形判断（向下挖）
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance <= radius) {
                                const block = getBlock(digX, digY);
                                
                                // 只挖掉泥土、草地和石头，不挖空气
                                if (block && (block.id === 'dirt' || block.id === 'grassDirt' || block.id === 'stone')) {
                                    setBlock(digX, digY, BLOCK_TYPES.air);
                                }
                            }
                        }
                    }
                    
                    // ========== 步骤1.5：清理湖泊上方的悬浮物块 ==========
                    // 清理范围：湖泊中心上方完全清理，边缘允许1-2格悬浮
                    const clearanceHeight = 10; // 向上清理10格
                    
                    for (let dy = -clearanceHeight; dy < 0; dy++) { // 只清理上方（dy < 0）
                        for (let dx = -radius; dx <= radius; dx++) {
                            const clearX = x + dx;
                            const clearY = surfaceY + dy;
                            
                            // 边界检查
                            if (clearX < 0 || clearX >= width || clearY < 0 || clearY >= height) continue;
                            
                            // 计算距离中心的水平距离
                            const horizontalDist = Math.abs(dx);
                            const verticalDist = Math.abs(dy);
                            
                            // 清理策略：
                            // 1. 中心区域（水平距离 < radius * 0.6）：完全清理
                            // 2. 边缘区域（水平距离 >= radius * 0.6）：允许保留1-2格悬浮
                            const centerThreshold = radius * 0.6;
                            
                            let shouldClear = false;
                            
                            if (horizontalDist < centerThreshold) {
                                // 中心区域：完全清理
                                shouldClear = true;
                            } else {
                                // 边缘区域：只清理距离地表较近的部分（保留1-2格悬浮）
                                if (verticalDist <= 2) {
                                    // 距离地表2格以内：清理
                                    shouldClear = true;
                                } else {
                                    // 距离地表3格以上：保留（允许悬浮）
                                    shouldClear = false;
                                }
                            }
                            
                            if (shouldClear) {
                                const block = getBlock(clearX, clearY);
                                // 清理泥土、草地、石头、树叶（但保留树干，避免破坏树木结构）
                                if (block && (block.id === 'dirt' || block.id === 'grassDirt' || 
                                             block.id === 'stone' || block.id === 'leaves')) {
                                    setBlock(clearX, clearY, BLOCK_TYPES.air);
                                }
                            }
                        }
                    }
                    
                    // ========== 步骤2：设定下沉水位（湖面比地表低1-2格）==========
                    const lakeSurfaceY = surfaceY + 1 + Math.floor(Math.random() * 2); // 地表下1-2格
                    
                    // ========== 步骤3：在坑里填水（只填充湖面以下的部分）==========
                    for (let dy = 0; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const lakeX = x + dx;
                            const lakeY = surfaceY + dy;
                            
                            // 边界检查
                            if (lakeX < 0 || lakeX >= width || lakeY < 0 || lakeY >= height - 1) continue;
                            
                            // 半圆形判断
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            // 只有当格子在湖面以下（y >= lakeSurfaceY）且在半径范围内时，才填充水
                            if (distance <= radius && lakeY >= lakeSurfaceY) {
                                const block = getBlock(lakeX, lakeY);
                                
                                // 只在空气中填充水
                                if (block && block.id === 'air') {
                                    // 使用 setBlock 正确设置水方块
                                    setBlock(lakeX, lakeY, BLOCK_TYPES.water, 8, true);
                                    
                                    // 唤醒水方块，让它加入流体引擎
                                    wakeUpWaterBlock(lakeX, lakeY, activeWaterSet);
                                    
                                    // 水方块不再设置为完全探索，让它参与光照计算
                                    // （移除了自动设置为最亮的逻辑）
                                }
                            }
                        }
                    }
                    
                    surfaceLakeCount++;
                    
                    // 防重叠跳跃
                    x += 150;
                }
            }
            
            // ========== 第二级：地下暗湖（基于地下容积，只填充空气） ==========
            if (progressCallback) {
                await progressCallback(1, 86, '生成地下暗湖...');
            }
            
            const undergroundArea = width * (height - 256);
            const aquiferDensity = 0.00008;
            const numAquifers = Math.floor(undergroundArea * aquiferDensity);
            
            for (let i = 0; i < numAquifers; i++) {
                // 随机抽取 X 和 Y（深度从 300 到底部，越深权重稍微加大）
                const x = Math.floor(Math.random() * width);
                
                // 使用平方分布让暗湖更倾向于深处
                const depthFactor = Math.pow(Math.random(), 0.7); // 0.7 让分布稍微偏向深处
                const y = Math.floor(300 + depthFactor * (height - 350));
                
                // 半径 4 到 15
                const radius = Math.floor(Math.random() * 12) + 4;
                
                // 新策略：先找到这个区域的洞穴底部，然后从底部向上填充水
                // 扫描这个圆形区域，找到每个 X 坐标的最低空气位置
                const waterColumns = new Map(); // 存储每个 X 坐标的水柱信息
                
                for (let dx = -radius; dx <= radius; dx++) {
                    const scanX = x + dx;
                    if (scanX < 0 || scanX >= width) continue;
                    
                    // 计算这个 X 位置的水平距离（用于椭圆形判断）
                    const horizontalDist = Math.abs(dx) / radius;
                    if (horizontalDist > 1.0) continue;
                    
                    // 从中心 Y 向下扫描，找到第一个实心方块（洞穴底部）
                    let floorY = -1;
                    for (let scanY = y; scanY < Math.min(y + radius + 10, height - 1); scanY++) {
                        const scanBlock = getBlock(scanX, scanY);
                        if (scanBlock && (scanBlock.id === 'stone' || scanBlock.id === 'dirt' || scanBlock.id === 'grassDirt')) {
                            floorY = scanY;
                            break;
                        }
                    }
                    
                    // 如果找到了底部，计算水柱高度
                    if (floorY !== -1) {
                        // 水柱高度：中心最高，边缘最低（椭圆形水面）
                        const maxWaterHeight = Math.floor(radius * 0.4); // 最大水深为半径的40%
                        const waterHeight = Math.floor(maxWaterHeight * (1 - horizontalDist * horizontalDist)); // 抛物线分布
                        
                        if (waterHeight > 0) {
                            waterColumns.set(scanX, {
                                floorY: floorY,
                                waterHeight: waterHeight
                            });
                        }
                    }
                }
                
                // 根据水柱信息填充水
                for (const [scanX, info] of waterColumns) {
                    const { floorY, waterHeight } = info;
                    
                    // 从底部向上填充水
                    for (let dy = 0; dy < waterHeight; dy++) {
                        const waterY = floorY - 1 - dy; // 从底部上方开始
                        
                        if (waterY < 0 || waterY >= height - 1) continue;
                        
                        const block = getBlock(scanX, waterY);
                        
                        // 只在空气中填充水
                        if (block && block.id === 'air') {
                            // 使用 setBlock 正确设置水方块
                            setBlock(scanX, waterY, BLOCK_TYPES.water, 8, true);
                            
                            // 唤醒水方块，让它加入流体引擎
                            wakeUpWaterBlock(scanX, waterY, activeWaterSet);
                        }
                    }
                }
                
                // 每50个暗湖更新一次进度
                if (i % 50 === 0 && progressCallback) {
                    await progressCallback(1, 86, `生成地下暗湖... ${i}/${numAquifers}`);
                }
            }
            
            // ========== 第三级：隐藏小水洞（密闭水囊，等待玩家挖破） ==========
            if (progressCallback) {
                await progressCallback(1, 87, '生成隐藏小水洞...');
            }
            
            const pocketDensity = 0.0002; // 密度比大暗湖高得多
            const numPockets = Math.floor(undergroundArea * pocketDensity);
            
            for (let i = 0; i < numPockets; i++) {
                // 随机抽取 X 和 Y（从地表以下一直到底部）
                const x = Math.floor(Math.random() * width);
                const y = Math.floor(Math.random() * (height - terrainBaseY - 50)) + terrainBaseY + 20;
                
                // 通过柏林噪声形成较小洞穴（半径 2~5）
                const pocketRadius = Math.floor(Math.random() * 4) + 2;
                
                // 遍历该洞穴范围，无条件替换泥土或石头为真水源
                for (let dy = -pocketRadius; dy <= pocketRadius; dy++) {
                    for (let dx = -pocketRadius; dx <= pocketRadius; dx++) {
                        const pocketX = x + dx;
                        const pocketY = y + dy;
                        
                        // 边界检查
                        if (pocketX < 0 || pocketX >= width || pocketY < 0 || pocketY >= height - 1) continue;
                        
                        // 使用柏林噪声创建不规则形状
                        const noiseValue = perlin.octaveNoise(pocketX * 0.3, pocketY * 0.3, 2, 0.5);
                        const threshold = 0.3 - (Math.sqrt(dx * dx + dy * dy) / pocketRadius) * 0.5;
                        
                        if (noiseValue > threshold) {
                            const block = getBlock(pocketX, pocketY);
                            
                            // 无条件替换泥土或石头为真水源（形成密闭水囊）
                            if (block && (block.id === 'dirt' || block.id === 'stone' || block.id === 'grassDirt')) {
                                // 使用 setBlock 正确设置水方块
                                setBlock(pocketX, pocketY, BLOCK_TYPES.water, 8, true);
                                
                                // 唤醒水方块，让它加入流体引擎
                                wakeUpWaterBlock(pocketX, pocketY, activeWaterSet);
                            }
                        }
                    }
                }
                
                // 每100个小水洞更新一次进度
                if (i % 100 === 0 && progressCallback) {
                    await progressCallback(1, 87, `生成隐藏小水洞... ${i}/${numPockets}`);
                }
            }
            
            // ========== 第四级：为一些原来的洞穴里添加一部分水 ==========
            if (progressCallback) {
                await progressCallback(1, 88, '为洞穴添加水...');
            }
            
            const caveWaterProbability = 0.15; // 15% 的洞穴会有水
            let processedCaves = 0;
            
            // 遍历地下区域，寻找洞穴底部
            for (let y = terrainBaseY + 50; y < height - 50; y += 10) {
                for (let x = 10; x < width - 10; x += 10) {
                    const block = getBlock(x, y);
                    
                    // 如果是空气，检查下方是否是实心方块（洞穴底部）
                    if (block && block.id === 'air') {
                        const belowBlock = getBlock(x, y + 1);
                        
                        if (belowBlock && (belowBlock.id === 'stone' || belowBlock.id === 'dirt')) {
                            // 这是一个洞穴底部，随机决定是否添加水
                            if (Math.random() < caveWaterProbability) {
                                // 在这个位置创建一个小水池（半径 2~5，更小）
                                const poolRadius = Math.floor(Math.random() * 4) + 2;
                                const poolDepth = Math.floor(Math.random() * 2) + 1; // 深度 1~2（更浅）
                                
                                for (let dy = 0; dy < poolDepth; dy++) {
                                    for (let dx = -poolRadius; dx <= poolRadius; dx++) {
                                        const poolX = x + dx;
                                        const poolY = y + dy;
                                        
                                        // 边界检查
                                        if (poolX < 0 || poolX >= width || poolY < 0 || poolY >= height - 1) continue;
                                        
                                        // 椭圆形判断
                                        const distance = Math.abs(dx) / poolRadius;
                                        if (distance <= 1.0) {
                                            const poolBlock = getBlock(poolX, poolY);
                                            
                                            // 只在空气中放置水
                                            if (poolBlock && poolBlock.id === 'air') {
                                                // 使用 setBlock 正确设置水方块
                                                setBlock(poolX, poolY, BLOCK_TYPES.water, 8, true);
                                                
                                                // 唤醒水方块，让它加入流体引擎
                                                wakeUpWaterBlock(poolX, poolY, activeWaterSet);
                                            }
                                        }
                                    }
                                }
                                
                                processedCaves++;
                            }
                        }
                    }
                }
                
                // 每100行更新一次进度
                if (y % 100 === 0 && progressCallback) {
                    await progressCallback(1, 88, `为洞穴添加水... ${processedCaves}个水池`);
                }
            }
            
            if (progressCallback) {
                await progressCallback(1, 89, `水体生成完成！地表湖泊: ${surfaceLakeCount}, 地下暗湖: ${numAquifers}, 小水洞: ${numPockets}, 洞穴水池: ${processedCaves}`);
            }
            
            // 调试日志：确认水方块已加入活跃集合
            console.log('Lake generated, activeWaterSet size:', activeWaterSet.size);
            console.log('统计: 地表湖泊:', surfaceLakeCount, '地下暗湖:', numAquifers, '小水洞:', numPockets, '洞穴水池:', processedCaves);
        }

        
        // 设置方块
        function setBlock(x, y, blockType, waterLevel = null, isSource = false) {
            if (x < 0 || x >= WORLD_CONFIG.width || y < 0 || y >= WORLD_CONFIG.height) {
                return;
            }
            
            const blockData = { 
                id: blockType.id, 
                hp: blockType.hp 
            };
            
            // 如果是水方块，添加水位属性和水源属性
            // waterLevel: 1-8（8为满水位）
            // isSource: true 表示真水源（玩家放置或无限水生成），false 表示假水源（流动产生）
            if (blockType.id === 'water') {
                blockData.waterLevel = waterLevel !== null ? waterLevel : 8;
                blockData.isSource = isSource; // 添加水源属性
            }
            
            gameState.worldMap[y][x] = blockData;
            
            // 如果挖掉方块变成空气，标记为已探索区域（永久明亮）
            if (blockType.id === 'air' && gameState.exploredMap) {
                gameState.exploredMap[y][x] = 1; // 1 = 完全探索，永久明亮
            }
            
            // 标记光照图需要重新计算
            gameState.lightMapDirty = true;
            
            // 标记受影响的区块为脏（需要重新计算光照）
            markChunksDirty(x, y);
        }
        
        // 标记受影响的区块为脏
        function markChunksDirty(x, y) {
            const CHUNK_SIZE = 16;
            const LIGHT_RADIUS = 50; // 光照影响半径（与padding一致）
            
            if (!gameState.chunkDirtyMap) {
                const chunksX = Math.ceil(WORLD_CONFIG.width / CHUNK_SIZE);
                const chunksY = Math.ceil(WORLD_CONFIG.height / CHUNK_SIZE);
                gameState.chunkDirtyMap = Array(chunksY).fill(null).map(() => Array(chunksX).fill(true));
            }
            
            // 计算受影响的区块范围（方块修改会影响周围的光照）
            const minX = Math.max(0, x - LIGHT_RADIUS);
            const maxX = Math.min(WORLD_CONFIG.width - 1, x + LIGHT_RADIUS);
            const minY = Math.max(0, y - LIGHT_RADIUS);
            const maxY = Math.min(WORLD_CONFIG.height - 1, y + LIGHT_RADIUS);
            
            const minChunkX = Math.floor(minX / CHUNK_SIZE);
            const maxChunkX = Math.floor(maxX / CHUNK_SIZE);
            const minChunkY = Math.floor(minY / CHUNK_SIZE);
            const maxChunkY = Math.floor(maxY / CHUNK_SIZE);
            
            // 标记所有受影响的区块
            for (let cy = minChunkY; cy <= maxChunkY; cy++) {
                for (let cx = minChunkX; cx <= maxChunkX; cx++) {
                    if (gameState.chunkDirtyMap[cy] && gameState.chunkDirtyMap[cy][cx] !== undefined) {
                        gameState.chunkDirtyMap[cy][cx] = true;
                    }
                }
            }
        }
        
        // 粒子类
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 200; // 随机水平速度
                this.vy = (Math.random() - 0.5) * 200 - 100; // 随机垂直速度（偏向上）
                this.size = Math.random() * 4 + 2; // 2-6 像素
                this.color = color;
                this.life = 1.0; // 生命值 0-1
                this.decay = Math.random() * 0.5 + 0.5; // 衰减速度
                this.gravity = 300; // 重力
            }
            
            update(deltaTime) {
                const dt = deltaTime / 1000;
                
                // 应用速度
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                // 应用重力
                this.vy += this.gravity * dt;
                
                // 衰减生命值
                this.life -= this.decay * dt;
                
                return this.life > 0; // 返回是否还存活
            }
            
            render(ctx, cameraX, cameraY) {
                const screenX = this.x - cameraX;
                const screenY = this.y - cameraY;
                
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(screenX, screenY, this.size, this.size);
                ctx.restore();
            }
        }
        
        // 掉落物类
        class Drop {
            constructor(x, y, blockType) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 100; // 随机水平速度
                this.vy = (Math.random() - 0.5) * 100 - 150; // 随机垂直速度（偏向上）
                this.blockType = blockType;
                this.size = 12; // 掉落物大小（小于方块）
                this.rotation = Math.random() * Math.PI * 2; // 随机旋转
                this.rotationSpeed = (Math.random() - 0.5) * 5; // 旋转速度
                this.gravity = 800; // 重力
                this.friction = 0.98; // 摩擦力
                this.magnetRange = 100; // 吸附范围（像素）
                this.magnetSpeed = 300; // 吸附速度
                this.isGrounded = false; // 是否已落地
                this.floatOffset = 0; // 漂浮偏移
                this.floatSpeed = 2; // 漂浮速度
                this.groundY = 0; // 落地位置
            }
            
            update(deltaTime) {
                const dt = deltaTime / 1000;
                
                // 检查玩家吸附和收集
                if (gameState.player) {
                    const playerCenterX = gameState.player.x + gameState.player.width / 2;
                    const playerCenterY = gameState.player.y + gameState.player.height / 2;
                    const dx = playerCenterX - this.x;
                    const dy = playerCenterY - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // 检查是否与玩家碰撞箱重叠（紧密的收集判定）
                    const collectRange = 16; // 收集范围（缩小到16像素）
                    const isNearPlayer = (
                        this.x >= gameState.player.x - collectRange &&
                        this.x <= gameState.player.x + gameState.player.width + collectRange &&
                        this.y >= gameState.player.y - collectRange &&
                        this.y <= gameState.player.y + gameState.player.height + collectRange
                    );
                    
                    if (isNearPlayer) {
                        // 收集掉落物，添加到物品栏
                        const itemId = this.blockType.id;
                        addItemToInventory(itemId, 1);
                        return false; // 标记为已收集
                    }
                    
                    // 在吸附范围内
                    if (distance < this.magnetRange) {
                        // 吸附到玩家
                        const magnetForce = this.magnetSpeed / Math.max(distance, 1);
                        this.vx += (dx / distance) * magnetForce * dt * 60;
                        this.vy += (dy / distance) * magnetForce * dt * 60;
                        // 吸附时取消落地状态，允许移动
                        this.isGrounded = false;
                    }
                }
                
                const blockSize = WORLD_CONFIG.blockSize;
                
                // 如果已落地，执行漂浮动画
                if (this.isGrounded) {
                    // 漂浮动画：上下缓慢移动
                    this.floatOffset += this.floatSpeed * dt;
                    const floatAmount = Math.sin(this.floatOffset) * 3; // 上下3像素
                    this.y = this.groundY + floatAmount;
                    
                    // 缓慢旋转
                    this.rotation += this.rotationSpeed * 0.3 * dt;
                    
                    // 检查下方是否还有方块支撑
                    const checkGridX = Math.floor(this.x / blockSize);
                    const checkGridY = Math.floor((this.groundY + this.size / 2 + 2) / blockSize);
                    const belowBlock = getBlock(checkGridX, checkGridY);
                    
                    // 如果下方方块消失，重新开始下落
                    if (!belowBlock || belowBlock.id === 'air') {
                        this.isGrounded = false;
                        this.vy = 0; // 从静止开始下落
                    }
                    
                    return true; // 继续存在
                }
                
                // 未落地时的正常物理
                
                // 应用重力
                this.vy += this.gravity * dt;
                
                // 应用摩擦力
                this.vx *= this.friction;
                
                // 优化：先检查当前位置，如果在实心方块内则立即推出
                const currentGridX = Math.floor(this.x / blockSize);
                const currentGridY = Math.floor(this.y / blockSize);
                const currentBlock = getBlock(currentGridX, currentGridY);
                
                if (currentBlock && currentBlock.id !== 'air') {
                    const blockType = BLOCK_TYPES[currentBlock.id];
                    if (blockType && blockType.solid) {
                        // 在实心方块内，推出到上方
                        this.y = currentGridY * blockSize - this.size / 2 - 1;
                        this.vy = 0;
                        this.vx *= 0.5;
                    }
                }
                
                // 水平移动
                const newX = this.x + this.vx * dt;
                const newGridX = Math.floor(newX / blockSize);
                
                // 只在移动到新格子时才检查碰撞
                if (newGridX !== currentGridX) {
                    const checkBlock = getBlock(newGridX, currentGridY);
                    if (checkBlock && checkBlock.id !== 'air') {
                        const blockType = BLOCK_TYPES[checkBlock.id];
                        if (blockType && blockType.solid) {
                            // 碰到墙，停在边界
                            if (this.vx > 0) {
                                this.x = newGridX * blockSize - this.size / 2 - 1;
                            } else {
                                this.x = (newGridX + 1) * blockSize + this.size / 2 + 1;
                            }
                            this.vx = 0; // 停止水平移动
                        } else {
                            this.x = newX; // 没碰撞，正常移动
                        }
                    } else {
                        this.x = newX; // 空气方块，正常移动
                    }
                } else {
                    this.x = newX; // 还在同一格，直接移动
                }
                
                // 垂直移动
                const newY = this.y + this.vy * dt;
                const newGridY = Math.floor((newY + this.size / 2) / blockSize); // 检查底部
                const finalGridX = Math.floor(this.x / blockSize);
                
                // 检查下方是否有方块
                const belowBlock = getBlock(finalGridX, newGridY);
                
                if (belowBlock && belowBlock.id !== 'air') {
                    const blockType = BLOCK_TYPES[belowBlock.id];
                    if (blockType && blockType.solid) {
                        // 落地：停在方块上方
                        const groundLevel = newGridY * blockSize - this.size / 2 - 1;
                        
                        // 确保不会卡进方块
                        if (this.y < groundLevel) {
                            this.y = newY; // 还在下落，继续移动
                        } else {
                            // 已经到达或穿过地面，固定在地面上方
                            this.y = groundLevel;
                            this.groundY = groundLevel;
                            this.vy = 0;
                            this.vx = 0;
                            this.isGrounded = true; // 标记为已落地
                            this.floatOffset = Math.random() * Math.PI * 2; // 随机起始相位
                            this.rotationSpeed *= 0.5; // 减慢旋转
                        }
                    } else {
                        this.y = newY; // 没碰撞，正常移动
                    }
                } else {
                    this.y = newY; // 空气方块，正常移动
                }
                
                // 旋转（未落地时）
                if (!this.isGrounded) {
                    this.rotation += this.rotationSpeed * dt;
                }
                
                return true; // 继续存在
            }
            
            render(ctx, cameraX, cameraY) {
                const screenX = this.x - cameraX;
                const screenY = this.y - cameraY;
                
                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(this.rotation);
                
                // 检查是否有对应的物品图标
                const itemIcon = itemIcons[this.blockType.id];
                
                if (itemIcon) {
                    // 使用物品图标渲染
                    ctx.drawImage(
                        itemIcon,
                        -this.size / 2, -this.size / 2,
                        this.size, this.size
                    );
                } else {
                    // 降级方案：绘制纯色方块
                    ctx.fillStyle = this.blockType.color;
                    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                    
                    // 添加边框
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
                }
                
                ctx.restore();
            }
        }
        
        // 创建粒子爆炸效果（性能优化：减少粒子数量）
        function createParticleExplosion(worldX, worldY, color, count = 8) {
            // 性能优化：限制粒子数量，从15减少到8
            for (let i = 0; i < count; i++) {
                const particle = new Particle(worldX, worldY, color);
                gameState.particles.push(particle);
            }
        }
        
        // 创建掉落物
        function createDrop(gridX, gridY, blockType) {
            const blockSize = WORLD_CONFIG.blockSize;
            const worldX = (gridX + 0.5) * blockSize;
            const worldY = (gridY + 0.5) * blockSize;
            
            // 特殊处理：树叶掉落
            if (blockType.id === 'leaves') {
                const rand = Math.random();
                
                if (rand < 0.03) {
                    // 3% 几率掉落苹果
                    const drop = new Drop(worldX, worldY, { id: 'apple', color: '#E53935' });
                    gameState.drops.push(drop);
                } else if (rand < 0.13) {
                    // 10% 几率掉落橡子 (3% + 10% = 13%)
                    const drop = new Drop(worldX, worldY, { id: 'acorn', color: '#A0826D' });
                    gameState.drops.push(drop);
                } else if (rand < 0.28) {
                    // 15% 几率掉落木棍 (13% + 15% = 28%)
                    const drop = new Drop(worldX, worldY, { id: 'stick', color: '#8B6239' });
                    gameState.drops.push(drop);
                }
                // 否则不掉落任何东西 (72% 几率)
            } else if (blockType.id === 'grassDirt') {
                // 特殊处理：草地掉落泥土
                const drop = new Drop(worldX, worldY, BLOCK_TYPES.dirt);
                gameState.drops.push(drop);
            } else if (blockType.id === 'trunk') {
                // 特殊处理：树干掉落原木
                const drop = new Drop(worldX, worldY, { id: 'log', color: '#A0714F' });
                gameState.drops.push(drop);
            } else {
                // 其他方块正常掉落
                const drop = new Drop(worldX, worldY, blockType);
                gameState.drops.push(drop);
            }
        }
        
        // 添加物品到物品栏
        function addItemToInventory(itemId, count = 1) {
            const itemType = ITEM_TYPES[itemId];
            if (!itemType) return false;
            
            // 如果物品可堆叠，尝试堆叠到现有格子
            if (itemType.stackable) {
                for (let i = 0; i < gameState.inventory.slots.length; i++) {
                    const slot = gameState.inventory.slots[i];
                    if (slot.item === itemId) {
                        const maxStack = itemType.maxStack || 999;
                        const canAdd = Math.min(count, maxStack - slot.count);
                        slot.count += canAdd;
                        count -= canAdd;
                        if (count <= 0) return true;
                    }
                }
            }
            
            // 找空格子放置
            for (let i = 0; i < gameState.inventory.slots.length; i++) {
                const slot = gameState.inventory.slots[i];
                if (slot.item === null) {
                    slot.item = itemId;
                    slot.count = itemType.stackable ? count : 1;
                    return true;
                }
            }
            
            return false; // 物品栏已满
        }
        
        // 从物品栏移除物品
        function removeItemFromInventory(slotIndex, count = 1) {
            const slot = gameState.inventory.slots[slotIndex];
            if (!slot.item) return false;
            
            slot.count -= count;
            if (slot.count <= 0) {
                slot.item = null;
                slot.count = 0;
            }
            return true;
        }
        
        // 获取当前选中的物品
        function getSelectedItem() {
            const slot = gameState.inventory.slots[gameState.inventory.selectedSlot];
            if (!slot.item) return null;
            return ITEM_TYPES[slot.item];
        }
        
        // 消耗物品（恢复饱食度等效果）
        function consumeItem() {
            const selectedSlot = gameState.inventory.selectedSlot;
            const slot = gameState.inventory.slots[selectedSlot];
            
            // 检查是否选中了物品
            if (!slot.item) {
                return false;
            }
            
            const itemType = ITEM_TYPES[slot.item];
            
            // 只有 consumable 类型的物品可以被消耗
            if (!itemType || itemType.type !== 'consumable') {
                return false;
            }
            
            // 处理不同的消耗品
            if (slot.item === 'apple') {
                // 检查饱食度是否已满
                if (gameState.hunger >= gameState.maxHunger) {
                    return false;
                }
                
                // 消耗一个苹果
                removeItemFromInventory(selectedSlot, 1);
                
                // 恢复10点饱食度
                gameState.hunger = Math.min(gameState.maxHunger, gameState.hunger + 10);
                return true;
            }
            
            // 其他消耗品可以在这里添加
            
            return false;
        }
        
        // 将合成栏物品返回到背包
        function returnCraftingSlotsToInventory() {
            // 遍历所有合成栏格子
            for (let i = 0; i < gameState.inventory.craftingSlots.length; i++) {
                const craftingSlot = gameState.inventory.craftingSlots[i];
                
                if (craftingSlot.item && craftingSlot.count > 0) {
                    const itemId = craftingSlot.item;
                    let remainingCount = craftingSlot.count;
                    const itemType = ITEM_TYPES[itemId];
                    const maxStack = itemType.maxStack || 999;
                    
                    // 首先检查物品栏中是否存在该物品的堆叠
                    let hasExistingStack = false;
                    
                    // 检查热键栏
                    for (let j = 0; j < gameState.inventory.slots.length; j++) {
                        if (gameState.inventory.slots[j].item === itemId) {
                            hasExistingStack = true;
                            break;
                        }
                    }
                    
                    // 检查背包栏
                    if (!hasExistingStack) {
                        for (let j = 0; j < gameState.inventory.backpackSlots.length; j++) {
                            if (gameState.inventory.backpackSlots[j].item === itemId) {
                                hasExistingStack = true;
                                break;
                            }
                        }
                    }
                    
                    // 如果存在堆叠，则尝试堆叠到现有物品上
                    if (hasExistingStack) {
                        // 先尝试热键栏
                        for (let j = 0; j < gameState.inventory.slots.length; j++) {
                            if (remainingCount <= 0) break;
                            const slot = gameState.inventory.slots[j];
                            if (slot.item === itemId && slot.count < maxStack) {
                                const canAdd = Math.min(remainingCount, maxStack - slot.count);
                                slot.count += canAdd;
                                remainingCount -= canAdd;
                            }
                        }
                        
                        // 再尝试背包栏
                        for (let j = 0; j < gameState.inventory.backpackSlots.length; j++) {
                            if (remainingCount <= 0) break;
                            const slot = gameState.inventory.backpackSlots[j];
                            if (slot.item === itemId && slot.count < maxStack) {
                                const canAdd = Math.min(remainingCount, maxStack - slot.count);
                                slot.count += canAdd;
                                remainingCount -= canAdd;
                            }
                        }
                    }
                    
                    // 如果还有剩余（没有堆叠或堆叠已满），找序号最小的空格子放置
                    if (remainingCount > 0) {
                        // 先尝试热键栏（序号0-9）
                        for (let j = 0; j < gameState.inventory.slots.length; j++) {
                            if (remainingCount <= 0) break;
                            const slot = gameState.inventory.slots[j];
                            if (!slot.item) {
                                slot.item = itemId;
                                slot.count = remainingCount;
                                remainingCount = 0;
                                break;
                            }
                        }
                        
                        // 再尝试背包栏（序号10+）
                        if (remainingCount > 0) {
                            for (let j = 0; j < gameState.inventory.backpackSlots.length; j++) {
                                if (remainingCount <= 0) break;
                                const slot = gameState.inventory.backpackSlots[j];
                                if (!slot.item) {
                                    slot.item = itemId;
                                    slot.count = remainingCount;
                                    remainingCount = 0;
                                    break;
                                }
                            }
                        }
                    }
                    
                    // 清空合成栏格子
                    craftingSlot.item = null;
                    craftingSlot.count = 0;
                }
            }
        }
        
        // 挖掘方块
        function mineBlock(gridX, gridY) {
            // 检查坐标是否有效
            if (gridX < 0 || gridX >= WORLD_CONFIG.width || 
                gridY < 0 || gridY >= WORLD_CONFIG.height) {
                return false;
            }
            
            // 检查是否在挖掘范围内
            if (!gameState.mouse.inRange) {
                return false;
            }
            
            const block = getBlock(gridX, gridY);
            
            // 检查是否是空气
            if (!block || block.id === 'air') {
                return false;
            }
            
            // 检查是否是水方块（水方块完全不可挖掘）
            if (block.id === 'water') {
                return false;
            }
            
            // 检查是否是基岩（无法挖掘）
            if (block.id === 'bedrock') {
                return false;
            }
            
            // 获取方块类型信息
            const blockType = BLOCK_TYPES[block.id];
            if (!blockType) return false;
            
            // 特殊处理：草地上方有树干时无法挖掘
            if (block.id === 'grassDirt') {
                const aboveBlock = getBlock(gridX, gridY - 1);
                if (aboveBlock && aboveBlock.id === 'trunk') {
                    return false;
                }
            }
            
            // 特殊处理：墓碑
            if (block.id === 'tombstone') {
                // 找到对应的墓碑数据
                const tombstoneIndex = gameState.tombstones.findIndex(t => t.x === gridX && t.y === gridY);
                if (tombstoneIndex !== -1) {
                    const tombstone = gameState.tombstones[tombstoneIndex];
                    
                    // 将墓碑中的物品返还给玩家
                    tombstone.inventory.forEach(slot => {
                        if (slot.item && slot.count > 0) {
                            addItemToInventory(slot.item, slot.count);
                        }
                    });
                    
                    // 移除墓碑数据
                    gameState.tombstones.splice(tombstoneIndex, 1);
                    
                    // 移除墓碑方块
                    setBlock(gridX, gridY, BLOCK_TYPES.air);
                    return true;
                }
            }
            
            // 检查工具等级（是否能挖掘）
            const selectedItem = getSelectedItem();
            const toolLevel = selectedItem && selectedItem.type === 'tool' ? selectedItem.miningLevel : 0;
            const requiredLevel = blockType.miningLevel || 0;
            
            if (toolLevel < requiredLevel) {
                // 工具等级不够，无法挖掘
                return false;
            }
            
            // 计算挖掘伤害（工具伤害或基础伤害）
            let miningDamage = GAME_CONFIG.miningDamage; // 基础伤害（空手）
            if (selectedItem && selectedItem.type === 'tool' && selectedItem.miningDamage) {
                miningDamage = selectedItem.miningDamage; // 使用工具的伤害
                
                // 铜镐对岩石和所有矿石有特异性伤害
                if (selectedItem.id === 'copperPickaxe') {
                    const isRockOrOre = block.id === 'stone' || 
                                       block.id === 'copperOre' || 
                                       block.id === 'ironOre' || 
                                       block.id === 'silverOre' ||
                                       block.id === 'goldOre' ||
                                       block.id === 'diamondOre';
                    if (isRockOrOre) {
                        miningDamage = 18; // 对岩石和矿石固定18点伤害（6 × 3）
                    }
                }
                
                // 铜斧对树干有特异性伤害
                if (selectedItem.id === 'copperAxe') {
                    const isWood = block.id === 'trunk' || block.id === 'log';
                    if (isWood) {
                        miningDamage = 15; // 对树干固定15点伤害（5 × 3）
                    }
                }
            }
            
            // 扣除 HP
            block.hp -= miningDamage;
            
            // 计算方块中心的世界坐标
            const blockSize = WORLD_CONFIG.blockSize;
            const centerX = (gridX + 0.5) * blockSize;
            const centerY = (gridY + 0.5) * blockSize;
            
            // 创建粒子效果
            const particleCount = block.hp <= 0 ? 20 : 8; // 破坏时更多粒子
            createParticleExplosion(centerX, centerY, blockType.color, particleCount);
            
            // 如果 HP 归零，破坏方块
            if (block.hp <= 0) {
                // 生成掉落物
                createDrop(gridX, gridY, blockType);
                
                // 如果是树干，检查并破坏相连的树木
                if (block.id === 'trunk') {
                    breakConnectedTree(gridX, gridY);
                }
                
                // 设为空气
                setBlock(gridX, gridY, BLOCK_TYPES.air);
                
                // 【环境唤醒1】挖掘方块后唤醒周围的水
                // 将被破坏方块的坐标及其上下左右四个邻居加入 activeWaterSet
                wakeUpWaterBlock(gridX, gridY, activeWaterSet);
                
                return true; // 方块被破坏
            }
            
            return true; // 成功挖掘
        }
        
        // 破坏树干及其上方的树木（从砍伐点向上破坏）
        function breakConnectedTree(startX, startY) {
            const trunks = []; // 收集当前及上方的树干
            const leaves = new Set(); // 使用Set避免重复
            
            // 第一步：从起始树干开始，只向上搜索树干
            function searchTrunksAbove(x, y) {
                // 边界检查
                if (x < 0 || x >= WORLD_CONFIG.width || y < 0 || y >= WORLD_CONFIG.height) return;
                
                const block = getBlock(x, y);
                if (!block || block.id !== 'trunk') return;
                
                // 记录这个树干
                trunks.push({ x, y });
                
                // 只向上搜索（递归检查上方的树干）
                searchTrunksAbove(x, y - 1);
            }
            
            // 第二步：搜索所有树干周围的树叶（限制搜索范围）
            function searchLeavesAroundTrunks() {
                const maxLeafDistance = 3; // 树叶距离树干的最大距离
                
                for (const trunk of trunks) {
                    // 在树干周围的范围内搜索树叶
                    for (let dy = -maxLeafDistance; dy <= maxLeafDistance; dy++) {
                        for (let dx = -maxLeafDistance; dx <= maxLeafDistance; dx++) {
                            const x = trunk.x + dx;
                            const y = trunk.y + dy;
                            const key = `${x},${y}`;
                            
                            // 如果已经检查过，跳过
                            if (leaves.has(key)) continue;
                            
                            // 边界检查
                            if (x < 0 || x >= WORLD_CONFIG.width || y < 0 || y >= WORLD_CONFIG.height) continue;
                            
                            const block = getBlock(x, y);
                            if (block && block.id === 'leaves') {
                                // 检查这个树叶是否能通过树叶路径连接到当前树干
                                if (isLeafConnectedToTrunk(x, y, trunk.x, trunk.y, maxLeafDistance)) {
                                    leaves.add(key);
                                }
                            }
                        }
                    }
                }
            }
            
            // 检查树叶是否通过树叶路径连接到树干（使用BFS，限制距离）
            function isLeafConnectedToTrunk(leafX, leafY, trunkX, trunkY, maxDistance) {
                const queue = [{ x: leafX, y: leafY, dist: 0 }];
                const visited = new Set([`${leafX},${leafY}`]);
                
                while (queue.length > 0) {
                    const current = queue.shift();
                    
                    // 如果到达树干，返回true
                    if (current.x === trunkX && current.y === trunkY) {
                        return true;
                    }
                    
                    // 如果距离超过限制，跳过
                    if (current.dist >= maxDistance) continue;
                    
                    // 搜索8个方向
                    const directions = [
                        { dx: -1, dy: -1 }, { dx: 0, dy: -1 }, { dx: 1, dy: -1 },
                        { dx: -1, dy: 0 },                      { dx: 1, dy: 0 },
                        { dx: -1, dy: 1 },  { dx: 0, dy: 1 },  { dx: 1, dy: 1 }
                    ];
                    
                    for (const dir of directions) {
                        const newX = current.x + dir.dx;
                        const newY = current.y + dir.dy;
                        const key = `${newX},${newY}`;
                        
                        if (visited.has(key)) continue;
                        visited.add(key);
                        
                        // 边界检查
                        if (newX < 0 || newX >= WORLD_CONFIG.width || newY < 0 || newY >= WORLD_CONFIG.height) continue;
                        
                        const block = getBlock(newX, newY);
                        // 可以通过树叶或树干到达
                        if (block && (block.id === 'leaves' || block.id === 'trunk')) {
                            queue.push({ x: newX, y: newY, dist: current.dist + 1 });
                        }
                    }
                }
                
                return false;
            }
            
            // 执行搜索：从当前位置向上搜索树干
            searchTrunksAbove(startX, startY);
            searchLeavesAroundTrunks();
            
            // 破坏所有找到的树干
            for (const pos of trunks) {
                const block = getBlock(pos.x, pos.y);
                if (block && block.id === 'trunk') {
                    createDrop(pos.x, pos.y, BLOCK_TYPES.trunk);
                    
                    const blockSize = WORLD_CONFIG.blockSize;
                    const centerX = (pos.x + 0.5) * blockSize;
                    const centerY = (pos.y + 0.5) * blockSize;
                    createParticleExplosion(centerX, centerY, BLOCK_TYPES.trunk.color, 10);
                    
                    setBlock(pos.x, pos.y, BLOCK_TYPES.air);
                }
            }
            
            // 破坏所有找到的树叶
            for (const key of leaves) {
                const [x, y] = key.split(',').map(Number);
                const block = getBlock(x, y);
                if (block && block.id === 'leaves') {
                    createDrop(x, y, BLOCK_TYPES.leaves);
                    
                    const blockSize = WORLD_CONFIG.blockSize;
                    const centerX = (x + 0.5) * blockSize;
                    const centerY = (y + 0.5) * blockSize;
                    createParticleExplosion(centerX, centerY, BLOCK_TYPES.leaves.color, 10);
                    
                    setBlock(x, y, BLOCK_TYPES.air);
                }
            }
        }
        
        // 处理持续挖掘
        function handleContinuousMining() {
            const currentTime = performance.now();
            
            // 检查是否在挖掘（攻击）
            const selectedItem = getSelectedItem();
            const isMining = gameState.mouse.isDown && selectedItem && selectedItem.type === 'tool';
            
            // 如果正在使用工具，检查扇形攻击范围内的史莱姆
            if (isMining) {
                // 检查攻击间隔
                const timeSinceLastMine = currentTime - gameState.mining.lastMineTime;
                if (timeSinceLastMine >= GAME_CONFIG.miningInterval) {
                    // 计算镐子的扇形攻击范围
                    const player = gameState.player;
                    const playerCenterX = player.x + player.width / 2;
                    // 扇形中心下降到玩家身体下半部分，更容易攻击到脚下的史莱姆
                    const playerCenterY = player.y + player.height * 0.75; // 从中心(0.5)下降到0.75位置
                    const facingRight = player.facingRight;
                    
                    // 扇形参数（扩大攻击范围）
                    const attackRadius = 40; // 增大攻击半径（从35增加到40）
                    
                    // 检查每个史莱姆是否在扇形范围内
                    for (let i = 0; i < gameState.slimes.length; i++) {
                        const slime = gameState.slimes[i];
                        
                        // 计算史莱姆中心相对于玩家的位置
                        const slimeCenterX = slime.x + slime.width / 2;
                        const slimeCenterY = slime.y + slime.height / 2;
                        const dx = slimeCenterX - playerCenterX;
                        const dy = slimeCenterY - playerCenterY;
                        
                        // 计算距离
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        // 检查是否在攻击半径内
                        if (distance <= attackRadius + slime.width / 2) {
                            // 计算角度（相对于水平向右的角度，-180到180度）
                            let angle = Math.atan2(dy, dx) * 180 / Math.PI;
                            
                            // 扩大判定：攻击范围超过半圆，更容易命中
                            let inSector = false;
                            if (facingRight) {
                                // 面向右：可以攻击右侧大范围（-100度到100度，200度范围）
                                inSector = angle >= -100 && angle <= 100;
                            } else {
                                // 面向左：可以攻击左侧大范围（80度到280度）
                                inSector = (angle >= 80 && angle <= 180) || (angle >= -180 && angle <= -80);
                            }
                            
                            if (inSector) {
                                // 在扇形范围内，进行攻击
                                let attackDamage = GAME_CONFIG.miningDamage; // 基础伤害（空手）
                                if (selectedItem && selectedItem.miningDamage) {
                                    attackDamage = selectedItem.miningDamage; // 使用工具的伤害
                                }
                                
                                // 攻击史莱姆
                                slime.takeDamage(attackDamage);
                                
                                // 使用基类的击退系统
                                gameState.player.knockbackTarget(slime, dx, dy);
                                
                                gameState.mining.lastMineTime = currentTime;
                                
                                // 创建攻击特效（使用史莱姆的颜色）
                                for (let j = 0; j < 5; j++) {
                                    const particle = new Particle(
                                        slimeCenterX,
                                        slimeCenterY,
                                        slime.color.body // 使用史莱姆的身体颜色
                                    );
                                    gameState.particles.push(particle);
                                }
                                
                                // 只攻击一个史莱姆，然后继续检查方块挖掘
                                break;
                            }
                        }
                    }
                }
            }
            
            // 检查鼠标位置是否有效
            if (gameState.mouse.gridX < 0 || gameState.mouse.gridY < 0) {
                gameState.mining.targetX = -1;
                gameState.mining.targetY = -1;
                return;
            }
            
            // 获取当前鼠标位置的方块
            const currentBlock = getBlock(gameState.mouse.gridX, gameState.mouse.gridY);
            
            // 检查是否在挖掘范围内
            if (!gameState.mouse.inRange) {
                gameState.mining.targetX = -1;
                gameState.mining.targetY = -1;
                return;
            }
            
            // 检查当前位置是否有可挖掘的方块
            const hasValidBlock = currentBlock && currentBlock.id !== 'air';
            
            if (!hasValidBlock) {
                // 当前位置是空气，但不立即重置目标
                // 只有当鼠标移动到新位置且新位置也是空气时才重置
                if (gameState.mining.targetX === gameState.mouse.gridX && 
                    gameState.mining.targetY === gameState.mouse.gridY) {
                    // 鼠标还在刚破坏的方块位置，重置目标
                    gameState.mining.targetX = -1;
                    gameState.mining.targetY = -1;
                }
                return;
            }
            
            // 有可挖掘的方块
            // 检查是否切换到新方块（包括从空气切换到方块）
            const targetChanged = (gameState.mining.targetX !== gameState.mouse.gridX || 
                                  gameState.mining.targetY !== gameState.mouse.gridY);
            
            if (targetChanged) {
                // 切换到新方块，需要检查延迟（避免快速移动光标挖烂地表）
                const timeSinceLastMine = currentTime - gameState.mining.lastMineTime;
                if (timeSinceLastMine >= GAME_CONFIG.miningInterval) {
                    // 达到挖掘间隔，可以切换并挖掘新方块
                    gameState.mining.targetX = gameState.mouse.gridX;
                    gameState.mining.targetY = gameState.mouse.gridY;
                    gameState.mining.lastMineTime = currentTime;
                    mineBlock(gameState.mouse.gridX, gameState.mouse.gridY);
                }
                // 如果未达到间隔，不更新目标，等待下一帧
            } else {
                // 同一个方块，检查是否到达挖掘间隔
                const timeSinceLastMine = currentTime - gameState.mining.lastMineTime;
                if (timeSinceLastMine >= GAME_CONFIG.miningInterval) {
                    const success = mineBlock(gameState.mouse.gridX, gameState.mouse.gridY);
                    if (success) {
                        gameState.mining.lastMineTime = currentTime;
                    }
                }
            }
        }
        
        // 检查方块是否与玩家碰撞
        function isBlockCollidingWithPlayer(gridX, gridY) {
            if (!gameState.player) return false;
            
            const blockSize = WORLD_CONFIG.blockSize;
            
            // 方块的矩形区域
            const blockLeft = gridX * blockSize;
            const blockRight = (gridX + 1) * blockSize;
            const blockTop = gridY * blockSize;
            const blockBottom = (gridY + 1) * blockSize;
            
            // 玩家的矩形区域
            const playerLeft = gameState.player.x;
            const playerRight = gameState.player.x + gameState.player.width;
            const playerTop = gameState.player.y;
            const playerBottom = gameState.player.y + gameState.player.height;
            
            // AABB 碰撞检测
            return !(blockRight <= playerLeft || 
                     blockLeft >= playerRight || 
                     blockBottom <= playerTop || 
                     blockTop >= playerBottom);
        }
        
        // 检查方块是否有相邻的实心方块
        function hasAdjacentBlock(gridX, gridY) {
            // 检查上下左右四个方向
            const directions = [
                { x: 0, y: -1 },  // 上
                { x: 0, y: 1 },   // 下
                { x: -1, y: 0 },  // 左
                { x: 1, y: 0 }    // 右
            ];
            
            for (const dir of directions) {
                const checkX = gridX + dir.x;
                const checkY = gridY + dir.y;
                const block = getBlock(checkX, checkY);
                
                // 如果相邻位置有实心方块，返回 true
                if (block && block.id !== 'air') {
                    return true;
                }
            }
            
            return false;
        }
        
        // 放置方块
        function placeBlock(gridX, gridY) {
            // 1. 检查坐标是否有效
            if (gridX < 0 || gridX >= WORLD_CONFIG.width || 
                gridY < 0 || gridY >= WORLD_CONFIG.height) {
                return false;
            }
            
            // 2. 检查是否在放置范围内
            if (!gameState.mouse.inRange) {
                return false;
            }
            
            // 3. 检查是否选中了可放置的物品
            const selectedItem = getSelectedItem();
            if (!selectedItem || selectedItem.type !== 'block') {
                return false;
            }
            
            // 4. 检查物品栏中是否有该物品
            const slot = gameState.inventory.slots[gameState.inventory.selectedSlot];
            if (slot.count <= 0) {
                return false;
            }
            
            const block = getBlock(gridX, gridY);
            
            // 5. 检查是否是空气方块
            if (!block || block.id !== 'air') {
                return false;
            }
            
            // 6. 检查是否与玩家碰撞（仅对固体方块检查）
            const blockType = selectedItem.blockType;
            if (blockType.solid && isBlockCollidingWithPlayer(gridX, gridY)) {
                return false;
            }
            
            // 7. 检查是否有相邻方块（防止悬浮放置）
            if (!hasAdjacentBlock(gridX, gridY)) {
                return false;
            }
            
            // 所有检查通过，放置方块
            setBlock(gridX, gridY, blockType);
            
            // 【环境唤醒2】放置方块后唤醒周围的水
            // 将该坐标及其上下左右邻居加入 activeWaterSet
            wakeUpWaterBlock(gridX, gridY, activeWaterSet);
            
            // 立即检查下方是否有草地需要退化
            checkGrassDegradation(gridX, gridY + 1);
            
            // 从物品栏移除一个物品
            removeItemFromInventory(gameState.inventory.selectedSlot, 1);
            
            // 创建放置特效（少量粒子）
            const blockSize = WORLD_CONFIG.blockSize;
            const centerX = (gridX + 0.5) * blockSize;
            const centerY = (gridY + 0.5) * blockSize;
            createParticleExplosion(centerX, centerY, blockType.color, 5);
            
            return true;
        }
        
        // 放置水（使用水桶）
        function placeWater(gridX, gridY) {
            // 1. 检查坐标是否有效
            if (gridX < 0 || gridX >= WORLD_CONFIG.width || 
                gridY < 0 || gridY >= WORLD_CONFIG.height) {
                return false;
            }
            
            // 2. 检查是否在放置范围内
            if (!gameState.mouse.inRange) {
                return false;
            }
            
            // 3. 检查是否选中了水桶
            const selectedItem = getSelectedItem();
            if (!selectedItem || selectedItem.special !== 'waterBucket') {
                return false;
            }
            
            const block = getBlock(gridX, gridY);
            
            // 4. 检查是否是空气方块
            if (!block || block.id !== 'air') {
                return false;
            }
            
            // 5. 水是非固体方块，不检查与玩家的碰撞

            // 所有检查通过，放置水方块
            const waterBlockType = BLOCK_TYPES.water;

            setBlock(gridX, gridY, waterBlockType, 8, true);
            
            // 【第10步】唤醒机制：将新放置的水方块及其邻居加入活跃集合
            // 这样才能触发无限水生成逻辑（如果左右两侧都是真水源）
            wakeUpWaterBlock(gridX, gridY, activeWaterSet);
            
            // 将水桶替换为空桶
            const slot = gameState.inventory.slots[gameState.inventory.selectedSlot];
            slot.item = 'emptyBucket';
            slot.count = 1;
            
            // 触发挥舞动画

            gameState.toolSwing.timer = gameState.toolSwing.duration;

            const blockSize = WORLD_CONFIG.blockSize;
            const centerX = (gridX + 0.5) * blockSize;
            const centerY = (gridY + 0.5) * blockSize;
            createParticleExplosion(centerX, centerY, '#4A90E2', 10);
            
            console.log('放置真水源方块（waterLevel = 8, isSource = true），水桶变为空桶');
            
            return true;
        }
        
        // 收集水（使用空桶）
        function collectWater(gridX, gridY) {
            // 1. 检查坐标是否有效
            if (gridX < 0 || gridX >= WORLD_CONFIG.width || 
                gridY < 0 || gridY >= WORLD_CONFIG.height) {
                return false;
            }
            
            // 2. 检查是否在操作范围内
            if (!gameState.mouse.inRange) {
                return false;
            }
            
            // 3. 检查是否选中了空桶
            const selectedItem = getSelectedItem();
            if (!selectedItem || selectedItem.special !== 'emptyBucket') {

            }
